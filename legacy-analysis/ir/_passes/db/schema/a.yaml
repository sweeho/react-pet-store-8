findings:
  - kind: ambiguity
    path: legacy-source/db/schema/petstore_oracle.sql
    description: >
      The DDL and its comments state that the CMP-derived tables are reconstructed from ejb-jar.xml because no DDL ships in the source, so these tables describe an intended schema rather than one the application demonstrably runs. Also the comment at line 231 names batch/ps_catalog_check.sh, while the batch folder holds catalog_check.sql. A human should confirm which file is current.
  - kind: ambiguity
    path: legacy-source/db/schema/petstore_cloudscape.sql
    description: >
      Cloudscape DDL uses char(10) for key columns where Oracle uses varchar2(10). char pads with blanks, which can change key comparisons. Which dialect reflects the live system is not stated.

