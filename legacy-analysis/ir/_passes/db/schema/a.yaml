records:
  - record_key: CATALOG-ENT-0001
    kind: entity
    capability_key: catalog-browsing
    requirement: >
      The system SHALL store the catalog as a hierarchy of category, product and item, where each product belongs to exactly one category and each item belongs to exactly one product.
    confidence: high
    confidence_basis: >
      Primary and foreign keys declared in both the Oracle and Cloudscape DDL (two places), and the header cites PopulateSQL.xml as origin.
    risk_class: operational
    basis: Primary keys on catid, productid, itemid; foreign keys product->category and item->product; indexes on the foreign keys.
    plain_text: >
      Every pet belongs to a product type, and every product type belongs to one category such as dogs or fish.
    technical_note: >
      Tables category, product, item with FKs fk_product_1 and fk_item_1. Indexes ix_product_catid and ix_item_productid. Key columns are 10 characters.
    interface: false
    traces:
      - path: legacy-source/db/schema/petstore_oracle.sql
        line_start: 13
        line_end: 15
        excerpt: |
          CREATE TABLE category (
            catid varchar2(10) not null,
            constraint pk_category primary key (catid));
      - path: legacy-source/db/schema/petstore_oracle.sql
        line_start: 30
        line_end: 34
        excerpt: |
          CREATE TABLE product (
            productid varchar2(10) not null,
            catid varchar2(10) not null,
            constraint pk_product primary key (productid),
            constraint fk_product_1 foreign key (catid) references category (catid));
      - path: legacy-source/db/schema/petstore_oracle.sql
        line_start: 49
        line_end: 53
        excerpt: |
          CREATE TABLE item (
            itemid varchar2(10) not null,
            productid varchar2(10) not null,
            constraint pk_item primary key (itemid),
            constraint fk_item_1 foreign key (productid) references product (productid));
    stack_metadata:
      db.object: category, product, item

  - record_key: LOCALIZATION-ENT-0001
    kind: entity
    capability_key: localization
    requirement: >
      The system SHALL hold the name, image and description of each category, product and item once per locale, keyed by the entity identifier plus locale, and SHALL require a name for every category and product locale row and an image and description for every item locale row.
    confidence: high
    confidence_basis: >
      Composite primary keys and NOT NULL constraints in the Oracle DDL, mirrored in the Cloudscape DDL.
    risk_class: operational
    basis: Details tables have composite PK (id, locale) and NOT NULL on name, or on image and descn for items.
    plain_text: >
      Each category, product and pet has its own text for every language the store supports, and a name is always required.
    technical_note: >
      category_details, product_details, item_details with PK (id, locale). Image and description are optional for category and product but mandatory for item.
    interface: false
    traces:
      - path: legacy-source/db/schema/petstore_oracle.sql
        line_start: 19
        line_end: 26
        excerpt: |
          CREATE TABLE category_details (
            catid varchar2(10) not null,
            name varchar2(80) not null,
            image varchar2(255),
            descn varchar2(255),
            locale varchar2(10) not null,
            constraint pk_category_details primary key (catid, locale),
            constraint fk_category_details_1 foreign key (catid) references category (catid));
      - path: legacy-source/db/schema/petstore_oracle.sql
        line_start: 38
        line_end: 45
        excerpt: |
          CREATE TABLE product_details (
            productid varchar2(10) not null,
            locale varchar2(10) not null,
            name varchar2(80) not null,
            image varchar2(255),
            descn varchar2(255),
            constraint pk_product_details primary key (productid, locale),
            constraint fk_product_details_1 foreign key (productid) references product (productid));
      - path: legacy-source/db/schema/petstore_oracle.sql
        line_start: 57
        line_end: 70
        excerpt: |
          CREATE TABLE item_details (
            itemid varchar2(10) not null,
            listprice decimal(10,2) not null,
            unitcost decimal(10,2) not null,
            locale varchar2(10) not null,
            image varchar2(255) not null,
            descn varchar2(255) not null,
            attr1 varchar2(80),
            attr2 varchar2(80),
            attr3 varchar2(80),
            attr4 varchar2(80),
            attr5 varchar2(80),
            constraint pk_item_details primary key (itemid, locale),
            constraint fk_item_details_1 foreign key (itemid) references item (itemid));
    stack_metadata:
      db.object: category_details, product_details, item_details

  - record_key: CATALOG-REQ-0001
    kind: requirement
    capability_key: catalog-browsing
    requirement: >
      The system SHALL record for each item and locale a list price and a unit cost, both mandatory decimals of up to 10 digits with 2 decimal places, and up to five optional descriptive attributes of at most 80 characters.
    confidence: medium
    confidence_basis: >
      One clear place (DDL, mirrored per dialect). The comment defines listprice as shelf price and unitcost as supplier cost; no code was read in this pass.
    risk_class: financial
    basis: item_details columns listprice and unitcost decimal(10,2) not null; attr1..attr5 varchar2(80).
    plain_text: >
      Every pet has a shelf price and a supplier cost in each locale, and can carry up to five descriptive attributes such as colour or age.
    technical_note: >
      item_details.listprice, unitcost, attr1..attr5. Price is per locale, so the same item can have different prices per locale.
    interface: false
    traces:
      - path: legacy-source/db/schema/petstore_oracle.sql
        line_start: 55
        line_end: 68
        excerpt: |
          -- ITEM_DETAILS: Localised price, image, description and up to five attributes of an item. LISTPRICE is the shelf price, UNITCOST the supplier cost.
          -- Source: PopulateSQL.xml
          CREATE TABLE item_details (
            itemid varchar2(10) not null,
            listprice decimal(10,2) not null,
            unitcost decimal(10,2) not null,
            locale varchar2(10) not null,
            image varchar2(255) not null,
            descn varchar2(255) not null,
            attr1 varchar2(80),
            attr2 varchar2(80),
            attr3 varchar2(80),
            attr4 varchar2(80),
            attr5 varchar2(80),
    stack_metadata:
      db.object: item_details

  - record_key: SIGNON-ENT-0001
    kind: entity
    capability_key: sign-on-security
    requirement: >
      The system SHALL store one sign-on credential per user name, with a user name of up to 50 characters that is unique and a mandatory password of up to 50 characters.
    confidence: high
    confidence_basis: >
      PK constraint plus NOT NULL in DDL, and the comment states the plain-text storage explicitly.
    risk_class: regulated
    basis: signon_user primary key on username; password not null; comment says PASSWORD is plain text.
    plain_text: >
      Each user name can exist only once and has a password. Passwords are kept as readable text today.
    technical_note: >
      signon_user (username PK, password). Maps CMP bean UserEJB. customer.user_id references signon_user.username.
    interface: false
    traces:
      - path: legacy-source/db/schema/petstore_oracle.sql
        line_start: 72
        line_end: 77
        excerpt: |
          -- SIGNON_USER: Sign-on credentials. One row per user name. PASSWORD is plain text.
          -- Source: CMP bean UserEJB (signon)
          CREATE TABLE signon_user (
            username varchar2(50) not null,
            password varchar2(50) not null,
            constraint pk_signon_user primary key (username));
    stack_metadata:
      ejb.bean: UserEJB
      db.object: signon_user

  - record_key: ACCOUNTS-ENT-0001
    kind: entity
    capability_key: customer-accounts
    requirement: >
      The system SHALL model a customer as one sign-on user linked to exactly one account and exactly one profile, where the customer identifier equals the sign-on user name.
    confidence: high
    confidence_basis: >
      Three foreign keys on customer plus the comment stating USERID equals USERNAME.
    risk_class: operational
    basis: customer PK user_id with FKs to signon_user, account and profile.
    plain_text: >
      A registered shopper has one login, one account with contact and payment details, and one set of preferences.
    technical_note: >
      customer(user_id PK -> signon_user.username, account_id -> account, profile_id -> profile). Maps CustomerEJB. Nothing in the DDL makes account_id or profile_id unique, so one-to-one is enforced by application code only.
    interface: false
    traces:
      - path: legacy-source/db/schema/petstore_oracle.sql
        line_start: 133
        line_end: 142
        excerpt: |
          -- CUSTOMER: A registered shopper. USERID equals SIGNON_USER.USERNAME.
          -- Source: CMP bean CustomerEJB (customer)
          CREATE TABLE customer (
            user_id varchar2(50) not null,
            account_id varchar2(40) not null,
            profile_id varchar2(40) not null,
            constraint pk_customer primary key (user_id),
            constraint fk_customer_1 foreign key (user_id) references signon_user (username),
            constraint fk_customer_2 foreign key (account_id) references account (account_id),
            constraint fk_customer_3 foreign key (profile_id) references profile (profile_id));
    stack_metadata:
      ejb.bean: CustomerEJB
      db.object: customer

  - record_key: ACCOUNTS-ENT-0002
    kind: entity
    capability_key: customer-accounts
    requirement: >
      The system SHALL store an account with a mandatory status, a mandatory contact information reference and a mandatory credit card reference.
    confidence: high
    confidence_basis: NOT NULL and FK constraints in DDL; header comment cites AccountEJB.
    risk_class: operational
    basis: account table with FKs to contact_info and credit_card.
    plain_text: >
      An account always has a status, contact details and a payment card.
    technical_note: >
      account(account_id PK, status varchar2(20), contact_id FK, card_id FK). Allowed status values are not constrained in the DDL.
    interface: false
    traces:
      - path: legacy-source/db/schema/petstore_oracle.sql
        line_start: 112
        line_end: 121
        excerpt: |
          -- ACCOUNT: Customer account: contact information, payment card and status.
          -- Source: CMP bean AccountEJB (customer)
          CREATE TABLE account (
            account_id varchar2(40) not null,
            status varchar2(20) not null,
            contact_id varchar2(40) not null,
            card_id varchar2(40) not null,
            constraint pk_account primary key (account_id),
            constraint fk_account_1 foreign key (contact_id) references contact_info (contact_id),
            constraint fk_account_2 foreign key (card_id) references credit_card (card_id));
    stack_metadata:
      ejb.bean: AccountEJB
      db.object: account

  - record_key: ACCOUNTS-ENT-0003
    kind: entity
    capability_key: customer-accounts
    requirement: >
      The system SHALL store contact information with mandatory family name, given name, telephone, e-mail and address reference, and an address with mandatory street line 1, city, state, zip code and country and an optional street line 2.
    confidence: high
    confidence_basis: NOT NULL constraints and FK in DDL, both dialects; comment says address is shared by accounts, orders and supplier orders.
    risk_class: regulated
    basis: contact_info and address tables hold personal data and are shared across accounts, purchase orders and supplier orders.
    plain_text: >
      Every contact has a name, phone, e-mail and a full postal address; a second street line is optional.
    technical_note: >
      contact_info(contact_id PK, address_id FK) and address(address_id PK). Referenced by account, purchase_order and supplier_order. Personal data, so likely subject to privacy rules.
    interface: false
    traces:
      - path: legacy-source/db/schema/petstore_oracle.sql
        line_start: 79
        line_end: 101
        excerpt: |
          -- ADDRESS: Postal address. Shared by contact information on accounts, orders and supplier orders.
          -- Source: CMP bean AddressEJB (address)
          CREATE TABLE address (
            address_id varchar2(40) not null,
            street_name1 varchar2(80) not null,
            street_name2 varchar2(80),
            city varchar2(80) not null,
            state varchar2(40) not null,
            zip_code varchar2(20) not null,
            country varchar2(40) not null,
            constraint pk_address primary key (address_id));

          -- CONTACT_INFO: Name, e-mail, telephone and address of a person.
          -- Source: CMP bean ContactInfoEJB (contactinfo)
          CREATE TABLE contact_info (
            contact_id varchar2(40) not null,
            family_name varchar2(80) not null,
            given_name varchar2(80) not null,
            telephone varchar2(40) not null,
            email varchar2(120) not null,
            address_id varchar2(40) not null,
            constraint pk_contact_info primary key (contact_id),
            constraint fk_contact_info_1 foreign key (address_id) references address (address_id));
    stack_metadata:
      ejb.bean: AddressEJB, ContactInfoEJB
      db.object: address, contact_info

  - record_key: ACCOUNTS-ENT-0004
    kind: entity
    capability_key: customer-accounts
    requirement: >
      The system SHALL store per customer a profile with a mandatory preferred language, an optional favourite category, and mandatory on/off flags for the my-list preference and the banner preference.
    confidence: medium
    confidence_basis: One clear place, the DDL; the flag semantics are inferred from column names.
    risk_class: presentational
    basis: profile table.
    plain_text: >
      A shopper's saved preferences are their language, favourite pet category, and whether to show their list and banner.
    technical_note: >
      profile(profile_id PK, preferred_language, favorite_category, my_list_preference number(1), banner_preference number(1)). favorite_category has no FK to category. The flags have no CHECK limiting them to 0 or 1.
    interface: false
    traces:
      - path: legacy-source/db/schema/petstore_oracle.sql
        line_start: 123
        line_end: 131
        excerpt: |
          -- PROFILE: Storefront preferences of a customer.
          -- Source: CMP bean ProfileEJB (customer)
          CREATE TABLE profile (
            profile_id varchar2(40) not null,
            preferred_language varchar2(10) not null,
            favorite_category varchar2(10),
            my_list_preference number(1) not null,
            banner_preference number(1) not null,
            constraint pk_profile primary key (profile_id));
    stack_metadata:
      ejb.bean: ProfileEJB
      db.object: profile

  - record_key: CHECKOUT-ENT-0001
    kind: entity
    capability_key: checkout-payment
    requirement: >
      The system SHALL store a payment card with a mandatory card number, card type and expiry date, where the expiry date is held as text of up to 10 characters such as 04/04.
    confidence: medium
    confidence_basis: One clear place (DDL and comment). No validation of the expiry format is visible in the schema.
    risk_class: regulated
    basis: credit_card table; comment states the number is stored in clear.
    plain_text: >
      A payment card has a number, a type and an expiry date. The card number is stored unprotected today.
    technical_note: >
      credit_card(card_id PK, card_number varchar2(40), card_type, expiry_date varchar2(10)). Maps CreditCardEJB. Referenced by account and purchase_order.
    interface: false
    traces:
      - path: legacy-source/db/schema/petstore_oracle.sql
        line_start: 103
        line_end: 110
        excerpt: |
          -- CREDIT_CARD: Payment card. CARDNUMBER is stored in clear. EXPIRYDATE is text such as 04/04.
          -- Source: CMP bean CreditCardEJB (creditcard)
          CREATE TABLE credit_card (
            card_id varchar2(40) not null,
            card_number varchar2(40) not null,
            card_type varchar2(40) not null,
            expiry_date varchar2(10) not null,
            constraint pk_credit_card primary key (card_id));
    stack_metadata:
      ejb.bean: CreditCardEJB
      db.object: credit_card

  - record_key: CHECKOUT-ENT-0002
    kind: entity
    capability_key: checkout-payment
    requirement: >
      The system SHALL store each purchase order with a mandatory user, e-mail, date in epoch milliseconds, locale, total value of up to 12 digits with 2 decimals, a contact reference (ship-to) and a credit card reference.
    confidence: high
    confidence_basis: DDL constraints in both dialects, comment, and indexes on user and date.
    risk_class: financial
    basis: purchase_order table.
    plain_text: >
      Each order records who placed it, when, in which locale, the order total, where to ship it and which card paid.
    technical_note: >
      purchase_order(po_id PK, po_user_id, po_email_id, po_date number(19), po_locale, po_value number(12,2), contact_id FK, card_id FK). po_user_id has no FK to customer or signon_user. Indexes ix_po_user and ix_po_date.
    interface: false
    traces:
      - path: legacy-source/db/schema/petstore_oracle.sql
        line_start: 144
        line_end: 157
        excerpt: |
          -- PURCHASE_ORDER: Order received by the Order Processing Center (OPC). PODATE is epoch milliseconds. POVALUE is the order total.
          -- Source: CMP bean PurchaseOrderEJB (purchaseorder)
          CREATE TABLE purchase_order (
            po_id varchar2(40) not null,
            po_user_id varchar2(50) not null,
            po_email_id varchar2(120) not null,
            po_date number(19) not null,
            po_locale varchar2(10) not null,
            po_value number(12,2) not null,
            contact_id varchar2(40) not null,
            card_id varchar2(40) not null,
            constraint pk_purchase_order primary key (po_id),
            constraint fk_purchase_order_1 foreign key (contact_id) references contact_info (contact_id),
            constraint fk_purchase_order_2 foreign key (card_id) references credit_card (card_id));
    stack_metadata:
      ejb.bean: PurchaseOrderEJB
      db.object: purchase_order

  - record_key: CHECKOUT-BR-0001
    kind: business-rule
    capability_key: shopping-cart
    requirement: >
      The system SHALL require every order line to have a quantity greater than zero and a quantity shipped that never exceeds the quantity ordered.
    confidence: high
    confidence_basis: Two CHECK constraints plus NOT NULL columns, repeated in the Cloudscape DDL.
    risk_class: financial
    basis: ck_po_line_qty and ck_po_line_shipped.
    plain_text: >
      An order line must be for at least one unit, and the store can never record shipping more units than were ordered.
    technical_note: >
      po_line_item with PK (po_id, line_number), FK to purchase_order. Lines have no FK to item, so item_id, product_id and category_id are not checked against the catalog. Filed under shopping-cart as the closest home for line quantity rules.
    interface: false
    traces:
      - path: legacy-source/db/schema/petstore_oracle.sql
        line_start: 161
        line_end: 171
        excerpt: |
          CREATE TABLE po_line_item (
            po_id varchar2(40) not null,
            line_number varchar2(10) not null,
            category_id varchar2(10) not null,
            product_id varchar2(10) not null,
            item_id varchar2(10) not null,
            quantity integer not null,
            unit_price number(12,2) not null,
            quantity_shipped integer not null,
            constraint pk_po_line_item primary key (po_id, line_number),
            constraint fk_po_line_item_1 foreign key (po_id) references purchase_order (po_id));
      - path: legacy-source/db/schema/petstore_oracle.sql
        line_start: 232
        line_end: 233
        excerpt: |
          ALTER TABLE po_line_item ADD CONSTRAINT ck_po_line_qty CHECK (quantity > 0);
          ALTER TABLE po_line_item ADD CONSTRAINT ck_po_line_shipped CHECK (quantity_shipped <= quantity);
    stack_metadata:
      ejb.bean: LineItemEJB
      db.object: po_line_item

  - record_key: WORKFLOW-BR-0001
    kind: business-rule
    capability_key: order-processing-workflow
    requirement: >
      The system SHALL track one process-manager state per order, limited to PENDING, APPROVED, DENIED or COMPLETED.
    confidence: high
    confidence_basis: CHECK constraint, an index on status, the table comment and a view joining it to purchase orders.
    risk_class: operational
    basis: ck_order_manager_status and table comment.
    plain_text: >
      Every order is at one of four stages: pending, approved, denied or completed.
    technical_note: >
      order_manager(order_id PK, status). No FK from order_id to purchase_order, though v_order_status joins them. Transitions between states are not expressed in the schema. Maps ManagerEJB.
    interface: false
    traces:
      - path: legacy-source/db/schema/petstore_oracle.sql
        line_start: 173
        line_end: 178
        excerpt: |
          -- ORDER_MANAGER: OPC process manager state of an order. STATUS is PENDING, APPROVED, DENIED or COMPLETED.
          -- Source: CMP bean ManagerEJB (processmanager)
          CREATE TABLE order_manager (
            order_id varchar2(40) not null,
            status varchar2(20) not null,
            constraint pk_order_manager primary key (order_id));
      - path: legacy-source/db/schema/petstore_oracle.sql
        line_start: 234
        line_end: 234
        excerpt: |
          ALTER TABLE order_manager ADD CONSTRAINT ck_order_manager_status CHECK (status in ('PENDING','APPROVED','DENIED','COMPLETED'));
    stack_metadata:
      ejb.bean: ManagerEJB
      db.object: order_manager, ck_order_manager_status

  - record_key: WORKFLOW-REQ-0001
    kind: requirement
    capability_key: order-processing-workflow
    requirement: >
      The system SHALL provide an operations view listing, for each order, its identifier, user, date, value and process-manager status.
    confidence: medium
    confidence_basis: One place, the view definition; who consumes it is not visible here.
    risk_class: operational
    basis: v_order_status joins purchase_order and order_manager on order id.
    plain_text: >
      Operations staff can see every order with its status and value in one list.
    technical_note: >
      View v_order_status, inner join, so purchase orders without an order_manager row are not listed.
    interface: true
    traces:
      - path: legacy-source/db/schema/petstore_oracle.sql
        line_start: 225
        line_end: 228
        excerpt: |
          -- Order status view used by operations: one row per order with its OPC status and value.
          CREATE VIEW v_order_status AS
            SELECT p.po_id, p.po_user_id, p.po_date, p.po_value, m.status
            FROM purchase_order p JOIN order_manager m ON m.order_id = p.po_id;
    stack_metadata:
      db.object: v_order_status

  - record_key: SUPPLIER-ENT-0001
    kind: entity
    capability_key: supplier-fulfilment
    requirement: >
      The system SHALL store each supplier order with a mandatory date in epoch milliseconds, a status of PENDING or COMPLETED, and a contact reference, together with its order lines carrying the same quantity rules as purchase order lines.
    confidence: high
    confidence_basis: CHECK constraint on status, FKs, and the same shape as po_line_item, in both dialects.
    risk_class: operational
    basis: supplier_order and supplier_line_item tables.
    plain_text: >
      The supplier keeps its own copy of each order it receives, which is either pending or completed.
    technical_note: >
      supplier_order(po_id PK), supplier_line_item(PK po_id,line_number). ck_supplier_order_status. Unlike po_line_item, supplier_line_item has no CHECK on quantity or quantity_shipped.
    interface: true
    traces:
      - path: legacy-source/db/schema/petstore_oracle.sql
        line_start: 180
        line_end: 202
        excerpt: |
          -- SUPPLIER_ORDER: Order the supplier received from the OPC. POSTATUS is PENDING or COMPLETED.
          -- Source: CMP bean SupplierOrderEJB (supplierpo)
          CREATE TABLE supplier_order (
            po_id varchar2(40) not null,
            po_date number(19) not null,
            po_status varchar2(20) not null,
            contact_id varchar2(40) not null,
            constraint pk_supplier_order primary key (po_id),
            constraint fk_supplier_order_1 foreign key (contact_id) references contact_info (contact_id));
      - path: legacy-source/db/schema/petstore_oracle.sql
        line_start: 235
        line_end: 235
        excerpt: |
          ALTER TABLE supplier_order ADD CONSTRAINT ck_supplier_order_status CHECK (po_status in ('PENDING','COMPLETED'));
    stack_metadata:
      ejb.bean: SupplierOrderEJB, LineItemEJB
      db.object: supplier_order, supplier_line_item

  - record_key: SUPPLIER-BR-0001
    kind: business-rule
    capability_key: supplier-fulfilment
    requirement: >
      The system SHALL hold one stock quantity per item and SHALL NOT allow that quantity to be negative.
    confidence: high
    confidence_basis: CHECK constraint, PK and table comment.
    risk_class: operational
    basis: ck_inventory_qty.
    plain_text: >
      The supplier has one stock count per pet and it can never drop below zero.
    technical_note: >
      inventory(item_id PK, quantity). No FK to item. Maps InventoryEJB.
    interface: false
    traces:
      - path: legacy-source/db/schema/petstore_oracle.sql
        line_start: 206
        line_end: 209
        excerpt: |
          CREATE TABLE inventory (
            item_id varchar2(10) not null,
            quantity integer not null,
            constraint pk_inventory primary key (item_id));
      - path: legacy-source/db/schema/petstore_oracle.sql
        line_start: 236
        line_end: 236
        excerpt: |
          ALTER TABLE inventory ADD CONSTRAINT ck_inventory_qty CHECK (quantity >= 0);
    stack_metadata:
      ejb.bean: InventoryEJB
      db.object: inventory, ck_inventory_qty

  - record_key: WORKFLOW-ENT-0002
    kind: entity
    capability_key: order-processing-workflow
    requirement: >
      The system SHALL keep named counters, each with a unique name and an integer value, from which order and purchase order identifiers are generated.
    confidence: medium
    confidence_basis: One place, DDL and its comment; the generating code was not read in this pass.
    risk_class: operational
    basis: counter table.
    plain_text: >
      Order numbers come from a numbered counter kept in the database.
    technical_note: >
      counter(name PK, counter integer). Used by UniqueIdGeneratorEJB (CounterEJB). A 32-bit integer will overflow eventually.
    interface: false
    traces:
      - path: legacy-source/db/schema/petstore_oracle.sql
        line_start: 211
        line_end: 216
        excerpt: |
          -- COUNTER: Named sequence used by UniqueIdGeneratorEJB for order and PO identifiers.
          -- Source: CMP bean CounterEJB (uidgen)
          CREATE TABLE counter (
            name varchar2(40) not null,
            counter integer not null,
            constraint pk_counter primary key (name));
    stack_metadata:
      ejb.bean: CounterEJB
