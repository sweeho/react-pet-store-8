suspected_defects:
  - capability_key: checkout-order-placement
    record_keys: [ORD-REQ-0002]
    severity: medium
    category: data-corruption
    title: Billing info is lost; shipping info stored and returned as billing
    description: >
      Only shipping info is persisted; when reading back, billing info is set from that contact and shipping set equal to it (marked XXX). A distinct billing address is not retained.
    traces:
      - path: legacy-source/app/src/components/purchaseorder/src/com/sun/j2ee/blueprints/purchaseorder/ejb/PurchaseOrderEJB.java
        line_start: 267
        line_end: 268
        excerpt: |
          purchaseOrder.setBillingInfo(getContactInfo().getData());
          purchaseOrder.setShippingInfo(purchaseOrder.getBillingInfo()); // XXX
  - capability_key: order-fulfilment
    record_keys: [ORD-REQ-0004]
    severity: medium
    category: other
    title: Over-shipment prevents completion
    description: Completion uses != rather than >=, so an order shipped more than ordered is never reported complete.
    traces:
      - path: legacy-source/app/src/components/purchaseorder/src/com/sun/j2ee/blueprints/purchaseorder/ejb/PurchaseOrderHelper.java
        line_start: 98
        line_end: 100
        excerpt: |
          if(li.getQuantity() != li.getQuantityShipped()) {
              return false;
  - capability_key: checkout-order-placement
