  - record_key: ORDER-FULFILMENT-REQ-0002
    kind: requirement
    capability_key: order-fulfilment
    requirement: >
      The system SHALL list the orders whose current status equals a given status, without duplicates.
    confidence: high
    confidence_basis: >
      EJB-QL finder in descriptor plus session method calling it; runbook reports stuck PENDING/APPROVED orders.
    risk_class: operational
    basis: findOrdersByStatus query.
    plain_text: >
      The system can list all orders currently at a given status, such as all orders waiting for approval.
    technical_note: >
      EJB-QL "SELECT DISTINCT OBJECT(a) FROM Manager a WHERE a.status = ?1"; exact string match.
