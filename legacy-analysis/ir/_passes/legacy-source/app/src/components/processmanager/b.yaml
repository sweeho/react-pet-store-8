  - record_key: ORDER-FULFILMENT-ENTITY-0001
    kind: entity
    capability_key: order-fulfilment
    requirement: >
      The system SHALL keep exactly one process record per order, holding the order identifier and its current workflow status as a string.
    confidence: high
    confidence_basis: >
      Declared in the entity bean class (abstract accessors) and in the deployment descriptor (cmp-field declarations); two places.
    risk_class: operational
    basis: Container-managed entity with fields orderId and status; created from order id and status.
    plain_text: >
      Each order has one tracking record that holds the order number and where the order currently stands in its processing.
    technical_note: >
      ManagerEJB is a CMP 2.x entity; ejbCreate sets orderId and status and returns null (container-assigned key). Primary key field per ejb-jar.xml.
