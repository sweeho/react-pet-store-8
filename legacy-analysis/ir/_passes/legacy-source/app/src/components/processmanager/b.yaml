  - record_key: ORDER-FULFILMENT-REQ-0001
    kind: requirement
    capability_key: order-fulfilment
    requirement: >
      The system SHALL allow creating a process record for an order with an initial status, reading the status of an order, and changing the status of an order to a caller-supplied value, failing when the order record does not exist.
    confidence: high
    confidence_basis: >
      Session facade methods plus transaction declarations in the descriptor for each. Whether callers constrain values is outside this module.
    risk_class: operational
    basis: ProcessManagerEJB delegates create/find/setStatus to the Manager entity.
    plain_text: >
      Other parts of the system can start tracking an order, look up its status, and move it to a new status. Asking about an unknown order is an error.
    technical_note: >
      createManager -> mlh.create; updateStatus/getStatus -> findByPrimaryKey (FinderException if absent). No validation of status value or of legal transitions here. All methods have trans-attribute Required.
    interface: true
