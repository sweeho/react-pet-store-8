  - record_key: ORDER-FULFILMENT-BR-0001
    kind: business-rule
    capability_key: order-fulfilment
    requirement: >
      The system SHALL recognise the order statuses PENDING, APPROVED, DENIED, SHIPPED_PART and COMPLETED.
    confidence: medium
    confidence_basis: >
      Constants in one class; documents list four statuses (no SHIPPED_PART), so a use of SHIPPED_PART is not confirmed here.
    dispute:
      reason: contradicts-docs
      detail: >
        Code defines SHIPPED_PART (partially completed); user guide section 5 and runbook list only PENDING, APPROVED, DENIED, COMPLETED. Settle by checking whether any other component sets SHIPPED_PART.
    risk_class: operational
    basis: OrderStatusNames constants; user guide status table.
    plain_text: >
      An order is pending, approved, denied, partly shipped or completed. Printed guides mention only four of these.
    technical_note: >
      Plain String constants; the process manager does not enforce them on updateStatus.
    interface: false
    traces:
      - path: legacy-source/app/src/components/processmanager/src/com/sun/j2ee/blueprints/processmanager/ejb/OrderStatusNames.java
        line_start: 50
        line_end: 65
        excerpt: |
          public static final String PENDING = "PENDING";
          public static final String APPROVED = "APPROVED";
          public static final String DENIED = "DENIED";
          public static final String SHIPPED_PART = "SHIPPED_PART";
          public static final String COMPLETED = "COMPLETED";
      - path: legacy-analysis/sources/pdf/petstore-user-guide/extracted.md
        anchor: p1
        excerpt: |
          PENDINGWaiting for the administrator to approve or deny
          APPROVEDApproved and sent to the Supplier, not yet fully invoiced
          DENIEDRefused by the administrator
          COMPLETEDAll lines shipped and invoiced
    stack_metadata:
      framework: EJB 2.x
  - record_key: ORDER-FULFILMENT-WF-0001
    kind: workflow
    capability_key: order-fulfilment
    requirement: >
      The system SHALL instantiate a configurable transition handler by class name for a workflow step, and fail with a transition error when the class cannot be loaded or created.
    confidence: low
    confidence_basis: >
      Only the factory is read; no caller in this module, so reachability and which handlers exist are unknown.
    dispute:
      reason: unresolved-reachability
      detail: >
        No caller of TransitionDelegateFactory in this module. Search the OPC application for users of it to settle whether it runs.
    risk_class: operational
    basis: Reflective instantiation of TransitionDelegate implementations; TransitionInfo carries an XML message or batch.
    plain_text: >
      Each processing step is performed by a pluggable handler chosen by name; if the handler cannot be set up, the step fails.
    technical_note: >
      Class.forName(className).newInstance() wrapped in TransitionException.
    interface: false
    traces:
