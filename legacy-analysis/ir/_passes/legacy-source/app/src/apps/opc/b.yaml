records:
  - record_key: ORDERAPPROVAL-BR-0001
    kind: business-rule
    capability_key: order-approval
    requirement: >
      The system SHALL automatically approve a newly received order whose locale is US when its total price is strictly less than 500, and whose locale is Japan when its total price is strictly less than 50000.
    plain_text: >
      A new order is approved without a human when it is under 500 (US) or under 50,000 (Japan).
    technical_note: >
      PurchaseOrderMDB.canIApprove compares getTotalPrice() with bare literals. No currency conversion; the method comment calls it a stub.
    interface: false
    confidence: high
    confidence_basis: >
      Code literal, javadoc comment, and runbook all state the limits; the boundary wording in the user guide differs (see defect).
    risk_class: financial
    basis: Hard-coded thresholds in the order intake listener; runbook order-flow diagram repeats them.
    traces:
      - path: legacy-source/app/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/PurchaseOrderMDB.java
        line_start: 183
        line_end: 191
        excerpt: |
          private boolean canIApprove(PurchaseOrder purchaseOrder) {
            Locale locale = purchaseOrder.getLocale();
            if (locale.equals(Locale.US)) {
              if (purchaseOrder.getTotalPrice() < 500) return true;
            } else if (locale.equals(Locale.JAPAN))  {
              if (purchaseOrder.getTotalPrice() < 50000) return true;
            }
            return false;
          }
      - path: legacy-analysis/sources/pdf/petstore-operations-runbook/extracted.md
        kind: document
        anchor: p1
        line_start: 24
        line_end: 25
        excerpt: |
          total under limit (US 500, JP 50000)  --> APPROVED automatically
    stack_metadata:
      framework: EJB MDB
      ejb.bean: PurchaseOrderMDB
      ejb.transaction: Required
  - record_key: ORDERAPPROVAL-BR-0002
    kind: business-rule
    capability_key: order-approval
    requirement: >
      GIVEN an order whose locale is neither US nor Japan, or whose total is at or above its locale limit, WHEN it is received THEN the system SHALL leave it PENDING until an administrator approves or denies it.
    plain_text: >
      Orders from any other country, and orders at or over the limit, wait for a person to approve or deny them.
    technical_note: >
      canIApprove falls through to false; no approval message is produced and onMessage does nothing further ("wait for admin").
    interface: false
    confidence: high
    confidence_basis: Explicit fall-through plus comment and runbook text; locale list (e.g. zh_CN) inferred from the two branches only.
    risk_class: financial
    basis: Default false path in canIApprove; comment "else wait for admin to approve/deny orders".
    traces:
      - path: legacy-source/app/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/PurchaseOrderMDB.java
        line_start: 188
        line_end: 190
        excerpt: |
            if (purchaseOrder.getTotalPrice() < 50000) return true;
          }
          return false;
      - path: legacy-analysis/sources/pdf/petstore-operations-runbook/extracted.md
        kind: document
        anchor: p1
        line_start: 25
        line_end: 25
        excerpt: |
          otherwise                              --> PENDING until the Admin client approves or denies
    stack_metadata:
      ejb.bean: PurchaseOrderMDB
  - record_key: FULFIL-WF-0001
    kind: workflow
    capability_key: order-fulfilment
    requirement: >
      WHEN a purchase order message is received the system SHALL persist the purchase order and start its workflow in status PENDING before evaluating auto-approval, and SHALL forward an approval message to the order-approval queue only when auto-approved.
    plain_text: >
      Every incoming order is saved and starts as pending; small orders are then immediately passed on for approval.
    technical_note: >
      PurchaseOrderMDB.doWork -> poHome.create, processManager.createManager(..., PENDING); PurchaseOrderTD sends XML to the OrderApproval queue. Container-managed transaction Required; any checked failure is rethrown as EJBException (message redelivery).
    interface: true
    confidence: high
    confidence_basis: Code in MDB and transition delegate plus ejb-jar transaction settings and runbook flow.
    risk_class: operational
    basis: Intake listener and its transition delegate.
    traces:
      - path: legacy-source/app/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/PurchaseOrderMDB.java
        line_start: 154
        line_end: 163
        excerpt: |
          poHome.create(purchaseOrder);
          //update process manager to start workflow for this purchase order
          processManager.createManager(purchaseOrder.getOrderId(), OrderStatusNames.PENDING);

          if(canIApprove(purchaseOrder)) {
            ChangedOrder co = new ChangedOrder(purchaseOrder.getOrderId(), OrderStatusNames.APPROVED);
            OrderApproval oa = new OrderApproval();
            oa.addOrder(co);
            ret = oa.toXML();
          }
      - path: legacy-source/app/src/apps/opc/src/com/sun/j2ee/blueprints/opc/transitions/PurchaseOrderTD.java
        line_start: 80
        line_end: 90
        excerpt: |
          queueHelper.sendMessage(xmlOrderApproval);
    stack_metadata:
      ejb.bean: PurchaseOrderMDB
      ejb.transaction: Required
      jms.queue: OrderQueue / OrderApprovalQueue
  - record_key: FULFIL-WF-0002
    kind: workflow
    capability_key: order-fulfilment
    requirement: >
      WHEN an order approval/denial message is processed, the system SHALL change status only for orders currently PENDING, silently skipping any order in another status.
    plain_text: >
      A decision is applied only to orders still pending; decisions on already-decided or completed orders are ignored.
    technical_note: >
      OrderApprovalMDB.doWork reads processManager.getStatus and continues the loop if not PENDING; skipped orders are also excluded from the customer-notification list.
    interface: false
    confidence: high
    confidence_basis: Explicit check plus explanatory comment; one location.
    risk_class: operational
    basis: Idempotency guard for repeated or conflicting approvals.
    traces:
      - path: legacy-source/app/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/OrderApprovalMDB.java
        line_start: 201
        line_end: 216
        excerpt: |
          // only PENDING orders can be updated
          //if order alreay APPROVED or DENIED or COMPLETED, then order
          //already processed so dont process again
          String curStatus = processManager.getStatus(co.getOrderId());
          if(!curStatus.equals(OrderStatusNames.PENDING)) {
            continue;
          }
    stack_metadata:
      ejb.bean: OrderApprovalMDB
      ejb.transaction: Required
