  - record_key: FULFIL-WF-0004
    kind: workflow
    capability_key: order-fulfilment
    requirement: >
      WHEN an invoice message is received the system SHALL record the shipped line items against the purchase order and set the order status to COMPLETED if every line is shipped, otherwise to SHIPPED_PART; only on completion SHALL it send a completed-order message to customer relations.
    plain_text: >
      When the supplier reports shipment, the order becomes complete once all items shipped, otherwise partly shipped; only complete orders trigger the completion notice.
    technical_note: >
      InvoiceMDB.doWork uses PurchaseOrderHelper.processInvoice (implemented outside this module) to decide completion; InvoiceTD sends order id to CR completed-order queue. Subscribed to a JMS Topic.
    interface: true
    confidence: high
    confidence_basis: MDB code, ejb-jar topic subscription, runbook "COMPLETED when every line is shipped"; completion test itself is outside this shard.
    risk_class: operational
    basis: Invoice listener and delegate.
    traces:
      - path: legacy-source/app/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/InvoiceMDB.java
        line_start: 162
        line_end: 172
        excerpt: |
          boolean orderDone = poHelper.processInvoice(po, invoiceXDE.getLineItemIds());
          if(orderDone) {
            processManager.updateStatus(invoiceXDE.getOrderId(), OrderStatusNames.COMPLETED);
            completedOrder = invoiceXDE.getOrderId();
          } else {
            processManager.updateStatus(invoiceXDE.getOrderId(), OrderStatusNames.SHIPPED_PART);
          }
