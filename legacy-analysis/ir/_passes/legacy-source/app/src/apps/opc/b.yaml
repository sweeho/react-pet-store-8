findings:
  - kind: ambiguity
    path: legacy-source/app/src/apps/opc/src/ejb-jar.xml
    description: >
      Env-entry values (validation switches, mail switches, transition delegate class) are redacted in the repository, so the default on/off state of email and XML validation cannot be established. A human must supply the deployed values.
suspected_defects:
  - capability_key: order-approval
    record_keys: [ORDERAPPROVAL-BR-0001]
    severity: medium
    category: contradicts-document
    title: Boundary at the approval limit differs between code and user guide
    description: >
      Code approves when total < 500 so exactly 500 is pending; the user guide says pending when value is "greater than $500", which would make exactly 500 non-pending. Also, the code treats Japan 50000 limit as a raw number with no currency conversion (comment calls it a stub).
    traces:
      - path: legacy-source/app/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/PurchaseOrderMDB.java
        line_start: 186
        line_end: 186
      - path: legacy-analysis/sources/pdf/petstore-user-guide/extracted.md
        kind: document
        anchor: p1
        line_start: 65
        line_end: 65
        anchor: p1
  - capability_key: order-fulfilment
    record_keys: [FULFIL-WF-0003]
    severity: medium
    category: data-corruption
    title: Duplicate or partial processing when supplier PO or mail send fails
    description: >
      Status is updated in the process manager before messages are sent; JMS send failures are rethrown as EJBException, relying on the container transaction. QueueHelper closes the connection but swallows close errors with a stderr print only; sessions are created transacted (true) on a separate connection, so the send commits independently of the MDB transaction.
    traces:
      - path: legacy-source/app/src/apps/opc/src/com/sun/j2ee/blueprints/opc/transitions/QueueHelper.java
        line_start: 71
        line_end: 71
  - capability_key: localization
    record_keys: [LOCAL-BR-0001]
    severity: low
    category: unreachable-branch
    title: Locale variant branch never taken
    description: >
      variantIndex is initialised to -1 and never reassigned, so the variant branch cannot run.
    traces:
      - path: legacy-source/app/src/apps/opc/src/com/sun/j2ee/blueprints/opc/customerrelations/ejb/LocaleUtil.java
        line_start: 62
        line_end: 67
