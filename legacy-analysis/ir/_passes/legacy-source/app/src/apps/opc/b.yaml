      Approving an order sends the supplier a purchase order with the customer's shipping details and items; denied orders are not sent.
    technical_note: >
      OrderApprovalMDB.getXmlPO via TPASupplierOrderXDE; OrderApprovalTD sends each PO then the mail list to the mail queue. Wrapped in one container transaction.
