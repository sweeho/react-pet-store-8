records:
  - record_key: ORDER-APPROVAL-BR-0001
    kind: business-rule
    capability_key: order-approval
    requirement: >
      The system SHALL automatically approve a newly received purchase order when its locale is en_US and its total price is below 500, or its locale is ja_JP and its total price is below 50000; all other orders (including every other locale) SHALL remain PENDING for human approval.
    confidence: medium
    confidence_basis: >
      One clear method with bare literals 500 and 50000; no config, test or document found in this module. Currency of the threshold is implicit in the locale.
    risk_class: financial
    basis: canIApprove compares getTotalPrice to hard-coded limits per locale, with the comment that it lets small orders flow without the admin GUI.
    plain_text: >
      Small orders (under 500 for US customers, under 50,000 for Japanese customers) are approved automatically. Everything else waits for a person to approve or deny it.
    technical_note: >
      PurchaseOrderMDB.canIApprove; Locale.equals(US / JAPAN). Any other locale, including zh_CN, never auto-approves. Limits are not configurable.
    interface: false
    traces:
      - path: legacy-source/app/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/PurchaseOrderMDB.java
        line_start: 183
        line_end: 191
        excerpt: |
          private boolean canIApprove(PurchaseOrder purchaseOrder) {
            Locale locale = purchaseOrder.getLocale();
            if (locale.equals(Locale.US)) {
              if (purchaseOrder.getTotalPrice() < 500) return true;
            } else if (locale.equals(Locale.JAPAN))  {
              if (purchaseOrder.getTotalPrice() < 50000) return true;
            }
            return false;
          }
    stack_metadata:
      framework: EJB 2.x
      ejb.bean: PurchaseOrderMDB
      ejb.transaction: Container
