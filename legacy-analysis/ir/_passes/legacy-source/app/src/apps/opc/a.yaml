  - record_key: CUSTOMER-NOTIFICATIONS-REQ-0001
    kind: requirement
    capability_key: customer-notifications
    requirement: >
      The system SHALL email the customer on the order's contact address with subject "Java Pet Store Order Status: <orderId>" for each approval/denial, "Java Pet Store Order Shipped: <orderId>" for a shipment, and "Java Pet Store Order COMPLETED: <orderId>" for a completed order, with the body rendered from a locale-specific stylesheet and handed to the mail-sender queue.
    confidence: high
    confidence_basis: Subject constants in code and matching stylesheets for each message type and locale present in the module.
    risk_class: operational
    basis: MAIL_SUBJECT constants; Mail(email, subject, message).toXML() sent to MailQueue via the transition delegates, which skip null messages.
    plain_text: >
      Customers receive an email whenever their order is approved or denied, shipped, or completed, with the order number in the subject and text in their own language.
    technical_note: >
      Mail is not sent directly: an XML Mail document is queued to a separate mailer service. Approval notices produce one mail per order in the batch. Brand "Java Pet Store" is hard-coded in subjects.
    interface: true
    traces:
