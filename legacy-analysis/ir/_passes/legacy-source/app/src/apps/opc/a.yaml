  - record_key: ORDER-APPROVAL-WF-0001
    kind: workflow
    capability_key: order-approval
    requirement: >
      WHEN a PENDING order receives an approval decision, the system SHALL record the new status with the process manager and SHALL include the decision in the batch sent to customer relations for notification; for APPROVED orders it SHALL additionally build a supplier purchase order and send it to the supplier purchase-order queue.
    confidence: high
    confidence_basis: Logic in OrderApprovalMDB.doWork plus delivery in OrderApprovalTD; consistent in both.
    risk_class: operational
    basis: updateStatus, then APPROVED branch builds XML PO from PO contact, address and line items; OrderApprovalTD sends each PO then the mail list.
    plain_text: >
      When an order is approved or denied, its status is updated and the customer is told. Approved orders are also sent to the supplier to be fulfilled; denied orders are not.
    technical_note: >
      Supplier PO XML carries order id, date, shipping name/address/email/phone and per-line category, product, item, line number, quantity, unit price. Order of sends: all supplier POs first, then the mail batch, in one onMessage. Delegate class is chosen by env-entry param/transitiondelegate/OrderApprovalTD.
    interface: true
    traces:
      - path: legacy-source/app/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/OrderApprovalMDB.java
        line_start: 215
        line_end: 222
