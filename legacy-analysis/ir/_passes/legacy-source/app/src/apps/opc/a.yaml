  - record_key: ORDER-APPROVAL-BR-0002
    kind: business-rule
    capability_key: order-approval
    requirement: >
      GIVEN an order-approval message listing orders, WHEN an order's current status is not PENDING, THEN the system SHALL skip that order: it is not updated, not sent to the supplier and not included in the customer notification.
    confidence: high
    confidence_basis: Enforced by an explicit status check with explanatory comments; the same list drives both notification and supplier PO, so the skip is consistent.
    risk_class: operational
    basis: Loop in doWork continues when status != PENDING.
    plain_text: >
      An order can only be approved or denied once. Repeat decisions for orders already approved, denied or completed are ignored.
    technical_note: OrderApprovalMDB.doWork; status read from ProcessManager.getStatus. Skipped orders are silent (no log, no error to the admin).
    interface: false
    traces:
      - path: legacy-source/app/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/OrderApprovalMDB.java
        line_start: 200
        line_end: 206
        excerpt: |
          // only PENDING orders can be updated
          //if order alreay APPROVED or DENIED or COMPLETED, then order
          //already processed so dont process again
          String curStatus = processManager.getStatus(co.getOrderId());
          if(!curStatus.equals(OrderStatusNames.PENDING)) {
            continue;
          }
