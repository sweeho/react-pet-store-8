  - record_key: ORDER-FULFILMENT-WF-0002
    kind: workflow
    capability_key: order-fulfilment
    requirement: >
      WHEN a supplier invoice message is received, the system SHALL apply the invoiced line items to the purchase order; if all line items are then fulfilled the order status SHALL become COMPLETED and a completed-order message (order id) SHALL be sent to customer relations, otherwise the status SHALL become SHIPPED_PART and nothing is sent to the completed-order queue.
    confidence: medium
    confidence_basis: Clear in InvoiceMDB; the completeness decision is inside PurchaseOrderHelper.processInvoice, which is outside this module and was not read.
    risk_class: operational
    basis: orderDone from processInvoice drives COMPLETED vs SHIPPED_PART.
    plain_text: >
      When a supplier ships some or all of an order, the order shows "partly shipped" until every item is covered, then "completed" and the customer is told.
    technical_note: >
      InvoiceMDB subscribes to a JMS Topic (shared with MailInvoiceMDB). Validation toggles: param/xml/validation/Invoice, param/xml/XSDValidation.
    interface: true
    traces:
      - path: legacy-source/app/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/InvoiceMDB.java
        line_start: 160
        line_end: 171
        excerpt: |
          boolean orderDone = poHelper.processInvoice(po, invoiceXDE.getLineItemIds());
          if(orderDone) {
            processManager.updateStatus(invoiceXDE.getOrderId(), OrderStatusNames.COMPLETED);
            completedOrder = invoiceXDE.getOrderId();
          } else {
            processManager.updateStatus(invoiceXDE.getOrderId(), OrderStatusNames.SHIPPED_PART);
          }
          return completedOrder;
    stack_metadata:
      ejb.bean: InvoiceMDB
      jms.queue: CompletedOrderMailQueue; supplier invoice topic
  - record_key: CUSTOMER-NOTIFICATIONS-BR-0001
    kind: business-rule
    capability_key: customer-notifications
    requirement: >
      The system SHALL send the order-status email, the shipment (partial invoice) email and the completed-order email only when the corresponding switch (approval mail, confirmation mail, completed-order mail) is enabled; WHEN a switch is off, the incoming message SHALL be consumed and no email SHALL be produced.
    confidence: high
    confidence_basis: Same switch pattern in three beans, backed by three env-entries in the deployment descriptor (values redacted in the source, so defaults not visible).
    risk_class: operational
    basis: Each MDB reads a boolean at creation and wraps doWork/doTransition in if (sendConfirmationMail).
    plain_text: >
      Each kind of customer email (order approved/denied, shipped, completed) can be switched on or off separately. When off, the event happens but no email is sent.
    technical_note: >
      Env-entries param/SendApprovalMail, param/SendConfirmationMail, param/SendCompletedOrderMail. The shipment mail switch is named "Confirmation". Actual deployed values redacted in ejb-jar.xml.
