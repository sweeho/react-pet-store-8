suspected_defects:
  - capability_key: platform-operations
    record_keys: [ORR-RULE-0003]
    severity: medium
    category: other
    title: Backup deletes previous undated backup folder before the new one succeeds
    description: >
      The script removes any PetStoreDB folder before running the backup; on failure exit 8 occurs with the dated copies intact, but the previous-day copy is retained only under its dated name. A same-day rerun also removes the earlier same-day dated copy before moving the new one, so a failed second attempt is not an issue but the old copy is replaced without verification of the new one beyond ij's exit status.
    traces:
      - path: legacy-source/batch/ps_db_backup.sh
        line_start: 7
        line_end: 10
        excerpt: |
          rm -rf "$PS_BACKUP_DIR/PetStoreDB"
          ps_ij "$PS_SQL/db_backup.sql" > /dev/null || { ps_log "FAILED: backup"; exit 8; }
          rm -rf "$PS_BACKUP_DIR/PetStoreDB_$STAMP"
          mv "$PS_BACKUP_DIR/PetStoreDB" "$PS_BACKUP_DIR/PetStoreDB_$STAMP"
  - capability_key: order-retention-reporting
    record_keys: [ORR-REQ-0006]
    severity: high
    category: data-corruption
    title: Purge only selects orders that have a contact_info row, and deletes shared contact/address/card rows by id
    description: >
      The purge joins contact_info with an inner join, so an old COMPLETED or DENIED order whose contact row is absent is never purged. Contact, address and card rows are deleted by ids taken from the order without checking that no other order references them.
    traces:
      - path: legacy-source/db/batch/order_purge.sql
        line_start: 10
        line_end: 24
        excerpt: |
          JOIN contact_info c ON c.contact_id = p.contact_id
          DELETE FROM contact_info       WHERE contact_id IN (SELECT contact_id FROM session.purge_po);
          DELETE FROM address            WHERE address_id IN (SELECT address_id FROM session.purge_po);
  - capability_key: order-retention-reporting
    record_keys: [ORR-RULE-0007]
    severity: medium
    category: other
    title: Purge protection depends on the scheduler, not on the data
    description: >
      The extract only covers the previous day, yet the purge removes everything older than 180 days; the "extracted first" guarantee holds only if every daily extract ran successfully for each of those days. No script check verifies it.
    traces:
      - path: legacy-source/db/batch/order_purge.sql
        line_start: 1
        line_end: 3
        excerpt: |
          -- PS_ORDER_PURGE: delete COMPLETED and DENIED orders older than 180 days.
          -- Runs only after PS_ORDER_EXTRACT so every order has been extracted first.
  - capability_key: order-retention-reporting
    record_keys: [ORR-REQ-0008]
    severity: low
    category: contradicts-document
    title: Aging script comment contradicts the query
    description: >
      The script header says orders "not COMPLETED or DENIED" are listed, which would include other statuses; the SQL and runbook list only PENDING and APPROVED.
    traces:
      - path: legacy-source/batch/ps_order_aging_report.sh
        line_start: 3
        line_end: 3
        excerpt: |
          # Lists orders not COMPLETED or DENIED after 24 hours (stuck in the OPC flow)
      - path: legacy-source/db/batch/order_aging.sql
        line_start: 6
        line_end: 6
        excerpt: |
          WHERE m.status IN ('PENDING', 'APPROVED') AND p.po_date < :CUTOFF_MS
  - capability_key: order-retention-reporting
    record_keys: [ORR-REQ-0010]
    severity: low
    category: contradicts-document
    title: Catalog check C4 comment lists fixed locales but the query uses the category's locales
    description: >
      The comment says items must have a description for en_US, ja_JP and zh_CN; the query takes locales from category_details, so a missing locale row in the category hides the gap.
    traces:
      - path: legacy-source/db/batch/catalog_check.sql
        line_start: 11
        line_end: 14
        excerpt: |
          -- C4: items missing a description for a locale the store serves (en_US, ja_JP, zh_CN)
          SELECT 'C4' AS chk, i.itemid, l.locale FROM item i, category_details l
           WHERE l.catid = (SELECT p.catid FROM product p WHERE p.productid = i.productid)
  - capability_key: platform-operations
    record_keys: [ORR-REQ-0013]
    severity: medium
    category: error-swallowed
    title: Exit code 8 from purge, inventory report and catalog first load raises no alert
    description: >
      Only backup, extract, aging, catalog (code 4) and health check have notification handlers; a failed purge or inventory report, or failed catalog populate, ends with code 8 and is only visible in the batch log.
    traces:
      - path: legacy-source/scheduler/control-m/PS_PETSTORE.xml
        line_start: 68
        line_end: 77
        excerpt: |
          JOBNAME="PS_ORDER_PURGE"
          <INCOND NAME="PS_ORDER_EXTRACT-OK" ODATE="ODAT" AND_OR="A" />
          <OUTCOND NAME="PS_ORDER_PURGE-OK" ODATE="ODAT" SIGN="+" />
findings:
  - kind: ambiguity
    path: legacy-source/scheduler/control-m/PS_PETSTORE.xml
    description: >
      Runbook says backup reruns are 10 minutes apart; the Control-M export only holds MAXRERUN and DAYSCAL="PS_CAL" (calendar not included), so which days the backup actually runs is undetermined.
