    technical_note: >
      Job PS_CATALOG_CHECK (Command) ps_catalog_check.sh, CRITICAL=1. The 'first load when empty' appears only in DESCRIPTION.
    interface: false
    confidence: medium
    confidence_basis: >
      Job definition clear; empty-load behaviour only described.
    risk_class: operational
    basis: >
      Job definition.
    traces:
