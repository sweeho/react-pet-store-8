    technical_note: >
      Folder PS_PETSTORE_CYCLIC, job PS_HEALTH_CHECK, CYCLIC=1, INTERVAL=00010M, TIMEFROM 0000 to TIMETO 2359, ps_health_check.sh; NOTOK DOMAIL.
