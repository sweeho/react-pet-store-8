  - record_key: BATCH-REQ-0006
    kind: requirement
    capability_key: batch-operations
    requirement: >
      The system SHALL produce a daily report, at or after 01:45 and only after the order extract is OK, of orders stuck in PENDING or APPROVED status for more than 24 hours, and SHALL email ps-ops@example.invalid (urgency R) when the job ends with completion status 4, pointing to order_aging_YYYYMMDD.txt.
    plain_text: >
      Each night a report lists orders that have waited more than a day without moving on; if any are found, operations is emailed.
    technical_note: >
      Job PS_ORDER_AGING_REPORT, ps_order_aging_report.sh, INCOND PS_ORDER_EXTRACT-OK; COMPSTAT=4 triggers the mail. That COMPSTAT=4 means 'stuck orders found' is inferred from the mail text; script not seen.
    interface: false
    confidence: medium
    confidence_basis: >
      Job and mail text agree; the script defining the 24-hour test was not seen.
    risk_class: operational
    basis: >
      Job description and ON handler.
    traces:
      - path: legacy-source/scheduler/control-m/PS_PETSTORE.xml
        line_start: 43
        line_end: 55
        excerpt: |
              <JOB JOBISN="3" APPLICATION="PETSTORE" SUB_APPLICATION="ORDERS" JOBNAME="PS_ORDER_AGING_REPORT"
                   DESCRIPTION="Orders stuck PENDING or APPROVED for more than 24 hours"
                   TASKTYPE="Job"
                   MEMLIB="/opt/petstore/batch" MEMNAME="ps_order_aging_report.sh"
                   RUN_AS="tomcat" NODEID="ps-app01" PRIORITY="AC"
                   TIMEFROM="0145" WEEKDAYS="ALL"
                   CREATED_BY="ps_ops" CREATION_DATE="20031014" CHANGE_DATE="20260915">
                <INCOND NAME="PS_ORDER_EXTRACT-OK" ODATE="ODAT" AND_OR="A" />
                <OUTCOND NAME="PS_ORDER_AGING_REPORT-OK" ODATE="ODAT" SIGN="+" />
                <ON STMT="*" CODE="COMPSTAT=4">
                  <DOMAIL URGENCY="R" DEST="ps-ops@example.invalid" SUBJECT="Petstore stuck orders found" MESSAGE="See /var/petstore/extract/order_aging_YYYYMMDD.txt" />
                </ON>
              </JOB>
    stack_metadata:
      batch.trigger: PS_ORDER_AGING_REPORT 01:45
      framework: Control-M
  - record_key: BATCH-REQ-0007
    kind: requirement
    capability_key: batch-operations
    requirement: >
      The system SHALL produce a daily report, at or after 01:50 and after the order extract is OK, of supplier items with stock below 500 units.
    plain_text: >
      Each night a report lists supplier items with fewer than 500 units in stock.
    technical_note: >
      Job PS_INVENTORY_REPORT (Command task) runs ps_inventory_report.sh. Threshold 500 appears only in DESCRIPTION. No failure notification or MAXRERUN.
    interface: false
    confidence: low
    confidence_basis: >
      Threshold is a bare literal in a description; no code or config corroboration seen.
    risk_class: operational
    basis: >
      Description string only for the threshold.
    traces:
      - path: legacy-source/scheduler/control-m/PS_PETSTORE.xml
        line_start: 57
        line_end: 66
        excerpt: |
              <JOB JOBISN="4" APPLICATION="PETSTORE" SUB_APPLICATION="INVENTORY" JOBNAME="PS_INVENTORY_REPORT"
                   DESCRIPTION="Supplier items with stock below 500 units"
                   TASKTYPE="Command"
                   CMDLINE="/opt/petstore/batch/ps_inventory_report.sh"
                   RUN_AS="tomcat" NODEID="ps-app01" PRIORITY="AC"
                   TIMEFROM="0150" WEEKDAYS="ALL"
                   CREATED_BY="ps_ops" CREATION_DATE="20031014" CHANGE_DATE="20260915">
                <INCOND NAME="PS_ORDER_EXTRACT-OK" ODATE="ODAT" AND_OR="A" />
                <OUTCOND NAME="PS_INVENTORY_REPORT-OK" ODATE="ODAT" SIGN="+" />
              </JOB>
    stack_metadata:
      batch.trigger: PS_INVENTORY_REPORT 01:50
  - record_key: BATCH-REQ-0008
    kind: requirement
    capability_key: batch-operations
    requirement: >
      The system SHALL, on Sundays only, at or after 02:00 and after the order extract is OK, delete COMPLETED and DENIED orders older than 180 days.
    plain_text: >
      Every Sunday night, finished or denied orders older than 180 days are permanently deleted.
    technical_note: >
      Job PS_ORDER_PURGE, ps_order_purge.sh, WEEKDAYS=0, INCOND PS_ORDER_EXTRACT-OK. 180 days and statuses come from DESCRIPTION; script not seen.
    interface: false
    confidence: low
    confidence_basis: >
      Retention literal and statuses only in a description string; script not seen.
    risk_class: regulated
    basis: >
      Description and weekday setting.
    traces:
      - path: legacy-source/scheduler/control-m/PS_PETSTORE.xml
        line_start: 68
        line_end: 77
        excerpt: |
              <JOB JOBISN="5" APPLICATION="PETSTORE" SUB_APPLICATION="ORDERS" JOBNAME="PS_ORDER_PURGE"
                   DESCRIPTION="Delete COMPLETED and DENIED orders older than 180 days (Sundays)"
                   TASKTYPE="Job"
                   MEMLIB="/opt/petstore/batch" MEMNAME="ps_order_purge.sh"
                   RUN_AS="tomcat" NODEID="ps-app01" PRIORITY="AD"
                   TIMEFROM="0200" WEEKDAYS="0"
                   CREATED_BY="ps_ops" CREATION_DATE="20031014" CHANGE_DATE="20260915">
                <INCOND NAME="PS_ORDER_EXTRACT-OK" ODATE="ODAT" AND_OR="A" />
                <OUTCOND NAME="PS_ORDER_PURGE-OK" ODATE="ODAT" SIGN="+" />
              </JOB>
    stack_metadata:
      batch.trigger: PS_ORDER_PURGE Sunday 02:00
      db.object: orders
  - record_key: BATCH-REQ-0009
