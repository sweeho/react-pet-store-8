  - record_key: BATCH-REQ-0012
    kind: requirement
    capability_key: batch-operations
    requirement: >
      The system SHALL, after the order extract is OK, start the aging report, inventory report and (Sundays) purge, each gated only on the extract-OK condition.
    plain_text: >
