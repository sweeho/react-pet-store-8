      - path: legacy-source/scheduler/control-m/PS_PETSTORE.xml
        line_start: 64
        line_end: 64
        excerpt: |
                <INCOND NAME="PS_ORDER_EXTRACT-OK" ODATE="ODAT" AND_OR="A" />
      - path: legacy-source/scheduler/control-m/PS_PETSTORE.xml
        line_start: 75
        line_end: 75
        excerpt: |
                <INCOND NAME="PS_ORDER_EXTRACT-OK" ODATE="ODAT" AND_OR="A" />
    stack_metadata:
      batch.trigger: condition PS_ORDER_EXTRACT-OK
findings:
  - kind: ambiguity
    path: legacy-source/scheduler/control-m/PS_PETSTORE.xml
    description: >
      Shell scripts in /opt/petstore/batch (batch/ in the source tree) hold the actual logic for retention, thresholds and report content; this shard covers only the schedule. Calendar PS_CAL (DAYSCAL on PS_DB_BACKUP) is not defined in the export, so which days the backup runs is unknown.
suspected_defects:
  - capability_key: batch-operations
    record_keys: [BATCH-REQ-0003, BATCH-REQ-0012]
    severity: medium
    category: other
    title: Dependent reports and purge have no failure alert and the chain relies on one-shot conditions
    description: >
      Only the backup and extract jobs alert on NOTOK; the inventory report and purge have no failure handler. A backup failure holds the extract, which silently holds all of the aging report, inventory report and purge, with only the backup alert as a signal.
    traces:
      - path: legacy-source/scheduler/control-m/PS_PETSTORE.xml
        line_start: 57
        line_end: 77
        excerpt: |
              <JOB JOBISN="4" APPLICATION="PETSTORE" SUB_APPLICATION="INVENTORY" JOBNAME="PS_INVENTORY_REPORT"
                   DESCRIPTION="Supplier items with stock below 500 units"
                   TASKTYPE="Command"
                   CMDLINE="/opt/petstore/batch/ps_inventory_report.sh"
                   RUN_AS="tomcat" NODEID="ps-app01" PRIORITY="AC"
                   TIMEFROM="0150" WEEKDAYS="ALL"
                   CREATED_BY="ps_ops" CREATION_DATE="20031014" CHANGE_DATE="20260915">
                <INCOND NAME="PS_ORDER_EXTRACT-OK" ODATE="ODAT" AND_OR="A" />
                <OUTCOND NAME="PS_INVENTORY_REPORT-OK" ODATE="ODAT" SIGN="+" />
              </JOB>
          
              <JOB JOBISN="5" APPLICATION="PETSTORE" SUB_APPLICATION="ORDERS" JOBNAME="PS_ORDER_PURGE"
                   DESCRIPTION="Delete COMPLETED and DENIED orders older than 180 days (Sundays)"
                   TASKTYPE="Job"
                   MEMLIB="/opt/petstore/batch" MEMNAME="ps_order_purge.sh"
                   RUN_AS="tomcat" NODEID="ps-app01" PRIORITY="AD"
                   TIMEFROM="0200" WEEKDAYS="0"
                   CREATED_BY="ps_ops" CREATION_DATE="20031014" CHANGE_DATE="20260915">
                <INCOND NAME="PS_ORDER_EXTRACT-OK" ODATE="ODAT" AND_OR="A" />
                <OUTCOND NAME="PS_ORDER_PURGE-OK" ODATE="ODAT" SIGN="+" />
              </JOB>
