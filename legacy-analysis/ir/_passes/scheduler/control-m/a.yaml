records:
  - record_key: BATCH-REQ-0001
    kind: requirement
    capability_key: batch-operations
    requirement: >
      The system SHALL take an online backup of the Pet Store database every day at or after 01:00, retain backups for 7 days, run it as a critical job, and rerun it up to 2 times on failure.
    plain_text: >
      Every night the store's database is backed up, and the last 7 days of backups are kept. If the backup fails it is retried twice.
    technical_note: >
      Control-M job PS_DB_BACKUP in folder PS_PETSTORE_DAILY runs ps_db_backup.sh; TIMEFROM=0100, WEEKDAYS=ALL, MAXRERUN=2, CRITICAL=1. The 7-day retention is stated only in DESCRIPTION; the script is not in this shard.
    interface: false
    confidence: medium
    confidence_basis: >
      One clear place (job definition); retention exists only in a description string and the script was not seen.
    risk_class: operational
    basis: >
      Job definition and description.
    traces:
      - path: legacy-source/scheduler/control-m/PS_PETSTORE.xml
        line_start: 15
        line_end: 21
        excerpt: |
              <JOB JOBISN="1" APPLICATION="PETSTORE" SUB_APPLICATION="DATABASE" JOBNAME="PS_DB_BACKUP"
                   DESCRIPTION="Online backup of PetStoreDB, keep 7 days"
                   TASKTYPE="Job"
                   MEMLIB="/opt/petstore/batch" MEMNAME="ps_db_backup.sh"
                   RUN_AS="tomcat" NODEID="ps-app01" PRIORITY="AA" CRITICAL="1"
                   TIMEFROM="0100" WEEKDAYS="ALL" DAYSCAL="PS_CAL" MAXRERUN="2"
                   CREATED_BY="ps_ops" CREATION_DATE="20031014" CHANGE_DATE="20260915">
    stack_metadata:
      batch.trigger: Control-M PS_DB_BACKUP 01:00 daily
      framework: Control-M
  - record_key: BATCH-REQ-0002
    kind: requirement
    capability_key: batch-operations
    requirement: >
      The system SHALL email ps-ops@example.invalid with urgency U when the database backup ends not-OK, stating that the order extract is held.
    plain_text: >
      If the nightly backup fails, the operations team is urgently emailed and told the order extract will not run.
    technical_note: >
      ON STMT=* CODE=NOTOK DOMAIL on PS_DB_BACKUP.
    interface: true
    confidence: high
    confidence_basis: >
      Notification defined, and the extract's input condition independently makes the 'held' statement true.
    risk_class: operational
    basis: >
      Backup failure notification.
    traces:
      - path: legacy-source/scheduler/control-m/PS_PETSTORE.xml
        line_start: 23
        line_end: 25
        excerpt: |
                <ON STMT="*" CODE="NOTOK">
                  <DOMAIL URGENCY="U" DEST="ps-ops@example.invalid" SUBJECT="PS_DB_BACKUP failed" MESSAGE="Petstore DB backup failed, order extract is held" />
                </ON>
      - path: legacy-source/scheduler/control-m/PS_PETSTORE.xml
        line_start: 35
        line_end: 35
        excerpt: |
                <INCOND NAME="PS_DB_BACKUP-OK" ODATE="ODAT" AND_OR="A" />
    stack_metadata:
      batch.trigger: PS_DB_BACKUP NOTOK
  - record_key: BATCH-REQ-0003
    kind: workflow
    capability_key: batch-operations
    requirement: >
      The system SHALL run the order extract only after the database backup has completed OK for the same business date, and SHALL consume (remove) the backup-OK condition when the extract starts.
    plain_text: >
      The order export for Finance only starts once that night's backup has succeeded.
    technical_note: >
      PS_DB_BACKUP sets OUTCOND PS_DB_BACKUP-OK (+); PS_ORDER_EXTRACT INCOND requires it, then OUTCOND (-) deletes it and adds PS_ORDER_EXTRACT-OK (+).
    interface: false
    confidence: high
    confidence_basis: >
      Condition chain defined in both jobs' XML, and mail text says extract is held.
    risk_class: operational
    basis: >
      Dependency chain via Control-M conditions.
    traces:
      - path: legacy-source/scheduler/control-m/PS_PETSTORE.xml
        line_start: 22
        line_end: 22
        excerpt: |
                <OUTCOND NAME="PS_DB_BACKUP-OK" ODATE="ODAT" SIGN="+" />
      - path: legacy-source/scheduler/control-m/PS_PETSTORE.xml
        line_start: 35
        line_end: 37
        excerpt: |
                <INCOND NAME="PS_DB_BACKUP-OK" ODATE="ODAT" AND_OR="A" />
                <OUTCOND NAME="PS_DB_BACKUP-OK" ODATE="ODAT" SIGN="-" />
                <OUTCOND NAME="PS_ORDER_EXTRACT-OK" ODATE="ODAT" SIGN="+" />
    stack_metadata:
      batch.trigger: condition PS_DB_BACKUP-OK
  - record_key: BATCH-REQ-0004
    kind: requirement
    capability_key: batch-operations
    requirement: >
      The system SHALL export the previous day's purchase orders to a file named orders_YYYYMMDD.csv for Finance, starting at or after 01:30 daily and rerunning at most once on failure.
    plain_text: >
      Each night, yesterday's orders are exported to a dated spreadsheet file for the Finance team.
    technical_note: >
      Job PS_ORDER_EXTRACT runs ps_order_extract.sh, TIMEFROM=0130, MAXRERUN=1. File name and 'yesterday' come from DESCRIPTION; script not seen.
    interface: true
    confidence: medium
    confidence_basis: >
      Job definition clear; file naming and date window only in description text.
    risk_class: financial
    basis: >
      Job definition and description.
    traces:
      - path: legacy-source/scheduler/control-m/PS_PETSTORE.xml
        line_start: 28
        line_end: 34
        excerpt: |
              <JOB JOBISN="2" APPLICATION="PETSTORE" SUB_APPLICATION="ORDERS" JOBNAME="PS_ORDER_EXTRACT"
                   DESCRIPTION="Export yesterday purchase orders to orders_YYYYMMDD.csv for Finance"
                   TASKTYPE="Job"
                   MEMLIB="/opt/petstore/batch" MEMNAME="ps_order_extract.sh"
                   RUN_AS="tomcat" NODEID="ps-app01" PRIORITY="AB"
                   TIMEFROM="0130" WEEKDAYS="ALL" MAXRERUN="1"
                   CREATED_BY="ps_ops" CREATION_DATE="20031014" CHANGE_DATE="20260915">
    stack_metadata:
      batch.trigger: Control-M PS_ORDER_EXTRACT 01:30 daily
  - record_key: BATCH-REQ-0005
    kind: requirement
    capability_key: batch-operations
    requirement: >
      The system SHALL email ps-finance@example.invalid with urgency R when the order extract ends not-OK, stating that the Finance extract was not produced.
    plain_text: >
