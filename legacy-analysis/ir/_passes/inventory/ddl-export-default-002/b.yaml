records:
  - record_key: CAT-ENT-0001
    kind: entity
    capability_key: catalog-browsing
    requirement: >
      Each product SHALL have a unique 10-character product id and SHALL belong to exactly one existing category.
    confidence: high
    confidence_basis: >
      Primary key and foreign key to category in both dialect scripts. Both dialect scripts agree.
    risk_class: operational
    basis: >
      Declared in product DDL; capability chosen as closest fit.
    plain_text: >
      Every product belongs to one category and is identified by a short code.
    technical_note: >
      Defined in both petstore_cloudscape.sql and petstore_oracle.sql; only column types differ.
    interface: false
    traces:
      - kind: db_object
        path: db/schema/petstore_cloudscape.sql
        anchor: product
        line_start: 30
        line_end: 34
        excerpt: |
          CREATE TABLE product (productid, catid not null, pk, fk to category)
      - kind: db_object
        path: db/schema/petstore_oracle.sql
        anchor: product
        line_start: 30
        line_end: 34
        excerpt: |
          CREATE TABLE product (productid, catid not null, pk, fk to category)
    stack_metadata:
      db.object: product
      db.kind: table
  - record_key: CAT-ENT-0002
    kind: entity
    capability_key: localization
    requirement: >
      Each product SHALL have at most one set of details per locale, each requiring a name (max 80 chars), with optional image and description (max 255 chars); details SHALL reference an existing product.
    confidence: high
    confidence_basis: >
      NOT NULL name, composite key (productid, locale), FK to product in both scripts. Both dialect scripts agree.
    risk_class: presentational
    basis: >
      Declared in product_details DDL; capability chosen as closest fit.
    plain_text: >
      A product's name, picture and description are kept separately for each language; the name is always required.
    technical_note: >
      Defined in both petstore_cloudscape.sql and petstore_oracle.sql; only column types differ.
    interface: false
    traces:
      - kind: db_object
        path: db/schema/petstore_cloudscape.sql
        anchor: product_details
        line_start: 38
        line_end: 45
        excerpt: |
          CREATE TABLE product_details (productid, locale, name not null, image, descn, pk(productid,locale))
      - kind: db_object
        path: db/schema/petstore_oracle.sql
        anchor: product_details
        line_start: 38
        line_end: 45
        excerpt: |
          CREATE TABLE product_details (productid, locale, name not null, image, descn, pk(productid,locale))
    stack_metadata:
      db.object: product_details
      db.kind: table
  - record_key: CAT-ENT-0003
    kind: entity
    capability_key: localization
    requirement: >
      Each item SHALL have at most one set of locale-specific details per locale, with mandatory list price, unit cost (decimal 10,2), image and description, and up to five optional attributes (max 80 chars); details SHALL reference an existing item.
    confidence: high
    confidence_basis: >
      NOT NULL constraints, composite key (itemid, locale), FK to item in both scripts. Both dialect scripts agree.
    risk_class: financial
    basis: >
      Declared in item_details DDL; capability chosen as closest fit.
    plain_text: >
      An item's price, cost, picture and description are held per language and region; price, cost, picture and description are always required.
    technical_note: >
      Defined in both petstore_cloudscape.sql and petstore_oracle.sql; only column types differ.
    interface: false
    traces:
      - kind: db_object
        path: db/schema/petstore_cloudscape.sql
        anchor: item_details
        line_start: 57
        line_end: 70
        excerpt: |
          CREATE TABLE item_details (itemid, listprice decimal(10,2) not null, unitcost ..., locale, ...)
      - kind: db_object
        path: db/schema/petstore_oracle.sql
        anchor: item_details
        line_start: 57
        line_end: 70
        excerpt: |
          CREATE TABLE item_details (itemid, listprice decimal(10,2) not null, unitcost ..., locale, ...)
    stack_metadata:
      db.object: item_details
      db.kind: table
  - record_key: SUP-ENT-0001
    kind: entity
    capability_key: supplier-fulfilment
    requirement: >
      A supplier purchase order line SHALL be unique per (purchase order id, line number) and SHALL record category, product, item, quantity, unit price and quantity shipped, all mandatory; the line SHALL reference an existing purchase order.
    confidence: high
    confidence_basis: >
      NOT NULL columns, composite PK, FK to purchase_order in both scripts. No check that quantity_shipped <= quantity. Both dialect scripts agree.
    risk_class: financial
    basis: >
      Declared in po_line_item DDL; capability chosen as closest fit.
    plain_text: >
      Each line of a supplier order records what was ordered, at what price, and how many have shipped; a line cannot exist without its order.
    technical_note: >
      Defined in both petstore_cloudscape.sql and petstore_oracle.sql; only column types differ.
    interface: false
    traces:
      - kind: db_object
        path: db/schema/petstore_cloudscape.sql
        anchor: po_line_item
        line_start: 161
        line_end: 171
        excerpt: |
          CREATE TABLE po_line_item (po_id, line_number, ..., quantity, unit_price, quantity_shipped, pk, fk)
      - kind: db_object
        path: db/schema/petstore_oracle.sql
        anchor: po_line_item
        line_start: 161
        line_end: 171
        excerpt: |
          CREATE TABLE po_line_item (po_id, line_number, ..., quantity, unit_price, quantity_shipped, pk, fk)
    stack_metadata:
      db.object: po_line_item
      db.kind: table
  - record_key: OPW-ENT-0001
    kind: entity
    capability_key: order-processing-workflow
    requirement: >
      The system SHALL keep exactly one status record (max 20 chars, mandatory) per order id for the order process manager.
    confidence: high
    confidence_basis: >
      PK on order_id, status NOT NULL in both scripts; allowed values not constrained in DDL. Both dialect scripts agree.
    risk_class: operational
    basis: >
      Declared in order_manager DDL; capability chosen as closest fit.
    plain_text: >
      Each order has one current processing status recorded.
    technical_note: >
      Defined in both petstore_cloudscape.sql and petstore_oracle.sql; only column types differ.
    interface: false
    traces:
      - kind: db_object
        path: db/schema/petstore_cloudscape.sql
        anchor: order_manager
        line_start: 175
        line_end: 178
        excerpt: |
          CREATE TABLE order_manager (order_id, status not null, pk)
      - kind: db_object
        path: db/schema/petstore_oracle.sql
        anchor: order_manager
        line_start: 175
        line_end: 178
        excerpt: |
          CREATE TABLE order_manager (order_id, status not null, pk)
    stack_metadata:
      db.object: order_manager
      db.kind: table
