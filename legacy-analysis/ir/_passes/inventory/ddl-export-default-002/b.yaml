      The system SHALL support lookup of products by category via an index on product category id.
    confidence: medium
    confidence_basis: >
      Single index statement; performance intent inferred. Both dialect scripts agree.
    risk_class: operational
    basis: >
      Declared in ix_product_catid DDL; capability chosen as closest fit.
    plain_text: >
      Browsing products of a category is kept fast.
    technical_note: >
      Defined in both petstore_cloudscape.sql and petstore_oracle.sql; only column types differ.
    interface: false
    traces:
