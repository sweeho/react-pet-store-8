suspected_defects:
  - capability_key: supplier-fulfilment
    record_keys: [SUP-ENT-0001]
    severity: low
    category: inconsistent-rounding
    title: Unit price type differs between database dialects
    description: >
      po_line_item.unit_price is a floating point double in the Cloudscape script but number(12,2) in the Oracle script, so amounts may round differently.
    traces:
      - kind: db_object
        path: db/schema/petstore_cloudscape.sql
        anchor: po_line_item
        line_start: 161
        line_end: 171
      - kind: db_object
        path: db/schema/petstore_oracle.sql
        anchor: po_line_item
        line_start: 161
        line_end: 171
findings: []
