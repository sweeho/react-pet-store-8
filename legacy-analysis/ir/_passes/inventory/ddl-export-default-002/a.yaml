records:
  - record_key: CATALOG-BROWSING-ENT-0001
    kind: entity
    capability_key: catalog-browsing
    requirement: The system SHALL store each product with a unique 10-character product id and exactly one owning category, rejecting a product whose category does not exist.
    confidence: high
    confidence_basis: Primary key, NOT NULL and foreign key declared identically in both the Cloudscape and Oracle schemas, so the database enforces it; no code read in this pass.
    risk_class: operational
    basis: PRIMARY KEY on productid, NOT NULL catid, FOREIGN KEY to category.
    plain_text: Every product has its own short code and belongs to exactly one existing category.
    technical_note: Table product; pk_product, fk_product_1 to category(catid). char(10) in Cloudscape, varchar2(10) in Oracle.
    interface: false
    traces:
      - kind: db_object
        path: db/schema/petstore_cloudscape.sql
        anchor: product
        line_start: 30
        line_end: 34
        excerpt: |
          CREATE TABLE product (
            productid char(10) not null,
            catid char(10) not null,
            constraint pk_product primary key (productid),
            constraint fk_product_1 foreign key (catid) references category (catid));
      - kind: db_object
        path: db/schema/petstore_oracle.sql
        anchor: product
        line_start: 30
        line_end: 34
        excerpt: |
          CREATE TABLE product (
            productid varchar2(10) not null,
            catid varchar2(10) not null,
            constraint pk_product primary key (productid),
            constraint fk_product_1 foreign key (catid) references category (catid));
    stack_metadata:
      db.object: product
      db.kind: table
  - record_key: LOCALIZATION-ENT-0001
    kind: entity
    capability_key: localization
    requirement: The system SHALL hold product descriptive data per locale, keyed by product id and locale, with a mandatory name of up to 80 characters and optional image and description of up to 255 characters, and SHALL reject details for a nonexistent product.
    confidence: high
    confidence_basis: Composite primary key, NOT NULL and foreign key identical in both dialect schemas; enforced by the database. Filed under localization although it also serves catalog browsing.
    risk_class: presentational
    basis: Composite PK (productid, locale), name NOT NULL, image and descn nullable, FK to product.
    plain_text: Each product has a name, and optionally a picture and description, for every language or region it is sold in.
    technical_note: Table product_details; pk_product_details(productid, locale), fk_product_details_1 to product. Fits localization and catalog-browsing; filed under localization.
    interface: false
    traces:
      - kind: db_object
        path: db/schema/petstore_cloudscape.sql
        anchor: product_details
        line_start: 38
        line_end: 45
        excerpt: |
          CREATE TABLE product_details (
            productid char(10) not null,
            locale char(10) not null,
            name varchar(80) not null,
            image varchar(255),
            descn varchar(255),
            constraint pk_product_details primary key (productid, locale),
            constraint fk_product_details_1 foreign key (productid) references product (productid));
      - kind: db_object
        path: db/schema/petstore_oracle.sql
        anchor: product_details
        line_start: 38
        line_end: 45
        excerpt: |
          CREATE TABLE product_details (
            productid varchar2(10) not null,
            locale varchar2(10) not null,
            name varchar2(80) not null,
            image varchar2(255),
            descn varchar2(255),
            constraint pk_product_details primary key (productid, locale),
            constraint fk_product_details_1 foreign key (productid) references product (productid));
    stack_metadata:
      db.object: product_details
      db.kind: table
  - record_key: LOCALIZATION-ENT-0002
    kind: entity
    capability_key: localization
    requirement: The system SHALL hold item prices and descriptive data per locale, keyed by item id and locale, with mandatory list price, unit cost, image and description and up to five optional attributes of 80 characters, and SHALL reject details for a nonexistent item.
    confidence: high
    confidence_basis: Composite key, NOT NULL columns and foreign key identical in both schemas; enforced by the database.
    risk_class: financial
    basis: PK (itemid, locale); listprice and unitcost decimal(10,2) NOT NULL; FK to item.
    plain_text: Each item has a selling price, cost, picture, description and up to five extra attributes for every locale it is sold in.
    technical_note: Table item_details; pk_item_details, fk_item_details_1 to item(itemid). Prices decimal(10,2) in both dialects.
