  - record_key: SUPPLIER-FULFILMENT-ENT-0001
    kind: entity
    capability_key: supplier-fulfilment
    requirement: The system SHALL store each purchase order line identified by purchase order id and line number, recording category, product, item, ordered quantity, unit price and quantity shipped, all mandatory, and SHALL reject a line whose purchase order does not exist.
    confidence: high
    confidence_basis: PK, NOT NULL and FK are database-enforced and present in both schemas; the meaning of quantity_shipped as fulfilment progress is inferred from its name.
    risk_class: financial
    basis: PK (po_id, line_number); FK to purchase_order; quantity_shipped NOT NULL.
    plain_text: Each supplier order consists of numbered lines stating what was ordered, how many, at what price, and how many have shipped.
    technical_note: Table po_line_item; pk_po_line_item, fk_po_line_item_1 to purchase_order(po_id). category_id, product_id and item_id carry no foreign key.
    interface: true
    traces:
      - kind: db_object
        path: db/schema/petstore_cloudscape.sql
        anchor: po_line_item
        line_start: 161
        line_end: 171
        excerpt: |
          CREATE TABLE po_line_item (
            po_id varchar(40) not null,
            line_number varchar(10) not null,
            category_id char(10) not null,
            product_id char(10) not null,
            item_id char(10) not null,
            quantity integer not null,
            unit_price double not null,
            quantity_shipped integer not null,
            constraint pk_po_line_item primary key (po_id, line_number),
            constraint fk_po_line_item_1 foreign key (po_id) references purchase_order (po_id));
      - kind: db_object
        path: db/schema/petstore_oracle.sql
        anchor: po_line_item
        line_start: 161
        line_end: 171
        excerpt: |
          CREATE TABLE po_line_item (
            po_id varchar2(40) not null,
            line_number varchar2(10) not null,
            category_id varchar2(10) not null,
            product_id varchar2(10) not null,
            item_id varchar2(10) not null,
            quantity integer not null,
            unit_price number(12,2) not null,
            quantity_shipped integer not null,
            constraint pk_po_line_item primary key (po_id, line_number),
            constraint fk_po_line_item_1 foreign key (po_id) references purchase_order (po_id));
    stack_metadata:
      db.object: po_line_item
      db.kind: table
  - record_key: ORDER-PROCESSING-WORKFLOW-ENT-0001
    kind: entity
    capability_key: order-processing-workflow
    requirement: The system SHALL keep exactly one mandatory status value of up to 20 characters per order id in the process manager's order table.
    confidence: medium
    confidence_basis: One clear place per dialect (PK and NOT NULL); the set of valid status values is not constrained here, so the lifecycle is not visible.
    risk_class: operational
    basis: PK order_id, status NOT NULL, no CHECK on status values.
    plain_text: The system records the current processing state of every order, one state per order.
    technical_note: Table order_manager; pk_order_manager(order_id); status varchar(20)/varchar2(20) with no CHECK, so valid values are enforced in application code only.
    interface: false
    traces:
      - kind: db_object
        path: db/schema/petstore_cloudscape.sql
        anchor: order_manager
        line_start: 175
        line_end: 178
        excerpt: |
          CREATE TABLE order_manager (
            order_id varchar(40) not null,
            status varchar(20) not null,
            constraint pk_order_manager primary key (order_id));
      - kind: db_object
        path: db/schema/petstore_oracle.sql
        anchor: order_manager
        line_start: 175
        line_end: 178
        excerpt: |
          CREATE TABLE order_manager (
            order_id varchar2(40) not null,
            status varchar2(20) not null,
            constraint pk_order_manager primary key (order_id));
    stack_metadata:
      db.object: order_manager
      db.kind: table
  - record_key: CATALOG-BROWSING-REQ-0001
    kind: requirement
    capability_key: catalog-browsing
    requirement: The system SHALL support retrieval of products by category and items by product through indexed lookups on product category and item product.
    confidence: medium
    confidence_basis: Indexes declared in both schemas, but their purpose is inferred from the columns indexed; no query was read in this pass.
    risk_class: presentational
    basis: Indexes on product(catid) and item(productid).
    plain_text: Listing the products in a category and the items of a product is expected to be fast.
    technical_note: ix_product_catid on product(catid); ix_item_productid on item(productid). Performance structures only.
    interface: false
