findings: []
suspected_defects:
  - capability_key: supplier-fulfilment
    record_keys: [SUPPLIER-FULFILMENT-ENT-0001]
    severity: medium
    category: inconsistent-rounding
    title: Line unit price is floating point in Cloudscape but fixed 2-decimal in Oracle
    description: >
      po_line_item.unit_price is a double in the Cloudscape schema and number(12,2) in the Oracle schema,
      so the same price can be stored with binary rounding error on one database and exactly on the other.
    traces:
      - kind: db_object
        path: db/schema/petstore_cloudscape.sql
        anchor: po_line_item
        line_start: 168
        line_end: 168
        excerpt: |
          unit_price double not null,
      - kind: db_object
        path: db/schema/petstore_oracle.sql
        anchor: po_line_item
        line_start: 168
        line_end: 168
        excerpt: |
          unit_price number(12,2) not null,
