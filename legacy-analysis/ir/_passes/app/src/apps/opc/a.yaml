  - record_key: SUPFUL-WF-0002
    kind: workflow
    capability_key: supplier-fulfilment
    requirement: >
      The system SHALL, on receiving a supplier invoice, mark the invoiced line items on the purchase order; if the order is then fully shipped it SHALL set the order COMPLETED and trigger the completed-order notification, otherwise it SHALL set the order to partially shipped (SHIPPED_PART) with no notification.
    confidence: medium
    confidence_basis: One clear place; the "fully shipped" decision is delegated to PurchaseOrderHelper.processInvoice outside this module, so not high.
    risk_class: operational
    basis: orderDone drives COMPLETED vs SHIPPED_PART; only completed orders are forwarded.
    plain_text: When a supplier ships part of an order the order shows as partly shipped; when everything has shipped it is completed and the customer is told.
    technical_note: InvoiceMDB.doWork; InvoiceTD forwards to CR_MAIL_COMPLETED_ORDER_MDB_QUEUE.
    interface: true
    traces:
