  - record_key: SUPFUL-INT-0001
    kind: integration
    capability_key: supplier-fulfilment
    requirement: >
      The system SHALL, for each order approved, build a supplier purchase order XML document (order id, order date, shipping name/address/email/telephone and every line item with category, product, item, line number, quantity and unit price) and send it to the supplier purchase order queue.
    confidence: high
    confidence_basis: Built in OrderApprovalMDB.getXmlPO and sent in OrderApprovalTD.doTransition (two places).
    risk_class: operational
    basis: Approved orders only produce supplier POs; denied do not.
    plain_text: When an order is approved, the supplier is sent a purchase order with the customer's shipping details and the items ordered.
    technical_note: OrderApprovalMDB.getXmlPO uses TPASupplierOrderXDE; OrderApprovalTD sends each to SUPPLIER_PURCHASE_ORDER_QUEUE. Supplier messages are sent before the mail notification.
    interface: true
    traces:
      - path: legacy-source/app/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/OrderApprovalMDB.java
        line_start: 183
        line_end: 189
        excerpt: |
          //for all approved orders, send a PO to supplier
          if(co.getOrderStatus().equals(OrderStatusNames.APPROVED)) {
            po = poHome.findByPrimaryKey(co.getOrderId());
            String xmlPO = getXmlPO(po, supplierOrderXDE);
            supplierPoList.add(xmlPO);
          }
      - path: legacy-source/app/src/apps/opc/src/com/sun/j2ee/blueprints/opc/transitions/OrderApprovalTD.java
        line_start: 75
        line_end: 80
        excerpt: |
          while(it!= null && it.hasNext()) {
            xmlPO = (String) it.next();
            //send PO to supplier for this order
            supplierQueueHelper.sendMessage(xmlPO);
           }//end while
    stack_metadata:
      ejb.bean: OrderApprovalMDB
      jms.queue: SUPPLIER_PURCHASE_ORDER_QUEUE

