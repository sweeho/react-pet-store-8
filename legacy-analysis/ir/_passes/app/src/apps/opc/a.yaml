      jms.queue: ORDER_APPROVAL_MDB_QUEUE

  - record_key: ORDWF-BR-0003
    kind: business-rule
    capability_key: order-processing-workflow
    requirement: >
      GIVEN an order approval or denial for an order that is not in status PENDING, WHEN the approval is processed, THEN the system SHALL ignore that order: no status update, no supplier purchase order and no customer notification.
    confidence: medium
    confidence_basis: One clear place with an explanatory comment; no test.
    risk_class: operational
    basis: Only PENDING orders can change status; others are skipped before being added to the notification list.
    plain_text: An order that has already been approved, denied or completed cannot be approved or denied again.
    technical_note: OrderApprovalMDB.doWork checks processManager.getStatus and continues the loop.
    interface: false
    traces:
      - path: legacy-source/app/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/OrderApprovalMDB.java
        line_start: 163
        line_end: 171
        excerpt: |
          // only PENDING orders can be updated
          //if order alreay APPROVED or DENIED or COMPLETED, then order
          //already processed so dont process again
          String curStatus = processManager.getStatus(co.getOrderId());
          if(!curStatus.equals(OrderStatusNames.PENDING)) {
            continue;
          }
    stack_metadata:
      ejb.bean: OrderApprovalMDB

