records:
  - record_key: ORDAPP-BR-0001
    kind: business-rule
    capability_key: order-approval
    requirement: >
      The system SHALL automatically approve a newly received purchase order when its locale is US and its total price is below 500, or its locale is Japan and its total price is below 50000.
    confidence: medium
    confidence_basis: >
      One clear place (canIApprove) with bare literals; no config, comment or test gives an authoritative source or currency, so not high.
    risk_class: financial
    basis: Hard-coded per-locale thresholds in the purchase order listener decide auto-approval.
    plain_text: >
      A new order is approved automatically if it is a US order under 500 or a Japanese order under 50,000.
    technical_note: >
      PurchaseOrderMDB.canIApprove compares purchaseOrder.getTotalPrice() with literals per java.util.Locale.
    interface: false
    traces:
      - path: legacy-source/app/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/PurchaseOrderMDB.java
        line_start: 183
        line_end: 191
        excerpt: |
          private boolean canIApprove(PurchaseOrder purchaseOrder) {
            Locale locale = purchaseOrder.getLocale();
            if (locale.equals(Locale.US)) {
              if (purchaseOrder.getTotalPrice() < 500) return true;
            } else if (locale.equals(Locale.JAPAN))  {
              if (purchaseOrder.getTotalPrice() < 50000) return true;
            }
            return false;
          }
    stack_metadata:
      framework: EJB 2.x
      ejb.bean: PurchaseOrderMDB

  - record_key: ORDAPP-BR-0002
    kind: business-rule
    capability_key: order-approval
    requirement: >
      GIVEN a purchase order whose locale is neither US nor Japan (e.g. Chinese), WHEN it is received, THEN the system SHALL NOT auto-approve it and SHALL leave it PENDING for manual approval in the admin client.
    confidence: medium
    confidence_basis: >
      Follows from canIApprove returning false by default and the "wait for admin" comment; the admin side is only seen through the facade, so not high.
    risk_class: financial
    basis: canIApprove returns false for any other locale; onMessage only forwards an approval when one was produced.
    plain_text: >
      Orders from regions without an auto-approval limit always wait for a person to approve or deny them.
    technical_note: >
      doWork returns null when canIApprove is false; onMessage then skips the transition ("wait for admin to approve/deny orders").
    interface: false
    traces:
      - path: legacy-source/app/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/PurchaseOrderMDB.java
        line_start: 124
        line_end: 126
        excerpt: |
          if(approval != null) {
            doTransition(approval);
          } //else wait for admin to approve/deny orders
    stack_metadata:
      ejb.bean: PurchaseOrderMDB

  - record_key: ORDWF-WF-0001
    kind: workflow
    capability_key: order-processing-workflow
    requirement: >
      The system SHALL, on receiving a purchase order message, persist the purchase order and register it with the process manager in status PENDING.
    confidence: medium
    confidence_basis: One clear place (PurchaseOrderMDB.doWork), no second corroborating source seen.
    risk_class: operational
    basis: doWork creates the PO and calls createManager with PENDING.
    plain_text: Every new order is saved and starts in the "pending" state.
    technical_note: PurchaseOrderMDB.doWork - poHome.create then processManager.createManager(orderId, PENDING). Messages consumed from the purchase order JMS queue.
    interface: true
    traces:
      - path: legacy-source/app/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/PurchaseOrderMDB.java
        line_start: 153
        line_end: 156
        excerpt: |
          PurchaseOrder purchaseOrder = PurchaseOrder.fromXML(xmlMessage, entityCatalogURL, validateXmlPurchaseOrder);
          poHome.create(purchaseOrder);

          processManager.createManager(purchaseOrder.getOrderId(), OrderStatusNames.PENDING);
    stack_metadata:
      ejb.bean: PurchaseOrderMDB
      jms.queue: purchase order (OPC)

