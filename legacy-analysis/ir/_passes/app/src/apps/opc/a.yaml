    risk_class: operational
    basis: PurchaseOrderTD sends the approval XML to the OrderApproval MDB queue.
    plain_text: An automatic approval is handled exactly like an approval made by a person.
    technical_note: PurchaseOrderTD.doTransition -> QueueHelper.sendMessage to ORDER_APPROVAL_MDB_QUEUE.
    interface: false
    traces:
