  - record_key: LOCAL-BR-0001
    kind: business-rule
    capability_key: localization
    requirement: >
      The system SHALL render order-status and completed-order emails in the locale stored on the order (English, Japanese, Chinese stylesheets), where a stored locale of "default" means the server default locale and a locale string without an underscore yields no locale.
    confidence: medium
    confidence_basis: Stylesheets per locale exist and LocaleUtil parses; behaviour on null locale not seen, and the parser is faulty (see defect).
    risk_class: presentational
    basis: LocaleUtil.getLocaleFromString and locale-suffixed XSL files.
    plain_text: Emails go out in the language of the order (English, Japanese or Chinese).
    technical_note: XSL files OrderApproval/CompletedOrder/PartialInvoice _en_US, _ja_JP, _zh_CN under rsrc/xsl.
    interface: false
    traces:
      - path: legacy-source/app/src/apps/opc/src/com/sun/j2ee/blueprints/opc/customerrelations/ejb/LocaleUtil.java
        line_start: 48
        line_end: 52
        excerpt: |
          public static Locale getLocaleFromString(String localeString) {
            if (localeString == null) return null;
            if (localeString.toLowerCase().equals("default")) return Locale.getDefault();
            int languageIndex = localeString.indexOf('_');
            if (languageIndex  == -1) return null;
    stack_metadata:
      framework: EJB 2.x

suspected_defects:
  - capability_key: order-approval
    record_keys: [ORDAPP-BR-0001, ORDAPP-BR-0002]
    severity: medium
    category: other
    title: Approval limits are bare literals with no currency or configuration
    description: >
      500 (US) and 50000 (Japan) are hard-coded; no configuration or document states the currency, and an exact total equal to the limit is not auto-approved. Other locales never auto-approve.
    traces:
      - path: legacy-source/app/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/PurchaseOrderMDB.java
        line_start: 185
        line_end: 189
  - capability_key: localization
    record_keys: [LOCAL-BR-0001]
    severity: low
    category: unreachable-branch
    title: Locale variant parsing never runs
    description: >
      variantIndex is initialised to -1 and never assigned, so the variant branch is dead; countryIndex is advanced to the next underscore, and a string with a second underscore leaves country null.
    traces:
      - path: legacy-source/app/src/apps/opc/src/com/sun/j2ee/blueprints/opc/customerrelations/ejb/LocaleUtil.java
        line_start: 62
        line_end: 68
  - capability_key: order-processing-workflow
    record_keys: [ORDWF-WF-0001, ORDWF-BR-0003]
    severity: medium
    category: error-swallowed
    title: Processing failures are rethrown as EJBException with no dead-letter handling and the messaging loop skips silently
    description: >
      Any checked failure in the listeners is wrapped in EJBException (message redelivery is left to the container); orders found not PENDING are silently skipped with no log or notice.
    traces:
      - path: legacy-source/app/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/OrderApprovalMDB.java
        line_start: 163
        line_end: 171

findings:
  - kind: ambiguity
    path: legacy-source/app/src/apps/opc/src/ejb-jar.xml
    description: >
      Env-entry values (XML validation flags, SendApprovalMail, SendConfirmationMail, SendCompletedOrderMail, OrderApprovalTD class) are redacted in the supplied source, so the default on/off state of mail and validation could not be read. No legacy-analysis/sources documents were present for this module.
