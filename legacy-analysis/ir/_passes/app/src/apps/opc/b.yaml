suspected_defects:
  - capability_key: customer-notifications
    record_keys: [NOTIF-REQ-0001]
    severity: low
    category: other
    title: Locale string parsing never reads a variant and may return an incomplete locale
    description: >
      LocaleUtil updates countryIndex instead of variantIndex, so the variant is never parsed; when the string has two underscores the country stays null.
    traces:
      - path: legacy-source/app/src/apps/opc/src/com/sun/j2ee/blueprints/opc/customerrelations/ejb/LocaleUtil.java
        line_start: 62
        line_end: 63
        excerpt: |
          int variantIndex = -1;
              if (countryIndex != -1) countryIndex = localeString.indexOf('_', countryIndex +1);
  - capability_key: batch-operations
    record_keys: [BATCH-REQ-0001]
    severity: low
    category: inconsistent-rounding
    title: Revenue totals accumulate in single-precision floating point
    description: >
      Money sums are held as Float, which may lose cents over many orders.
    traces:
      - path: legacy-source/app/src/apps/opc/src/com/sun/j2ee/blueprints/opc/admin/ejb/OPCAdminFacadeEJB.java
        line_start: 196
        line_end: 200
        excerpt: |
          tmpValue = (Float) chartDetails.get(id);
findings:
  - kind: ambiguity
    path: legacy-source/app/src/apps/opc/src/ejb-jar.xml
    description: >
      Env-entry values (validation flags, mail switches, transition delegate class) are redacted in the source view, so defaults of the mail switches and XML validation could not be read.
