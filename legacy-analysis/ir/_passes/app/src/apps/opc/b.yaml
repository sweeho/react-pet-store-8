records:
  - record_key: ORDAPP-RULE-0001
    kind: business-rule
    capability_key: order-approval
    requirement: >
      The system SHALL automatically approve a newly received purchase order when its locale is US and its total price is below 500, or its locale is Japan and its total price is below 50000.
    confidence: medium
    confidence_basis: >
      One clear place (canIApprove); thresholds are bare literals with no comment, config or test, and no currency is stated.
    risk_class: financial
    basis: Approval decision is a hard-coded locale/threshold comparison.
    plain_text: >
      An order from a US customer under 500, or from a Japanese customer under 50,000, is approved automatically without a person reviewing it.
    technical_note: >
      PurchaseOrderMDB.canIApprove compares getTotalPrice() with literals.
    interface: false
    traces:
      - path: legacy-source/app/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/PurchaseOrderMDB.java
        line_start: 183
        line_end: 191
        excerpt: |
          Locale locale = purchaseOrder.getLocale();
            if (locale.equals(Locale.US)) {
              if (purchaseOrder.getTotalPrice() < 500) return true;
            } else if (locale.equals(Locale.JAPAN))  {
              if (purchaseOrder.getTotalPrice() < 50000) return true;
            }
            return false;
    stack_metadata:
      framework: EJB 2 MDB
      ejb.bean: PurchaseOrderMDB
  - record_key: ORDAPP-RULE-0002
    kind: business-rule
    capability_key: order-approval
    requirement: >
      GIVEN an order whose locale is neither US nor Japan (including Chinese locale), WHEN the order is received, THEN the system SHALL leave it pending for manual approval or denial by an administrator regardless of total.
    confidence: medium
    confidence_basis: >
      Follows from the fall-through in canIApprove and the "wait for admin" comment; no explicit Chinese-locale statement seen in this module.
    risk_class: financial
    basis: Only US and JAPAN branches exist; all else returns false and no approval message is issued.
    plain_text: >
      Orders outside the auto-approval limits, or from other regions, wait for an administrator to approve or deny them.
    technical_note: >
      onMessage only calls doTransition when doWork returns a non-null approval XML.
    interface: false
    traces:
      - path: legacy-source/app/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/PurchaseOrderMDB.java
        line_start: 121
        line_end: 126
        excerpt: |
          approval = doWork(recdText);
          if(approval != null) {
            doTransition(approval);
          } //else wait for admin to approve/deny orders
    stack_metadata:
      ejb.bean: PurchaseOrderMDB
  - record_key: OPW-WORKFLOW-0001
    kind: workflow
    capability_key: order-processing-workflow
    requirement: >
      The system SHALL, on receiving a purchase order message, persist the purchase order, register the order with the process manager in PENDING status, and, only if auto-approvable, send an approval message to the order-approval queue.
    confidence: high
    confidence_basis: >
      doWork and PurchaseOrderTD agree on the hand-off, and the queue name is configured in the deployment descriptor.
    risk_class: operational
    basis: Order intake step of the lifecycle.
    plain_text: >
      When an order arrives it is saved and marked pending; if it qualifies for automatic approval, the approval step is triggered straight away.
    technical_note: >
      PurchaseOrderMDB.doWork -> PurchaseOrderTD.doTransition -> JMS send to ORDER_APPROVAL_MDB_QUEUE. Send uses a transacted queue session.
    interface: true
    traces:
      - path: legacy-source/app/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/PurchaseOrderMDB.java
        line_start: 151
        line_end: 165
        excerpt: |
          PurchaseOrder purchaseOrder = PurchaseOrder.fromXML(xmlMessage, entityCatalogURL, validateXmlPurchaseOrder);
              poHome.create(purchaseOrder);
              processManager.createManager(purchaseOrder.getOrderId(), OrderStatusNames.PENDING);
      - path: legacy-source/app/src/apps/opc/src/com/sun/j2ee/blueprints/opc/transitions/PurchaseOrderTD.java
        line_start: 78
        line_end: 87
        excerpt: |
          String xmlOrderApproval = info.getXMLMessage();
              try {
                if (xmlOrderApproval != null) {
                  queueHelper.sendMessage(xmlOrderApproval);
    stack_metadata:
      jms.queue: ORDER_APPROVAL_MDB_QUEUE
      ejb.bean: PurchaseOrderMDB
  - record_key: OPW-RULE-0001
    kind: business-rule
    capability_key: order-processing-workflow
    requirement: >
      The system SHALL apply an approval or denial status change to an order only when the order's current status is PENDING; changes for orders in any other status SHALL be silently skipped and excluded from notifications.
    confidence: medium
    confidence_basis: One clear place; skipped silently with no log.
    risk_class: operational
    basis: Guard at the start of the order approval loop.
    plain_text: >
      An order can only be approved or denied while it is still pending; a repeat or late decision is ignored.
    technical_note: >
      OrderApprovalMDB.doWork checks processManager.getStatus then "continue".
    interface: false
    traces:
      - path: legacy-source/app/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/OrderApprovalMDB.java
        line_start: 204
        line_end: 213
        excerpt: |
          String curStatus = processManager.getStatus(co.getOrderId());
                if(!curStatus.equals(OrderStatusNames.PENDING)) {
                  continue;
                }
    stack_metadata:
      ejb.bean: OrderApprovalMDB
  - record_key: OPW-WORKFLOW-0002
    kind: workflow
    capability_key: supplier-fulfilment
    requirement: >
      The system SHALL, for each order moved to APPROVED, build a supplier purchase order (order id, date, shipping contact and address, and each line item with category, product, item, line number, quantity and unit price) and send it to the supplier purchase-order queue, then send the list of processed approvals/denials to the customer-mail queue.
    confidence: high
    confidence_basis: >
      Construction in OrderApprovalMDB.getXmlPO and dispatch in OrderApprovalTD are both read; the delegate class is configurable.
    risk_class: operational
    basis: Approval fan-out to supplier and mail.
    plain_text: >
      Once an order is approved, a purchase request with the shipping details and items goes to the supplier, and the customer is told of the decision.
    technical_note: >
      OrderApprovalTD sends one message per supplier PO, then one mail message; class chosen via env-entry param/transitiondelegate/OrderApprovalTD. Denied orders produce mail but no supplier PO.
    interface: true
    traces:
      - path: legacy-source/app/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/OrderApprovalMDB.java
        line_start: 216
        line_end: 223
        excerpt: |
          processManager.updateStatus(co.getOrderId(), co.getOrderStatus());
                if(co.getOrderStatus().equals(OrderStatusNames.APPROVED)) {
                  po = poHome.findByPrimaryKey(co.getOrderId());
                  String xmlPO = getXmlPO(po, supplierOrderXDE);
                  supplierPoList.add(xmlPO);
      - path: legacy-source/app/src/apps/opc/src/com/sun/j2ee/blueprints/opc/transitions/OrderApprovalTD.java
        line_start: 86
        line_end: 103
        excerpt: |
          supplierQueueHelper.sendMessage(xmlPO);
          //send the list of valid order approval/deny to customer relations
          sendMail(xmlMailOrderApprovals);
    stack_metadata:
      jms.queue: SUPPLIER_PURCHASE_ORDER_QUEUE, CR_MAIL_ORDER_APPROVAL_MDB_QUEUE
      ejb.bean: OrderApprovalMDB
  - record_key: OPW-WORKFLOW-0003
    kind: workflow
    capability_key: order-processing-workflow
    requirement: >
      The system SHALL, on receiving a supplier invoice, mark the order COMPLETED when all its line items are invoiced and send the order id to the completed-order mail queue; otherwise it SHALL mark the order SHIPPED_PART and send nothing further.
    confidence: medium
    confidence_basis: >
      Branch read in InvoiceMDB; the completeness test is inside PurchaseOrderHelper which is outside this module.
    risk_class: operational
    basis: Invoice join condition.
    plain_text: >
      When a supplier invoices only some items the order shows as partly shipped; once everything is invoiced it becomes completed and the customer is told.
    technical_note: >
      InvoiceMDB.doWork uses poHelper.processInvoice(po, lineItemIds). InvoiceTD sends to CR_MAIL_COMPLETED_ORDER_MDB_QUEUE.
    interface: true
    traces:
      - path: legacy-source/app/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/InvoiceMDB.java
        line_start: 157
        line_end: 173
        excerpt: |
          boolean orderDone = poHelper.processInvoice(po, invoiceXDE.getLineItemIds());
          if(orderDone) {
            processManager.updateStatus(invoiceXDE.getOrderId(), OrderStatusNames.COMPLETED);
            completedOrder = invoiceXDE.getOrderId();
          } else {
            processManager.updateStatus(invoiceXDE.getOrderId(), OrderStatusNames.SHIPPED_PART);
    stack_metadata:
      ejb.bean: InvoiceMDB
      jms.queue: CR_MAIL_COMPLETED_ORDER_MDB_QUEUE
  - record_key: NOTIF-RULE-0001
    kind: business-rule
    capability_key: customer-notifications
    requirement: >
      The system SHALL send each of the three order e-mails (shipment/invoice, approval status, completed order) only when its own configuration switch is on; when off, the message SHALL be consumed and discarded.
    confidence: medium
    confidence_basis: >
      Flag check read in all three mail beans; switch values are in the deployment descriptor (redacted in this view), so defaults were not seen.
    risk_class: operational
    basis: Per-mail-type enable flags.
    plain_text: >
      Each kind of customer e-mail can be turned on or off separately.
    technical_note: >
      env-entries param/SendConfirmationMail (invoice), param/SendApprovalMail, param/SendCompletedOrderMail. The Java field defaults to false.
    interface: true
    traces:
      - path: legacy-source/app/src/apps/opc/src/com/sun/j2ee/blueprints/opc/customerrelations/ejb/MailOrderApprovalMDB.java
        line_start: 127
        line_end: 130
        excerpt: |
          if (sendConfirmationMail) {
            result = doWork(recdText);
            doTransition(result);
          }
      - path: legacy-source/app/src/apps/opc/src/com/sun/j2ee/blueprints/opc/customerrelations/ejb/MailInvoiceMDB.java
        line_start: 127
        line_end: 128
        excerpt: |
          if (sendConfirmationMail) {
                String xmlMail = doWork(recdText);
      - path: legacy-source/app/src/apps/opc/src/com/sun/j2ee/blueprints/opc/customerrelations/ejb/MailCompletedOrderMDB.java
        line_start: 126
        line_end: 127
        excerpt: |
          if (sendConfirmationMail) {
            result = doWork(recdText);
    stack_metadata:
      ejb.bean: MailOrderApprovalMDB, MailInvoiceMDB, MailCompletedOrderMDB
  - record_key: NOTIF-REQ-0001
    kind: requirement
    capability_key: customer-notifications
    requirement: >
      The system SHALL address each order e-mail to the e-mail address stored on the purchase order, with subject "Java Pet Store Order Status: <orderId>" for approval/denial, "Java Pet Store Order Shipped: <orderId>" for shipment and "Java Pet Store Order COMPLETED: <orderId>" for completion, and SHALL render the body in the purchase order's locale.
    confidence: high
    confidence_basis: Subject constants in code and per-locale XSL templates (en_US, ja_JP, zh_CN) both present.
    risk_class: presentational
    basis: Mail building in the three mail beans.
    plain_text: >
      Customers receive order e-mails in their own language, with the order number in the subject.
    technical_note: >
      MailContentXDE transforms XML via XSL chosen by locale parsed from the PO locale string by LocaleUtil.
    interface: true
    traces:
      - path: legacy-source/app/src/apps/opc/src/com/sun/j2ee/blueprints/opc/customerrelations/ejb/MailOrderApprovalMDB.java
        line_start: 170
        line_end: 178
        excerpt: |
          String subject = MAIL_SUBJECT + co.getOrderId();
          po = poHome.findByPrimaryKey(co.getOrderId());
          String emailAddress = po.getPoEmailId();
          mailContentXDE.setLocale(LocaleUtil.getLocaleFromString(po.getPoLocale()));
      - path: legacy-source/app/src/apps/opc/src/com/sun/j2ee/blueprints/opc/customerrelations/ejb/MailInvoiceMDB.java
        line_start: 79
        line_end: 79
        excerpt: |
          private static final String MAIL_SUBJECT = "Java Pet Store Order Shipped: ";
      - path: legacy-source/app/src/apps/opc/src/com/sun/j2ee/blueprints/opc/customerrelations/ejb/MailCompletedOrderMDB.java
        line_start: 81
        line_end: 81
        excerpt: |
          private static final String MAIL_SUBJECT = "Java Pet Store Order COMPLETED: ";
    stack_metadata:
      ejb.bean: MailContentXDE
  - record_key: ORDAPP-REQ-0001
    kind: requirement
    capability_key: order-approval
    requirement: >
      The system SHALL let an administrator list orders by status, showing order id, user id, order date (month/day/year), value and status.
    confidence: medium
    confidence_basis: One place (admin facade); the screens calling it are in another module.
    risk_class: operational
    basis: OPCAdminFacadeEJB.getOrdersByStatus.
    plain_text: >
      An administrator can see the orders waiting in a given status, such as pending ones, in order to approve or deny them.
    technical_note: >
      Process manager returns orders by status; each is joined to its purchase order. A missing purchase order aborts the whole list with an error.
    interface: false
    traces:
      - path: legacy-source/app/src/apps/opc/src/com/sun/j2ee/blueprints/opc/admin/ejb/OPCAdminFacadeEJB.java
        line_start: 131
        line_end: 156
        excerpt: |
          Collection orders = mgr.getOrdersByStatus(status);
          retVal.add(new OrderDetails(po.getPoId(), po.getPoUserId(),
                                      podate, po.getPoValue(), status));
    stack_metadata:
      ejb.bean: OPCAdminFacadeEJB
  - record_key: BATCH-REQ-0001
    kind: requirement
    capability_key: batch-operations
    requirement: >
      The system SHALL give administrators revenue or ordered-quantity totals for orders placed between two dates, grouped by category, or by item when a category is chosen.
    confidence: medium
    confidence_basis: One place; revenue is quantity x unit price summed as float.
