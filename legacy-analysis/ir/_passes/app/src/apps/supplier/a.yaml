  - capability_key: supplier-fulfilment
    record_keys: [SUPF-REQ-0001, SUPF-RULE-0001]
    severity: high
    category: data-corruption
    title: Invoice failure after inventory was already reduced
    description: >
      If building the invoice fails, the error is printed and null returned, but inventory has already been reduced and lines marked shipped, so goods are recorded shipped with no invoice sent and no retry (lines are skipped on later passes). Whether the surrounding transaction rolls back depends on container behaviour, since the exception is swallowed.
