  - record_key: SUPF-RULE-0003
    kind: business-rule
    capability_key: supplier-fulfilment
    requirement: >
      The system SHALL mark a supplier order COMPLETED only when every line item was available in this processing pass, and SHALL leave it in its prior status (pending) otherwise.
    confidence: medium
    confidence_basis: One clear place; a line already fully shipped in an earlier pass is skipped, so completion on a later pass depends on remaining lines only.
    risk_class: operational
    basis: allItemsAvailable stays true only if no checkInventory failed.
    plain_text: An order is marked complete once all its lines have shipped; until then it stays pending and is retried.
    technical_note: processAnOrder sets po status via OrderStatusNames.COMPLETED.
    interface: false
    traces:
      - path: legacy-source/app/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/orderfulfillment/ejb/OrderFulfillmentFacadeEJB.java
