records:
  - record_key: SUPF-WF-0001
    kind: workflow
    capability_key: supplier-fulfilment
    requirement: >
      The system SHALL accept each supplier purchase order as an XML text message on a queue, create a stored supplier order from it, attempt to fulfil it, and, when an invoice results, hand the invoice to the order-processing transition; when no invoice results it SHALL take no further action until inventory is replenished.
    confidence: high
    confidence_basis: >
      The message handler, its facade call and the container message-driven declaration all agree; the downstream delegate class name is redacted in config so its behaviour is not visible.
    risk_class: operational
    basis: onMessage reads the text, calls processPO, and only transitions when an invoice string is returned.
    plain_text: >
      When the order centre sends the supplier a purchase order, the supplier records it, tries to ship it, and tells the order centre about any invoice. If nothing could be shipped, it waits until stock arrives.
    technical_note: >
      SupplierOrderMDB.onMessage -> OrderFulfillmentFacade.processPO -> TransitionDelegate.doTransition. Any JMS/XML/create failure is rethrown as EJBException (message redelivery semantics left to container).
    interface: true
    traces:
      - path: legacy-source/app/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/processpo/ejb/SupplierOrderMDB.java
        line_start: 101
        line_end: 123
        excerpt: |
          public void onMessage(Message recvMsg) {
            try {
              String messageID = recvMsg.getJMSMessageID();
              TextMessage recdTM = (TextMessage)recvMsg;
              String recdText = recdTM.getText();
      - path: legacy-source/app/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/processpo/ejb/SupplierOrderMDB.java
        line_start: 108
        line_end: 113
        excerpt: |
          String invoice = doWork(recdText);
          if(invoice!=null) {
            doTransition(invoice);
          } //else wait for the inventory to arrive at the inventory receiver
    stack_metadata:
      framework: EJB 2.0 MDB
      ejb.bean: SupplierOrderMDB
      ejb.transaction: Container
      jms.queue: supplier order queue (destination-type javax.jms.Queue)
  - record_key: SUPF-RULE-0001
    kind: business-rule
    capability_key: supplier-fulfilment
    requirement: >
      The system SHALL, for each line item of a purchase order that is not already fully shipped, ship the full ordered quantity only if on-hand inventory for that item is at least the ordered quantity, and SHALL then reduce inventory by that quantity and mark the line as shipped in full.
    confidence: high
    confidence_basis: >
      Enforced in the fulfilment facade and the inventory bean's quantity decrement; no test or doc seen.
    risk_class: operational
    basis: Partial shipment of a line is never made; it is all-or-nothing per line.
    plain_text: >
      Each order line ships completely or not at all. If the warehouse has enough of the item, the whole line ships and stock goes down; otherwise the line waits.
    technical_note: >
      OrderFulfillmentFacadeEJB.checkInventory + processAnOrder; InventoryEJB.reduceQuantity.
    interface: false
    traces:
      - path: legacy-source/app/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/orderfulfillment/ejb/OrderFulfillmentFacadeEJB.java
        line_start: 126
        line_end: 139
        excerpt: |
          InventoryLocal inv = invHome.findByPrimaryKey(item.getItemId());
          if(inv.getQuantity() < item.getQuantity())
            return(false);
          inv.reduceQuantity(item.getQuantity());
      - path: legacy-source/app/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/orderfulfillment/ejb/OrderFulfillmentFacadeEJB.java
