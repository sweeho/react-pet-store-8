  - record_key: SUPF-WF-0002
    kind: workflow
    capability_key: supplier-fulfilment
    requirement: >
      The system SHALL, when an administrator submits updated stock quantities, apply them, re-process every pending supplier order, and send each resulting invoice, all inside one transaction.
    confidence: high
    confidence_basis: Servlet code plus the Required-transaction and screen routing; outcome on failure is not specified.
    risk_class: operational
    basis: updateinventory screen runs updateInventory, processPendingPO, sendInvoices between begin and commit.
    plain_text: After the administrator updates stock levels, the supplier immediately retries all waiting orders and sends invoices for those that can now ship.
    technical_note: RcvrRequestProcessor (servlet) with UserTransaction.
