  - record_key: SUPF-REQ-0002
    kind: requirement
    capability_key: sign-on-security
    requirement: >
      The system SHALL restrict the supplier inventory screens and update action to users in the administrator role, using form login, with a session timeout of 54 minutes.
    confidence: high
    confidence_basis: Declared in the web descriptor (constraint, login config, timeout); transport guarantee NONE seen as well. Filed under sign-on-security as the closest list entry.
    risk_class: regulated
    basis: Security constraint covers GET and POST on the servlet path.
    plain_text: Only administrators can view or change supplier stock; they sign in with a form and are logged out after 54 idle minutes. The connection is not required to be encrypted.
