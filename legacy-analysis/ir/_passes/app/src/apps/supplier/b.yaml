  - record_key: SUPF-RULE-0004
    kind: business-rule
    capability_key: supplier-fulfilment
    requirement: >
      The system SHALL mark a purchase order COMPLETED only when every one of its line items was available in the current pass; otherwise the order SHALL keep its existing (pending) status and be retried later.
    plain_text: >
      An order is closed only when all its lines could be shipped. Otherwise it stays open and is retried when stock arrives.
    technical_note: >
      allItemsAvailable flag in processAnOrder; setPoStatus(OrderStatusNames.COMPLETED). A line shipped in an earlier pass is skipped without clearing the flag, so a later pass can complete the order.
    interface: false
    confidence: high
    confidence_basis: Status set in code; the pending query in processPendingPO and the MDB comment about waiting for inventory corroborate.
    risk_class: operational
    basis: Order status transition driven by availability flag.
    traces:
      - path: legacy-source/app/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/orderfulfillment/ejb/OrderFulfillmentFacadeEJB.java
        line_start: 197
        line_end: 198
        excerpt: |
          if(allItemsAvailable)
                  po.setPoStatus(OrderStatusNames.COMPLETED);
      - path: legacy-source/app/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/processpo/ejb/SupplierOrderMDB.java
        line_start: 111
        line_end: 113
        excerpt: |
          if(invoice!=null) {
                  doTransition(invoice);
                } //else wait for the inventory to arrive at the inventory receiver
    stack_metadata:
      framework: EJB 2.0
      ejb.bean: OrderFulfillmentFacadeEJB
  - record_key: SUPF-RULE-0005
    kind: business-rule
    capability_key: supplier-fulfilment
    requirement: >
      The system SHALL generate an invoice document covering only the line items shipped in the current pass, with the order id and order date of the purchase order, the shipping date set to the time of generation, and the customer label fixed as "Dear PetStore Customer".
    plain_text: >
      Each time lines are shipped, an invoice is produced for just those lines, dated today, addressed generically to "Dear PetStore Customer" rather than the real customer.
    technical_note: >
      createInvoice builds TPAInvoiceXDE; userId is a hard-coded literal; only items present in the 'items' map are added.
    interface: true
    confidence: medium
    confidence_basis: Single clear place; the user label is a bare literal.
    risk_class: financial
    basis: Invoice content construction.
    traces:
      - path: legacy-source/app/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/orderfulfillment/ejb/OrderFulfillmentFacadeEJB.java
        line_start: 148
        line_end: 153
        excerpt: |
          invoiceXDE.setOrderId(po.getPoId());
                invoiceXDE.setUserId("Dear PetStore Customer");
                Date poDate = new Date(po.getPoDate());
                invoiceXDE.setOrderDate(poDate);
                Date curDate = new Date();
                invoiceXDE.setShippingDate(curDate);
    stack_metadata:
      framework: EJB 2.0 + XML document helper
      ejb.bean: OrderFulfillmentFacadeEJB
  - record_key: SUPF-INTG-0006
    kind: integration
    capability_key: order-processing-workflow
    requirement: >
      The system SHALL publish each generated invoice as a text message to the invoice topic so the order processing application receives it; when no invoice was produced no message SHALL be sent.
    plain_text: >
      Invoices created by the supplier are sent on to the main order system; nothing is sent when nothing shipped.
    technical_note: >
      SupplierOrderTD.doTransition sends the XML via TopicSender to jms/opc/InvoiceTopic (resource-env-ref). Delegate class comes from env-entry param/transitiondelegate/SupplierOrderTD (value redacted in source).
    interface: true
    confidence: high
    confidence_basis: Transition delegate, MDB caller and web.xml resource refs agree.
    risk_class: operational
    basis: Hand-off from supplier to the order processing application through a JMS topic.
    traces:
      - path: legacy-source/app/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/transitions/SupplierOrderTD.java
        line_start: 76
        line_end: 83
        excerpt: |
          public void doTransition(TransitionInfo info) throws TransitionException {
              String xmlInvoice = info.getXMLMessage();
              try {
                invoiceTopicSender.sendMessage(xmlInvoice);
              } catch(JMSException je) {
                  throw new TransitionException(je);
              }
      - path: legacy-source/app/src/apps/supplier/src/docroot/WEB-INF/web.xml
        line_start: 80
        line_end: 83
        excerpt: |
          <resource-env-ref-name>jms/opc/InvoiceTopic</resource-env-ref-name>
    stack_metadata:
      framework: JMS topic
      jms.queue: jms/opc/InvoiceTopic
  - record_key: SUPF-WKFL-0007
    kind: workflow
    capability_key: supplier-fulfilment
    requirement: >
      WHEN the supplier administrator submits inventory updates, the system SHALL in one transaction replace the stock quantity of each ticked item that has a non-empty quantity of zero or more, then reprocess all pending purchase orders, then send the resulting invoices.
    plain_text: >
      After the supplier administrator enters new stock levels, every waiting order is retried against the new stock and invoices go out for whatever can now be shipped. The entered number replaces the current stock; it is not added to it.
