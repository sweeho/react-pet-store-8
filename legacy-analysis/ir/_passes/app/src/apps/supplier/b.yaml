  - record_key: SUPF-RULE-0008
    kind: business-rule
    capability_key: supplier-fulfilment
    requirement: >
      The system SHALL, on each pending-order reprocessing run, select all purchase orders in PENDING status and attempt fulfilment on each, returning only the invoices actually produced; an order whose invoice cannot be built SHALL be skipped without failing the run.
    plain_text: >
      When stock is updated, all orders still waiting are retried one by one. An order whose invoice cannot be produced is skipped and stays stored for a later try.
    technical_note: >
      processPendingPO uses findOrdersByStatus(PENDING); XMLDocumentException is caught and printed to stdout.
