findings:
  - kind: ambiguity
    path: legacy-source/app/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/inventory/web/RcvrRequestProcessor.java
    description: >
      The servlet's doGet forwards to index.jsp via a shared instance field (fromDoGet) which is not thread safe, and the logout/displayinventory branches fall through without return. Intent for concurrent use is unclear; a human should decide whether to preserve.
suspected_defects:
  - capability_key: supplier-fulfilment
    record_keys: [SUPF-WKFL-0007]
    severity: medium
    category: error-swallowed
    title: Inventory update failures are only printed, user sees no error
    description: >
      Exceptions in the update transaction (finder, naming, rollback, system) are caught and printed to the stack trace; no response is sent and a failed transaction is not explicitly rolled back. Invalid number input throws an unchecked error outside the catch list.
    traces:
      - path: legacy-source/app/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/inventory/web/RcvrRequestProcessor.java
        line_start: 190
        line_end: 205
  - capability_key: supplier-fulfilment
    record_keys: [SUPF-RULE-0005]
    severity: medium
    category: other
    title: Invoice addressed to a fixed generic label, not the customer
    description: >
      The invoice user id is always the literal "Dear PetStore Customer", so the real customer identity is never carried to the invoice.
    traces:
      - path: legacy-source/app/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/orderfulfillment/ejb/OrderFulfillmentFacadeEJB.java
        line_start: 149
        line_end: 149
  - capability_key: supplier-fulfilment
    record_keys: [SUPF-RULE-0002, SUPF-RULE-0004]
    severity: medium
    category: data-corruption
    title: Stock decremented before invoice build can fail
    description: >
      Stock reduction and shipped quantity are set inside processAnOrder before the invoice is generated. If invoice generation fails the exception is swallowed and null returned, so goods are marked shipped with no invoice sent and no later retry (line is skipped as already shipped).
    traces:
      - path: legacy-source/app/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/orderfulfillment/ejb/OrderFulfillmentFacadeEJB.java
        line_start: 187
        line_end: 208
