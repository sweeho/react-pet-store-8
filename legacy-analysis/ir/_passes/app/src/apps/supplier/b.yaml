  - record_key: SUPF-RULE-0003
    kind: business-rule
    capability_key: supplier-fulfilment
    requirement: >
      GIVEN a line item whose inventory record does not exist, WHEN fulfilment is attempted, THEN the line SHALL be treated as unavailable and left unshipped.
    plain_text: >
      If the supplier has no stock record at all for an item, that line simply cannot be filled yet.
    technical_note: >
      FinderException from findByPrimaryKey is caught and swallowed in checkInventory, returning false (comment says supplier not populated).
    interface: false
    confidence: medium
    confidence_basis: One place, with an explanatory comment.
    risk_class: operational
    basis: Explicit catch and comment.
