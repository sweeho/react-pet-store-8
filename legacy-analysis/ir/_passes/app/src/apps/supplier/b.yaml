records:
  - record_key: SUPF-RULE-0001
    kind: business-rule
    capability_key: supplier-fulfilment
    requirement: >
      The system SHALL, on receiving a supplier purchase order, persist the order and then attempt to fulfil each of its line items against inventory.
    plain_text: >
      When the supplier gets a purchase order it records the order first and then tries to ship each line from stock.
    technical_note: >
      SupplierOrderMDB.onMessage passes the text to OrderFulfillmentFacade.processPO, which converts the XML, creates the order entity and calls processAnOrder.
    interface: true
    confidence: high
    confidence_basis: Facade processPO and the MDB caller both read; ejb-jar declares the beans. Queue wiring itself is outside this module.
    risk_class: operational
    basis: processPO persists before fulfilment, so an order that cannot be filled stays stored as pending.
    traces:
      - path: legacy-source/app/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/orderfulfillment/ejb/OrderFulfillmentFacadeEJB.java
        line_start: 233
        line_end: 235
        excerpt: |
          order = supplierOrderLocalHome.create(supplierOrder);
              //fullfil order
              invoiceXml = processAnOrder(order);
      - path: legacy-source/app/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/processpo/ejb/SupplierOrderMDB.java
        line_start: 100
        line_end: 106
        excerpt: |
          String invoice = doWork(recdText);
    stack_metadata:
      framework: EJB 2.0 MDB + session bean
      ejb.bean: SupplierOrderMDB, OrderFulfillmentFacadeEJB
      jms.queue: supplier order queue (inbound)
  - record_key: SUPF-RULE-0002
    kind: business-rule
    capability_key: supplier-fulfilment
    requirement: >
      The system SHALL ship a line item only in full: if stock for the item is at least the ordered quantity, stock SHALL be reduced by that quantity and the line marked fully shipped; otherwise the line SHALL be left unshipped (no partial shipment). Lines already fully shipped SHALL be skipped.
    plain_text: >
      A line is shipped completely or not at all. If stock covers the whole quantity it is taken from stock; if not, the line waits.
    technical_note: >
      checkInventory compares Inventory.getQuantity() to the line quantity and calls reduceQuantity; processAnOrder then sets quantityShipped = quantity.
    interface: false
    confidence: high
    confidence_basis: Logic in facade plus the inventory entity's reduceQuantity; two places read.
    risk_class: financial
    basis: Whole-line stock check, decrement, and skip of already shipped lines.
    traces:
      - path: legacy-source/app/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/orderfulfillment/ejb/OrderFulfillmentFacadeEJB.java
        line_start: 126
        line_end: 139
        excerpt: |
          InventoryLocal inv = invHome.findByPrimaryKey(item.getItemId());
                if(inv.getQuantity() < item.getQuantity())
                  return(false);
                inv.reduceQuantity(item.getQuantity());
