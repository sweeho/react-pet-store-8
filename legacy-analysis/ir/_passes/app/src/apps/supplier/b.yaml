  - record_key: SUPF-RULE-0009
    kind: business-rule
    capability_key: sign-on-security
    requirement: >
      The system SHALL restrict the supplier inventory update request handler to authenticated users in the administrator role, using form-based login, and SHALL show a "not authorised" message on the inventory screen to a user not in that role.
    plain_text: >
      Only a logged-in administrator can view the inventory update form and submit changes; anyone else sees a not-authorised message.
