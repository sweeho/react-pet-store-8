  - record_key: CUSTOMER-ACCOUNTS-REQ-0001
    kind: requirement
    capability_key: customer-accounts
    requirement: >
      The system SHALL create a customer from a submitted form holding contact info (last name, first name, street address, city, state or province, postal code, country, telephone, optional email and address line 2), a credit card (number, type, expiry month and year) and profile preferences (language, favorite category, my-list on/off, banners on/off), and SHALL store them on the customer's account, address, card and profile.
