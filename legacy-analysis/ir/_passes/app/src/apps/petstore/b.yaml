records:
  - record_key: CHECKOUT-PAYMENT-REQ-0001
    kind: business-rule
    capability_key: checkout-payment
    requirement: >
      The system SHALL reject order submission when any required billing or shipping field (last name, first name, street address, city, state or province, postal code, telephone number) is blank after trimming, reporting the list of missing fields; address line 2 and email are optional.
    plain_text: >
      A customer cannot place an order unless name, street address, city, state, postal code and phone number are filled in for both the billing and shipping addresses.
    technical_note: >
      OrderHTMLAction.extractContactInfo is called for suffix "_a" (bill-to) and "_b" (ship-to). Missing fields go into a MissingFormDataException stored as a request attribute and null is returned. Country is not checked.
    interface: false
    confidence: medium
    confidence_basis: >
      One clear place (server-side action). The JSP marks inputs with validation="validation" but the client script was not read, so no second confirmed enforcement point.
    risk_class: operational
    basis: Explicit blank checks per field with a missing-field list.
    traces:
      - path: legacy-source/app/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/web/actions/OrderHTMLAction.java
        line_start: 80
        line_end: 81
        excerpt: |
          ContactInfo shipper = extractContactInfo(request, "_a");
                  ContactInfo receiver = extractContactInfo(request, "_b");
      - path: legacy-source/app/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/web/actions/OrderHTMLAction.java
        line_start: 150
        line_end: 154
        excerpt: |
          if (missingFields != null) {
                      MissingFormDataException ex = new MissingFormDataException("Missing Address Data", missingFields);
                      request.setAttribute(PetstoreKeys.MISSING_FORM_DATA_EXCEPTION_KEY, ex);
                      return null;
                  }
    stack_metadata:
      framework: WAF (Sun Blueprints) front controller
      jsp.page: enter_order_information.jsp
  - record_key: CHECKOUT-PAYMENT-REQ-0002
    kind: business-rule
    capability_key: checkout-payment
    requirement: >
      The system SHALL attach a fixed credit card (number "1234-2334", type "Duke Express", expiry "10/2001") to every submitted order, regardless of any card data held on the customer account.
    plain_text: >
      Every order is currently recorded against the same placeholder payment card; the customer's own card is not used.
    technical_note: >
      OrderHTMLAction.perform builds a CreditCard from literals. The order form has no card fields. A preceding comment says "XXXX this needs to be part of the form".
    interface: false
    confidence: high
    confidence_basis: Hard-coded literal plus developer comment plus absence of card fields in the order form; no document confirms intent.
    risk_class: financial
    basis: Literal credit card construction.
    traces:
      - path: legacy-source/app/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/web/actions/OrderHTMLAction.java
        line_start: 79
        line_end: 83
        excerpt: |
          // XXXX this needs to be part of the form
                  ContactInfo shipper = extractContactInfo(request, "_a");
                  ContactInfo receiver = extractContactInfo(request, "_b");
                  CreditCard creditCard = new CreditCard( "1234-2334", "Duke Express", "10/2001") ;
                  return new OrderEvent(shipper,receiver,creditCard);
    stack_metadata:
      framework: WAF
  - record_key: CHECKOUT-PAYMENT-REQ-0003
    kind: requirement
    capability_key: checkout-payment
    requirement: >
      The system SHALL, on order submission, assign a unique order id, stamp the order with the current date, signed-on user id, billing email, session locale, billing and shipping contact info and card, create one line item per cart entry (numbered from 0, with category, product, item, quantity and unit cost), set total price to the sum of unit cost times quantity, send the order as an XML message to the asynchronous order channel, empty the cart, and return the order id and billing email.
    plain_text: >
      Placing an order gives the customer an order number, records what was bought and where it goes, sends it on for processing, clears the cart and confirms the order number and email address.
    technical_note: >
      OrderEJBAction gets an id from the UniqueIdGenerator EJB (prefix "1001"), builds a PurchaseOrder, calls AsyncSender.sendAMessage(purchaseOrder.toXML()), then cart.empty(). Totals use float arithmetic.
    interface: true
    confidence: high
    confidence_basis: Behaviour in the EJB action plus the confirmation JSP that displays order id and email.
    risk_class: financial
    basis: Order construction and hand-off in OrderEJBAction.
    traces:
      - path: legacy-source/app/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/ejb/actions/OrderEJBAction.java
        line_start: 110
        line_end: 121
        excerpt: |
          orderIdString = uidgen.getUniqueId("1001");
              // get ther userId
              ShoppingClientFacadeLocal scf = null;
              scf = (ShoppingClientFacadeLocal)machine.getAttribute(PetstoreKeys.SHOPPING_CLIENT_FACADE);
              String userId = scf.getUserId();
              purchaseOrder.setOrderId(orderIdString);
              purchaseOrder.setUserId(userId);
              purchaseOrder.setEmailId(billTo.getEmail());
              purchaseOrder.setOrderDate(new Date());
              purchaseOrder.setShippingInfo(shipTo);
              purchaseOrder.setBillingInfo(billTo);
              purchaseOrder.setCreditCard(creditCard);
      - path: legacy-source/app/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/ejb/actions/OrderEJBAction.java
        line_start: 166
        line_end: 168
        excerpt: |
          // empty the shopping cart
              cart.empty();
              return new OrderEventResponse(billTo.getEmail(), orderIdString);
      - path: legacy-source/app/src/apps/petstore/src/docroot/order_completed.jsp
        line_start: 49
        line_end: 52
        excerpt: |
          Your order Id is <c:out value="${orderresponse.orderId}"/>
          <br>
          <br>
          You should receive a confirmation e-mail soon at <c:out value="${orderresponse.email}"/>
    stack_metadata:
      framework: WAF
      ejb.bean: OrderEJBAction via ShoppingControllerEJB
      jms.queue: AsyncSender (queue defined outside this module)
      ejb.transaction: Required
  - record_key: CHECKOUT-PAYMENT-REQ-0004
    kind: business-rule
    capability_key: checkout-payment
    requirement: >
      GIVEN the shopping cart contains no items WHEN an order is submitted THEN the system SHALL refuse the order, send nothing, and show the empty-cart order error screen.
    plain_text: >
      A customer cannot place an order with an empty cart; they see an explanatory page instead.
    technical_note: OrderEJBAction throws ShoppingCartEmptyOrderException; mappings.xml maps it to cart_empty_order_error.screen.
    interface: false
    confidence: high
    confidence_basis: Thrown in code and mapped to a screen in declarative config.
    risk_class: operational
    basis: Empty-cart check before line items are built.
    traces:
      - path: legacy-source/app/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/ejb/actions/OrderEJBAction.java
        line_start: 129
        line_end: 132
        excerpt: |
          // if the cart is empty throw an exception saying so
              if (items.size() == 0) {
                throw new ShoppingCartEmptyOrderException("Shopping cart is empty");
              }
      - path: legacy-source/app/src/apps/petstore/src/docroot/WEB-INF/mappings.xml
        line_start: 110
        line_end: 110
        excerpt: |
          <exception-mapping exception-class="com.sun.j2ee.blueprints.petstore.controller.exceptions.ShoppingCartEmptyOrderException" screen="cart_empty_order_error.screen"/>
    stack_metadata:
      framework: WAF
  - record_key: SHOPPING-CART-REQ-0001
    kind: requirement
    capability_key: shopping-cart
    requirement: >
      The system SHALL let a customer add an item to the cart, remove an item, and update the quantities of items in a single submission; the cart is shown with per-line unit cost and a total.
    plain_text: >
      Customers can add items, remove items and change quantities in their cart, and see a running total.
    technical_note: >
      CartHTMLAction maps action=purchase/remove/update to CartEvent ADD_ITEM/DELETE_ITEM/UPDATE_ITEMS; CartEJBAction delegates to the ShoppingCart EJB (another module). Quantity fields are named itemQuantity_<itemId>.
    interface: false
    confidence: high
    confidence_basis: Web action, EJB action and cart JSP agree. The total calculation lives in another module.
    risk_class: operational
    basis: Action dispatch plus cart screen.
    traces:
      - path: legacy-source/app/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/web/actions/CartHTMLAction.java
        line_start: 91
        line_end: 98
        excerpt: |
          if (actionType.equals("purchase")) {
                      String itemId = request.getParameter("itemId");
                      event = new CartEvent(CartEvent.ADD_ITEM, itemId);
                  }
                  else if (actionType.equals("remove")) {
                      String itemId = request.getParameter("itemId");
                      event = new CartEvent(CartEvent.DELETE_ITEM, itemId);
                  }
      - path: legacy-source/app/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/ejb/actions/CartEJBAction.java
        line_start: 66
        line_end: 70
        excerpt: |
          switch (ce.getActionType()) {
          
                    case  CartEvent.ADD_ITEM  : {
                        cart.addItem(ce.getItemId());
                    }
