      framework: WAF
      jsp.page: cart.jsp
  - record_key: SHOPPING-CART-REQ-0002
    kind: business-rule
    capability_key: shopping-cart
    requirement: >
      GIVEN a quantity update contains a value that is not a whole number WHEN the cart is updated THEN the system SHALL treat that quantity as 0.
    plain_text: >
      If a customer types something that is not a number as a quantity, that item's quantity becomes zero.
    technical_note: NumberFormatException is caught in CartHTMLAction and replaced by Integer 0. What quantity 0 does is decided in the cart EJB outside this module.
    interface: false
    confidence: medium
    confidence_basis: One clear place; downstream effect of quantity 0 not visible here.
    risk_class: operational
    basis: Catch block substituting zero.
    traces:
      - path: legacy-source/app/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/web/actions/CartHTMLAction.java
        line_start: 111
        line_end: 116
        excerpt: |
          try {
                          quantity = new Integer(value);
                      }
                      catch (NumberFormatException nfe) {
                          quantity = new Integer(0);
                      }
    stack_metadata:
      framework: WAF
