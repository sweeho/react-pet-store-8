suspected_defects:
  - capability_key: order-processing-workflow
    record_keys: [CHK-INT-0003]
    severity: high
    category: error-swallowed
    title: Failure to send the order message is swallowed and the cart is still emptied
    description: >
      Errors creating or sending the order message are only printed; the order response succeeds and the cart is emptied, so an order can be confirmed to the customer but never reach processing.
    traces:
      - path: legacy-source/app/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/ejb/actions/OrderEJBAction.java
        line_start: 155
        line_end: 167
  - capability_key: checkout-payment
    record_keys: [CHK-REQ-0005]
    severity: high
    category: other
    title: Order uses a hard-coded placeholder credit card
    description: >
      The customer-entered or stored card is ignored at checkout; every order carries the same literal card with an expired 2001 date.
    traces:
      - path: legacy-source/app/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/web/actions/OrderHTMLAction.java
        line_start: 82
        line_end: 82
  - capability_key: customer-accounts
    record_keys: [ACC-REQ-0010]
    severity: medium
    category: other
    title: Credit-card missing-field checks test the wrong variable and are never raised
    description: >
      Card type, expiry month and expiry year checks all test the card number being blank, and the collected missing-field list is never stored. The profile check list is likewise dropped. Contact-info checks do store the list, but returns null contact info which later code dereferences.
    traces:
      - path: legacy-source/app/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/web/actions/CustomerHTMLAction.java
        line_start: 143
        line_end: 174
  - capability_key: checkout-payment
    record_keys: [CHK-REQ-0002]
    severity: medium
    category: inconsistent-rounding
    title: Order total and unit cost accumulated in binary floating point
    description: >
      Unit cost is converted to float and the total is a float sum of cost times quantity, with no rounding step; totals can drift from exact decimal amounts. If the unique id generator cannot be created the code dereferences a null generator.
    traces:
      - path: legacy-source/app/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/ejb/actions/OrderEJBAction.java
        line_start: 123
        line_end: 138
  - capability_key: checkout-payment
    record_keys: [CHK-REQ-0004]
    severity: low
    category: other
    title: State/province missing-field label includes the form suffix
    description: >
      The missing-field message appends the "_a"/"_b" suffix to "State or Province", unlike other labels, and country is never checked.
    traces:
      - path: legacy-source/app/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/web/actions/OrderHTMLAction.java
        line_start: 123
        line_end: 139
findings:
  - kind: ambiguity
    path: legacy-source/app/src/apps/petstore/src/ejb-jar.xml
    description: >
      Shared sign-on, cart, customer and order components live in other modules; their rules (quantity 0 handling, duplicate user, approval limits) are not visible here. The extracted-documents folder legacy-analysis/sources was not present, so no document traces were possible.
