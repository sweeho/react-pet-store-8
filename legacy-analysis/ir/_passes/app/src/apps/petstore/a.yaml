    plain_text: >
      Name, street, city, state, postal code and phone are required on shipping and billing details; the second address line and e-mail may be left blank.
    technical_note: >
      OrderHTMLAction.extractContactInfo is called for suffixes _a (shipper) and _b (receiver). On missing data it sets MISSING_FORM_DATA_EXCEPTION_KEY in the request and returns null contact info.
