records:
  - record_key: CHK-REQ-0001
    kind: business-rule
    capability_key: checkout-payment
    requirement: >
      GIVEN a customer submits an order WHEN the shopping cart contains no items THEN the system SHALL reject the order with an empty-cart error and SHALL NOT create a purchase order.
    plain_text: >
      An order cannot be placed with an empty cart; the customer is shown an empty-cart error page.
    technical_note: >
      OrderEJBAction throws ShoppingCartEmptyOrderException when cart items size is 0; mappings.xml maps that exception to cart_empty_order_error.screen.
    interface: false
    confidence: high
    confidence_basis: >
      Enforced in the order action and routed to a dedicated error screen in mappings.xml (two places).
    risk_class: financial
    basis: Explicit check and exception-to-screen mapping.
    traces:
      - path: legacy-source/app/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/ejb/actions/OrderEJBAction.java
        line_start: 130
        line_end: 132
        excerpt: |
          if (items.size() == 0) {
            throw new ShoppingCartEmptyOrderException("Shopping cart is empty");
      - path: legacy-source/app/src/apps/petstore/src/docroot/WEB-INF/mappings.xml
        line_start: 110
        line_end: 110
        excerpt: |
          <exception-mapping exception-class="com.sun.j2ee.blueprints.petstore.controller.exceptions.ShoppingCartEmptyOrderException" screen="cart_empty_order_error.screen"/>
    stack_metadata:
      framework: WAF front controller
      struts.action: order.do
      ejb.bean: ShoppingClientFacadeEJB
  - record_key: CHK-REQ-0002
    kind: requirement
    capability_key: checkout-payment
    requirement: >
      The system SHALL build a purchase order from the cart with a newly generated unique order id, the signed-on user id, bill-to e-mail, order date, shipping and billing contact info, credit card, session locale, one line item per cart entry (numbered from 0 with category, product, item, quantity and unit cost) and a total price equal to the sum of unit cost times quantity.
    plain_text: >
      Placing an order records who ordered, when, where it ships and is billed, the card used, the language, each item with quantity and price, and the order total.
    technical_note: >
      OrderEJBAction.perform. Order id comes from UniqueIdGenerator with the literal seed "1001". Total is accumulated in a Java float.
    interface: false
    confidence: medium
    confidence_basis: One clear place; no test or configuration corroborates.
    risk_class: financial
    basis: Direct reading of order assembly code.
    traces:
      - path: legacy-source/app/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/ejb/actions/OrderEJBAction.java
        line_start: 110
        line_end: 146
        excerpt: |
          orderIdString = uidgen.getUniqueId("1001");
          purchaseOrder.setOrderId(orderIdString);
          purchaseOrder.setUserId(userId);
          purchaseOrder.setEmailId(billTo.getEmail());
          purchaseOrder.setOrderDate(new Date());
    stack_metadata:
      ejb.bean: UniqueIdGeneratorLocal
  - record_key: CHK-INT-0003
    kind: integration
    capability_key: order-processing-workflow
    requirement: >
      The system SHALL serialise each placed purchase order to XML and hand it to the asynchronous sender for delivery to the order-processing module, and SHALL then empty the shopping cart and return the order id and bill-to e-mail to the customer.
    plain_text: >
      After an order is placed it is passed on for back-office processing, the cart is cleared, and the customer receives an order number and confirmation address.
    technical_note: >
      AsyncSender.sendAMessage(purchaseOrder.toXML()) (JMS hand-off); cart.empty() follows regardless of send outcome; response is OrderEventResponse(email, orderId).
    interface: true
    confidence: medium
    confidence_basis: One clear place in code; queue destination not in this module.
    risk_class: operational
    basis: Order action code.
    traces:
      - path: legacy-source/app/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/ejb/actions/OrderEJBAction.java
        line_start: 147
        line_end: 168
        excerpt: |
          sender.sendAMessage(purchaseOrder.toXML());
          cart.empty();
          return new OrderEventResponse(billTo.getEmail(), orderIdString);
    stack_metadata:
      ejb.bean: AsyncSenderLocal
      jms.queue: via AsyncSender (destination configured outside this module)
