records:
  - record_key: SIGN-REQ-0001
    kind: requirement
    capability_key: sign-on-security
    requirement: The system SHALL restrict the admin entry point to authenticated users holding the administrator role, using a form-based sign-in page.
    confidence: high
    confidence_basis: Declared in the web descriptor (security constraint, login config, role) and mirrored by the sign-in form posting to the container check; two places agree.
    risk_class: regulated
    basis: web.xml constrains /AdminRequestProcessor (GET and POST) to role administrator with FORM login; login.jsp posts j_username/j_password.
    plain_text: Only signed-in administrators can reach the admin page and launch the admin tool.
    technical_note: Container-managed FORM authentication. Only /AdminRequestProcessor is constrained; the rich-client servlet is not (see suspected defect).
    interface: false
    stack_metadata:
      framework: servlet
      jsp.page: login.jsp
    traces:
      - path: legacy-source/app/src/apps/admin/src/docroot/WEB-INF/web.xml
        line_start: 75
        line_end: 97
        excerpt: |
          <security-constraint>
          <auth-constraint>
          <role-name>administrator</role-name>
          <auth-method>FORM</auth-method>
      - path: legacy-source/app/src/apps/admin/src/docroot/login.jsp
        line_start: 60
        line_end: 66
        excerpt: |
          <input type="text" size="15" name="j_username" value="jps_admin">
          <input type="password" size="15" name="j_password" value="admin">

  - record_key: SIGN-REQ-0002
    kind: requirement
    capability_key: sign-on-security
    requirement: The system SHALL end an administrator session after 54 minutes of inactivity, and SHALL invalidate the session when the administrator logs out.
    confidence: medium
    confidence_basis: Timeout is a single declared literal with no comment or test (54 is unusual); logout is one clear place. Not enforced in 2 places.
    risk_class: regulated
    basis: session-timeout 54 in web.xml; logout.jsp invalidates the session; AdminRequestProcessor forwards to logout.jsp.
    plain_text: An admin is signed out after 54 idle minutes or when they choose to log out.
    technical_note: web.xml session-config; logout screen value "logout" forwards to logout.jsp which calls session.invalidate() then shows the index page.
    interface: false
    stack_metadata:
      session.scope: http-session
      jsp.page: logout.jsp
