findings:
  - kind: ambiguity
    path: legacy-source/app/src/apps/admin/src/admin/com/sun/j2ee/blueprints/admin/web/AdminRequestBD.java
    description: >
      No order amount threshold or auto-approval limit appears in the admin module; the auto-approval rules belong to the OPC module. Also no legacy-analysis/sources documents were found bearing on this module, so no document trace could be cited.

suspected_defects:
  - capability_key: sign-on-security
    record_keys: [SIGN-REQ-0003, SIGN-REQ-0001]
    severity: high
    category: other
    title: Rich-client servlet is not covered by the security constraint
    description: >
      Only /AdminRequestProcessor requires the administrator role. /ApplRequestProcessor, which reads and changes orders, only checks that some session exists, so any session (e.g. from another application user) may pass. The sign-in form also pre-fills the default username and password, and transport is not required to be encrypted.
    traces:
      - path: legacy-source/app/src/apps/admin/src/docroot/WEB-INF/web.xml
        line_start: 75
        line_end: 88
      - path: legacy-source/app/src/apps/admin/src/admin/com/sun/j2ee/blueprints/admin/web/ApplRequestProcessor.java
        line_start: 94
        line_end: 99
      - path: legacy-source/app/src/apps/admin/src/docroot/login.jsp
        line_start: 60
        line_end: 66
  - capability_key: order-approval
    record_keys: [ORDA-REQ-0001, BATCH-REQ-0001]
    severity: medium
    category: error-swallowed
    title: Failures return a null reply instead of an error message
    description: >
      getOrders and getChartInfo print the stack trace and return null when the back end fails, so the client gets an empty reply rather than the error message used elsewhere. getProperDate also throws on a malformed date, which is uncaught.
    traces:
      - path: legacy-source/app/src/apps/admin/src/admin/com/sun/j2ee/blueprints/admin/web/ApplRequestProcessor.java
        line_start: 199
        line_end: 202
      - path: legacy-source/app/src/apps/admin/src/admin/com/sun/j2ee/blueprints/admin/web/ApplRequestProcessor.java
        line_start: 301
        line_end: 304
  - capability_key: batch-operations
    record_keys: [BATCH-REQ-0001]
    severity: low
    category: inconsistent-rounding
    title: Revenue totals use single-precision float
    description: >
      Revenue amounts and the total are summed as float, which can drift from exact currency values.
    traces:
      - path: legacy-source/app/src/apps/admin/src/admin/com/sun/j2ee/blueprints/admin/web/ApplRequestProcessor.java
        line_start: 266
        line_end: 275
