suspected_defects:
  - capability_key: sign-on-security
    record_keys: [SIGN-REQ-0001, SIGN-REQ-0005]
    severity: high
    category: other
    title: Rich-client service is not covered by the administrator security constraint
    description: >
      Only /AdminRequestProcessor requires the administrator role. /ApplRequestProcessor, which returns order data and accepts approvals, is protected only by the existence of any session.
    traces:
      - path: legacy-source/app/src/apps/admin/src/docroot/WEB-INF/web.xml
        line_start: 75
        line_end: 88
      - path: legacy-source/app/src/apps/admin/src/admin/com/sun/j2ee/blueprints/admin/web/ApplRequestProcessor.java
        line_start: 88
        line_end: 99
  - capability_key: sign-on-security
    record_keys: [SIGN-REQ-0001, SIGN-SCR-0001]
    severity: medium
    category: other
    title: Demo credentials prefilled and transport not required to be secure
    description: >
      The login form pre-fills jps_admin/admin, and the constraint states transport-guarantee NONE, so credentials and the session id (passed in the launch file) travel unencrypted.
    traces:
      - path: legacy-source/app/src/apps/admin/src/docroot/login.jsp
        line_start: 60
        line_end: 66
      - path: legacy-source/app/src/apps/admin/src/docroot/WEB-INF/web.xml
        line_start: 85
        line_end: 87
  - capability_key: order-approval
    record_keys: [ORDAPP-REQ-0002, BATCH-REQ-0001]
    severity: medium
    category: error-swallowed
    title: Backend failures on order list and report requests return null
    description: >
      getOrders and getChartInfo catch the delegate exception, print the stack trace and return null, so the response is empty rather than an error message (unlike updateOrders, which reports an error). Also getOrders returns null when the facade returns no orders.
    traces:
      - path: legacy-source/app/src/apps/admin/src/admin/com/sun/j2ee/blueprints/admin/web/ApplRequestProcessor.java
        line_start: 199
        line_end: 202
      - path: legacy-source/app/src/apps/admin/src/admin/com/sun/j2ee/blueprints/admin/web/ApplRequestProcessor.java
        line_start: 301
        line_end: 304
  - capability_key: order-approval
    record_keys: [ORDAPP-REQ-0003]
    severity: medium
    category: other
    title: Success reported on message hand-off; unchecked order status values
    description: >
      The SUCCESS reply is sent when the message is queued, not when orders are updated. Order status is not validated server side, and the client's checkStatus validation uses reference comparison and never throws.
    traces:
      - path: legacy-source/app/src/apps/admin/src/admin/com/sun/j2ee/blueprints/admin/web/ApplRequestProcessor.java
        line_start: 226
        line_end: 231
      - path: legacy-source/app/src/apps/admin/src/client/com/sun/j2ee/blueprints/admin/client/PetStoreProxy.java
        line_start: 83
        line_end: 88
  - capability_key: sign-on-security
    record_keys: [SIGN-REQ-0004, ORDAPP-REQ-0001]
    severity: low
    category: unreachable-branch
    title: Logout and launch actions fall through, and missing action returns nothing
    description: >
      doPost has no return after forwarding to logout, so a launch branch could also run; a missing currentScreen yields an empty response without error.
    traces:
      - path: legacy-source/app/src/apps/admin/src/admin/com/sun/j2ee/blueprints/admin/web/AdminRequestProcessor.java
        line_start: 104
        line_end: 118
  - capability_key: batch-operations
    record_keys: [BATCH-REQ-0001]
    severity: medium
    category: inconsistent-rounding
    title: Revenue total accumulated in single-precision float
    description: >
