records:
  - record_key: SIGN-REQ-0001
    kind: requirement
    capability_key: sign-on-security
    requirement: >
      The system SHALL restrict the admin entry servlet (GET and POST) to authenticated users holding the "administrator" role, using a form-based login.
    confidence: high
    confidence_basis: >
      Declared in the web descriptor (security-constraint, login-config) and the role is mapped to a principal and group in the deployment descriptor and listed in the application descriptor; three places agree. The rich-client servlet is not in the constraint (see defect).
    risk_class: regulated
    basis: web.xml security-constraint on /AdminRequestProcessor requires role administrator; FORM login with login.jsp and error.jsp.
    plain_text: >
      Only signed-in administrators may use the admin module, and they sign in with a user ID and password form.
    technical_note: >
      Container-managed FORM auth in web.xml; role administrator mapped to principal jps_admin and group administrator_group in sun-j2ee-ri.xml; declared in application.xml.
    interface: false
    traces:
      - path: legacy-source/app/src/apps/admin/src/docroot/WEB-INF/web.xml
        line_start: 75
        line_end: 97
        excerpt: |
          <security-constraint>
            <web-resource-collection>
              <web-resource-name>MySecureBit0</web-resource-name>
              <url-pattern>/AdminRequestProcessor</url-pattern>
      - path: legacy-source/app/src/apps/admin/src/sun-j2ee-ri.xml
        line_start: 45
        line_end: 55
        excerpt: |
          <role name="administrator">
    stack_metadata:
      framework: servlet
      session.scope: http-session
  - record_key: SIGN-REQ-0002
    kind: requirement
    capability_key: sign-on-security
    requirement: >
      The system SHALL expire an admin web session after 54 minutes of inactivity.
    confidence: medium
    confidence_basis: One declarative value in web.xml; no comment or test explains why 54.
    risk_class: operational
    basis: session-timeout configured as 54.
    plain_text: >
      An administrator who is idle for 54 minutes is signed out.
    technical_note: web.xml session-config session-timeout 54 (minutes).
    interface: false
    traces:
      - path: legacy-source/app/src/apps/admin/src/docroot/WEB-INF/web.xml
        line_start: 67
        line_end: 69
        excerpt: |
          <session-config>
            <session-timeout>54</session-timeout>
          </session-config>
    stack_metadata:
      framework: servlet
      session.scope: http-session
