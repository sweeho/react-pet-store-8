records:
  - record_key: ORDP-INT-0001
    kind: integration
    capability_key: order-processing-workflow
    requirement: >
      The system SHALL exchange order status changes as an OrderApproval document containing one or more Order entries, each with an OrderId followed by an OrderStatus, and SHALL reject a document that does not have that structure.
    confidence: medium
    confidence_basis: >
      One clear place (DTD plus the matching read/write class); no document or test in this module shows which module consumes it, so not high.
    risk_class: operational
    basis: DTD requires Order+ with OrderId then OrderStatus; ChangedOrder writes and reads exactly these two children in order.
    plain_text: >
      When orders change status, the change is passed between parts of the system as a list of order numbers with their new status. A list with no orders, or an order missing its number or status, is refused.
    technical_note: >
      OrderApproval.dtd and ChangedOrder.toDOM/fromDOM. fromDOM uses getFirstChild with optional=false, so absent children raise XMLDocumentException. The DTD carries a FIXME that OrderStatus should be an attribute.
    interface: true
    traces:
      - path: legacy-source/app/src/components/xmldocuments/src/rsrc/schemas/OrderApproval.dtd
        line_start: 38
        line_end: 45
        excerpt: |
          <!ELEMENT OrderApproval (Order+)>

          <!ELEMENT Order (OrderId, OrderStatus)>

          <!ELEMENT OrderId (#PCDATA)>

          <!-- FIXME should be attribute -->
          <!ELEMENT OrderStatus (#PCDATA)>
      - path: legacy-source/app/src/components/xmldocuments/src/com/sun/j2ee/blueprints/xmldocuments/ChangedOrder.java
        line_start: 80
        line_end: 90
        excerpt: |
          public static ChangedOrder fromDOM(Node node) throws XMLDocumentException {
            Element element;
            if (node.getNodeType() == Node.ELEMENT_NODE && (element = ((Element) node)).getTagName().equals(XML_ORDER)) {
              Element child;
              ChangedOrder changedOrder = new ChangedOrder();
              changedOrder.orderId = XMLDocumentUtils.getContentAsString(child = XMLDocumentUtils.getFirstChild(element, XML_ORDERID, false), false);
              changedOrder.orderStatus = XMLDocumentUtils.getContentAsString(child = XMLDocumentUtils.getNextSibling(child, XML_ORDERSTATUS, false), false);
              return changedOrder;
            }
            throw new XMLDocumentException(XML_ORDER + " element expected.");
          }
    stack_metadata:
      framework: DOM/JAXP
      db.object: OrderApproval.dtd
  - record_key: ORDP-INT-0002
    kind: integration
    capability_key: order-approval
    requirement: >
      The system SHALL validate incoming OrderApproval documents against the Order Approval 1.0 DTD by default and SHALL fail with an error when the root element is not OrderApproval.
    confidence: medium
    confidence_basis: >
      Validation default and root-element check are each one clear place; the caller choosing validating=false was not examined.
    risk_class: operational
    basis: VALIDATING constant true is used by the short fromXML overloads; fromDOM throws unless root tag is OrderApproval.
    plain_text: >
      Order approval messages are checked for correct format when received; a message of the wrong kind is rejected.
    technical_note: >
      OrderApproval.fromXML(Source|String) pass VALIDATING=true to XMLDocumentUtils.fromXML, which checks the document type public id. Placement under order-approval is inferred from the name.
    interface: true
    traces:
      - path: legacy-source/app/src/components/xmldocuments/src/com/sun/j2ee/blueprints/xmldocuments/OrderApproval.java
        line_start: 67
        line_end: 69
        excerpt: |
          public static final String DTD_PUBLIC_ID = "-//Sun Microsystems, Inc. - J2EE Blueprints Group//DTD Order Approval 1.0//EN";
          public static final String DTD_SYSTEM_ID = "OrderApproval.dtd";
          public static final boolean VALIDATING = true;
      - path: legacy-source/app/src/components/xmldocuments/src/com/sun/j2ee/blueprints/xmldocuments/OrderApproval.java
        line_start: 156
        line_end: 169
        excerpt: |
          public static OrderApproval fromDOM(Node node) throws XMLDocumentException {
            Element element;
            if (node.getNodeType() == Node.ELEMENT_NODE && (element = ((Element) node)).getTagName().equals(XML_ORDERAPPROVAL)) {
              ...
            }
            throw new XMLDocumentException(XML_ORDERAPPROVAL + " element expected.");
          }
    stack_metadata:
      framework: DOM/JAXP
  - record_key: CHKP-INT-0001
    kind: integration
    capability_key: checkout-payment
    requirement: >
      The system SHALL represent a submitted purchase order as a document holding order id, user id, email, order date, ship-to and bill-to addresses (first name, last name, street, city, state, country, zip), total price, credit card (number, expiry date, type) and at least one line item, with locale defaulting to en_US.
    confidence: medium
    confidence_basis: >
      Single DTD; no Java class in this module builds PurchaseOrder, so its producers/consumers are not visible here.
    risk_class: financial
    basis: PurchaseOrder.dtd element and attribute declarations.
    plain_text: >
      An order sent for processing carries the customer, who it ships to and is billed to, the total, the card details and at least one purchased item. If no language is given, US English is assumed.
    technical_note: >
      rsrc/schemas/PurchaseOrder.dtd; shares LineItem.dtd. Card number is plain PCDATA in the document.
    interface: true
    traces:
      - path: legacy-source/app/src/components/xmldocuments/src/rsrc/schemas/PurchaseOrder.dtd
        line_start: 38
        line_end: 40
        excerpt: |
          <!ELEMENT PurchaseOrder (OrderId, UserId, EmailId, OrderDate, ShipAddress, BillAddress, TotalPrice, CreditCard, LineItem+)>

          <!ATTLIST PurchaseOrder
          	locale CDATA "en_US"
      - path: legacy-source/app/src/components/xmldocuments/src/rsrc/schemas/PurchaseOrder.dtd
        line_start: 74
        line_end: 74
        excerpt: |
          <!ELEMENT CreditCard (CardNumber, ExpiryDate, CardType)>
    stack_metadata:
      framework: DTD
  - record_key: SUPF-INT-0001
    kind: integration
    capability_key: supplier-fulfilment
    requirement: >
      The system SHALL send a supplier order document containing order id, order date (yyyy-MM-dd), shipping address (first name, last name, street, city, state, country, zip code, email, phone) and one or more line items, in that order.
    confidence: high
    confidence_basis: >
      DTD/XSD declare the structure and the builder class assembles the same order; two places agree.
    risk_class: operational
    basis: TPASupplierOrderXDE.copyDocument appends order id, date, address, line items; setOrderDate formats yyyy-MM-dd.
    plain_text: >
      When goods are ordered from a supplier, the request lists the order number, date, delivery address with contact details and the items wanted.
    technical_note: >
      TPASupplierOrderXDE with TPASupplierOrder.dtd/.xsd under namespace tpaso. XSD validation optional (constructor flag, default DTD). The older SupplierOrder.dtd (lowercase, no email/phone) in rsrc/schemas is a different, apparently superseded shape.
    interface: true
    traces:
      - path: legacy-source/app/src/components/xmldocuments/src/com/sun/j2ee/blueprints/xmldocuments/tpa/TPASupplierOrderXDE.java
        line_start: 119
        line_end: 126
        excerpt: |
          public void copyDocument(Result result) throws XMLDocumentException {
            Element supplierOrderElement = supplierOrderDocument.createElementNS(XML_NAMESPACE, XML_SUPPLIERORDER);
            supplierOrderElement.setAttributeNS("http://www.w3.org/2000/xmlns/", "xmlns:" + XML_PREFIX, XML_NAMESPACE);
            supplierOrderElement.appendChild(orderIdElement);
            supplierOrderElement.appendChild(orderDateElement);
            supplierOrderElement.appendChild(shippingAddressElement);
            supplierOrderElement.appendChild(lineItemsElement);
            supplierOrderDocument.appendChild(supplierOrderElement);
      - path: legacy-source/app/src/components/xmldocuments/src/com/sun/j2ee/blueprints/xmldocuments/tpa/TPASupplierOrderXDE.java
        line_start: 160
        line_end: 171
        excerpt: |
          public void setShippingAddress(String firstName, String lastName, String street, String city,
                                         String state, String country, String zipCode, String email, String phone) {
            shippingAddressElement = supplierOrderDocument.createElementNS(XML_NAMESPACE, XML_SHIPPINGADDRESS);
    stack_metadata:
      framework: DOM/JAXP
      db.object: TPASupplierOrder.dtd, TPASupplierOrder.xsd
  - record_key: SUPF-INT-0002
    kind: integration
    capability_key: supplier-fulfilment
    requirement: >
      The system SHALL send a supplier invoice document containing order id, user id, order date and shipping date (yyyy-MM-dd) and one or more line items.
    confidence: high
    confidence_basis: >
      Builder class and TPAInvoice schemas describe the same structure.
    risk_class: financial
    basis: TPAInvoiceXDE.copyDocument element order and date setters.
    plain_text: >
      An invoice for a shipped order states the order number, customer, order and shipping dates and the items invoiced.
    technical_note: >
      TPAInvoiceXDE, namespace tpai. Older Invoice.dtd (adds locale attribute) is a separate non-TPA shape. The invoice has no total; amounts are per line unit price only.
    interface: true
    traces:
      - path: legacy-source/app/src/components/xmldocuments/src/com/sun/j2ee/blueprints/xmldocuments/tpa/TPAInvoiceXDE.java
        line_start: 113
        line_end: 121
        excerpt: |
          public void copyDocument(Result result) throws XMLDocumentException {
            Element invoiceElement = invoiceDocument.createElementNS(XML_NAMESPACE, XML_INVOICE);
            invoiceElement.setAttributeNS("http://www.w3.org/2000/xmlns/", "xmlns:" + XML_PREFIX, XML_NAMESPACE);
            invoiceElement.appendChild(orderIdElement);
            invoiceElement.appendChild(userIdElement);
            invoiceElement.appendChild(orderDateElement);
            invoiceElement.appendChild(shippingDateElement);
            invoiceElement.appendChild(lineItemsElement);
    stack_metadata:
      framework: DOM/JAXP
  - record_key: SUPF-RULE-0001
    kind: business-rule
    capability_key: supplier-fulfilment
    requirement: >
      The system SHALL require each line item in supplier orders and invoices to carry category id, product id, item id, line number (non-negative integer), quantity (positive integer) and unit price (decimal not below zero).
    confidence: high
    confidence_basis: >
      XSD restrictions plus the DTD and the code that writes all six attributes.
    risk_class: financial
    basis: TPALineItem.xsd attribute use=required and type restrictions; TPALineItemUtils writes the six attributes.
    plain_text: >
      Every item on a supplier order or invoice must give its category, product, item, line number, a quantity of at least one, and a price of zero or more.
    technical_note: >
      Restrictions are enforced only when XSD validation is enabled; the builder itself does not check values. Unit price is a Java float written with Float.toString, so large or fractional prices may print in exponent or inexact form.
    interface: true
    traces:
      - path: legacy-source/app/src/components/xmldocuments/src/com/sun/j2ee/blueprints/xmldocuments/rsrc/schemas/TPALineItem.xsd
        line_start: 11
        line_end: 22
        excerpt: |
          <xsd:attribute name="lineNo" type="xsd:nonNegativeInteger" use="required" />
          <xsd:attribute name="quantity" type="xsd:positiveInteger" use="required" />
          <xsd:attribute name="unitPrice" type="positiveDecimal" use="required" />
          <xsd:minInclusive value="0.0" />
      - path: legacy-source/app/src/components/xmldocuments/src/com/sun/j2ee/blueprints/xmldocuments/tpa/TPALineItemUtils.java
        line_start: 58
        line_end: 76
        excerpt: |
          lineItemElement.setAttributeNS(XML_NAMESPACE, XML_QUANTITY, Long.toString(quantity));
          lineItemElement.setAttributeNS(XML_NAMESPACE, XML_UNITPRICE, Float.toString(unitPrice));
    stack_metadata:
      framework: DOM/JAXP
  - record_key: CUSN-INT-0001
    kind: integration
    capability_key: customer-notifications
    requirement: >
      The system SHALL represent an outgoing mail message as a document with an address, a subject and content.
    confidence: medium
    confidence_basis: >
      One DTD; no code in this module uses it, so how it is sent is not visible here.
    risk_class: presentational
    basis: Mail.dtd.
    plain_text: >
      Each notification email has a recipient, a subject line and a body.
    technical_note: rsrc/schemas/Mail.dtd; consumer lives in another module.
    interface: true
    traces:
      - path: legacy-source/app/src/components/xmldocuments/src/rsrc/schemas/Mail.dtd
        line_start: 38
        line_end: 41
        excerpt: |
          <!ELEMENT Mail (Address, Subject, Content)>
          <!ELEMENT Address (#PCDATA)>
          <!ELEMENT Subject (#PCDATA)>
          <!ELEMENT Content (#PCDATA)>
    stack_metadata:
      framework: DTD
suspected_defects:
  - capability_key: order-approval
    record_keys: [ORDP-INT-0002]
    severity: low
    category: error-swallowed
    title: Parse failure is printed to stderr before rethrow
    description: >
      OrderApproval.fromXML(String) writes the root-cause message to standard error and wraps the exception; the message reaches no log or user.
    traces:
      - path: legacy-source/app/src/components/xmldocuments/src/com/sun/j2ee/blueprints/xmldocuments/OrderApproval.java
        line_start: 130
        line_end: 137
        excerpt: |
          } catch (XMLDocumentException exception) {
            System.err.println(exception.getRootCause().getMessage());
            throw new XMLDocumentException(exception);
  - capability_key: supplier-fulfilment
    record_keys: [SUPF-RULE-0001]
    severity: low
    category: other
    title: Unit price carried as float
    description: >
      Prices are passed as Java float and written with Float.toString, so monetary values can lose precision or be written in exponent notation.
    traces:
      - path: legacy-source/app/src/components/xmldocuments/src/com/sun/j2ee/blueprints/xmldocuments/tpa/TPALineItemUtils.java
        line_start: 76
        line_end: 76
        excerpt: |
          lineItemElement.setAttributeNS(XML_NAMESPACE, XML_UNITPRICE, Float.toString(unitPrice));
findings:
  - kind: ambiguity
    path: legacy-source/app/src/components/xmldocuments/src/rsrc/schemas/SupplierOrder.dtd
    description: >
      Legacy-style SupplierOrder.dtd, Invoice.dtd and PurchaseOrder.dtd sit beside the newer TPA schemas. No Java class in this module references them, so whether they are still used by other modules is unknown. No documents under legacy-analysis/sources exist for this module.
