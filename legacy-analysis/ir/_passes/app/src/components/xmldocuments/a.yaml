suspected_defects:
  - capability_key: supplier-fulfilment
    record_keys: [SUPPLY-ENTITY-0003]
    severity: medium
    category: inconsistent-rounding
    title: Unit price carried as a 32-bit float
    description: >
      Unit prices are written with Float.toString of a float, which can introduce
      binary rounding artefacts into monetary values on invoices and supplier orders.
    traces:
      - path: legacy-source/app/src/components/xmldocuments/src/com/sun/j2ee/blueprints/xmldocuments/tpa/TPALineItemUtils.java
        line_start: 66
        line_end: 74
