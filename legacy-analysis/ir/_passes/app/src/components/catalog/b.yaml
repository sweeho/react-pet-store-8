suspected_defects:
  - capability_key: catalog-browsing
    record_keys: [CATB-REQ-0005]
    severity: medium
    category: other
    title: Generic search does not lower-case keywords but SQL compares lower(column)
    description: >
      The SQL lower-cases name, category id and description before LIKE, but GenericCatalogDAO binds the keyword as typed. A keyword containing capitals can never match. The alternate Cloudscape DAO lower-cases keywords, so the two implementations behave differently.
    traces:
      - path: legacy-source/app/src/components/catalog/src/com/sun/j2ee/blueprints/catalog/dao/GenericCatalogDAO.java
        line_start: 361
        line_end: 364
        excerpt: |
          for (int i = 0; i < keywords.length; i++) {
            parameterValues[(i * 3) + 1] = "%" + keywords[i] + "%";
      - path: legacy-source/app/src/components/catalog/src/com/sun/j2ee/blueprints/catalog/dao/CloudscapeCatalogDAO.java
        line_start: 392
        line_end: 392
        excerpt: |
          String keyword = ((String) it.next()).toLowerCase();
  - capability_key: catalog-browsing
    record_keys: [CATB-REQ-0003, CATB-REQ-0004]
    severity: low
    category: other
    title: Paging reads at least one row even when count is zero or less
    description: >
      The do/while loop adds the first row before testing count, so a request for zero rows still returns one.
    traces:
