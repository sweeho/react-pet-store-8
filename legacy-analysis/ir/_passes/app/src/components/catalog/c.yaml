    risk_class: presentational
    basis: GET_PRODUCTS and GET_PRODUCT statements; getProduct returns null when no row.
    plain_text: Shoppers can see the products inside a category, sorted by name, and open one product to read its name and description.
    technical_note: GenericCatalogDAO.getProducts/getProduct; CatalogEJB delegates and wraps DAO failures in EJBException.
    interface: false
    traces:
      - path: legacy-source/app/src/apps/petstore/src/docroot/CatalogDAOSQL.xml
        line_start: 85
        line_end: 91
        excerpt: |
          <SQLStatement method="GET_PRODUCTS">
              <SQLFragment parameterNb="2">
                  select a.productid, name, descn
                      from (product a join product_details b on a.productid=b.productid)
                      where locale = ? and a.catid = ? order by name
      - path: legacy-source/app/src/components/catalog/src/com/sun/j2ee/blueprints/catalog/dao/GenericCatalogDAO.java
        line_start: 224
        line_end: 227
        excerpt: |
          if (resultSet.first()) {
            return new Product(productID, resultSet.getString(1), resultSet.getString(2));
