records:
  - record_key: CATALOG-BROWSING-REQ-0001
    kind: requirement
    capability_key: catalog-browsing
    requirement: >
      The system SHALL list all categories for the requested locale ordered by category name, each with its identifier, name and description.
    confidence: high
    confidence_basis: >
      The ordering is in the SQL configuration and the mapping is in the DAO method; two places. The deployed database setting is redacted so the exact SQL dialect in use is not visible.
    risk_class: presentational
    basis: GET_CATEGORIES statement orders by name and filters on locale; getCategories maps rows to categories.
    plain_text: Shoppers see every product category in their language, sorted alphabetically by name.
    technical_note: GenericCatalogDAO.getCategories runs the GET_CATEGORIES statement from CatalogDAOSQL.xml (petstore docroot), exposed via CatalogEJB and CatalogHelper.
    interface: false
    traces:
      - path: legacy-source/app/src/apps/petstore/src/docroot/CatalogDAOSQL.xml
        line_start: 71
        line_end: 77
        excerpt: |
          <SQLStatement method="GET_CATEGORIES">
              <SQLFragment parameterNb="1">
                  select a.catid, name, descn
                      from (category a join category_details b on a.catid=b.catid) 
                      where locale = ?  order by name
              </SQLFragment>
          </SQLStatement>
      - path: legacy-source/app/src/components/catalog/src/com/sun/j2ee/blueprints/catalog/dao/GenericCatalogDAO.java
        line_start: 182
        line_end: 203
        excerpt: |
          public Page getCategories(int start, int count, Locale locale) throws CatalogDAOSysException {
          ...
                statement = buildSQLStatement(connection, sqlStatements, XML_GET_CATEGORIES, parameterValues);
    stack_metadata:
      framework: EJB 2.x stateless session bean + DAO
      ejb.bean: CatalogEJB
      ejb.transaction: Required
      db.object: category, category_details

  - record_key: CATALOG-BROWSING-REQ-0002
