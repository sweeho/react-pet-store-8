  - record_key: CATALOG-BROWSING-BR-0002
    kind: business-rule
    capability_key: catalog-browsing
    requirement: GIVEN a search query containing no keywords (empty or only whitespace) WHEN items are searched THEN the system SHALL return an empty page without querying the database.
    confidence: medium
    confidence_basis: One clear explicit branch.
    risk_class: presentational
    basis: Early return when keywordSet is empty.
    plain_text: A blank search returns no results.
    technical_note: Early return precedes connection acquisition.
    interface: false
    traces:
