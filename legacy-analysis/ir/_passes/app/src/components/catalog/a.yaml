  - record_key: CATALOG-BROWSING-REQ-0005
    kind: requirement
    capability_key: catalog-browsing
    requirement: The system SHALL select the catalog data-access implementation and the database dialect from deployment configuration (environment entries) rather than fixed code, and SHALL fail creation of the catalog service if the implementation cannot be resolved.
    confidence: high
    confidence_basis: Seen in deployment descriptor and in the factory code.
    risk_class: operational
    basis: ejb-jar.xml env-entries param/CatalogDAOClass and param/CatalogDAODatabase (values redacted in the copy read); factory looks up class name by JNDI and instantiates it, wrapping failure.
    plain_text: Which database the catalog reads from is a setting, and the catalog will not start if that setting is wrong.
    technical_note: CatalogDAOFactory.getDAO + CatalogEJB.ejbCreate throwing EJBException; Stateless session bean, container-managed transactions.
    interface: false
    traces:
      - path: legacy-source/app/src/components/catalog/src/ejb-jar.xml
        line_start: 57
        line_end: 68
        excerpt: |
          <env-entry>
            <env-entry-name>param/CatalogDAOClass</env-entry-name>
            <env-entry-type>java.lang.String</env-entry-type>
      - path: legacy-source/app/src/components/catalog/src/com/sun/j2ee/blueprints/catalog/dao/CatalogDAOFactory.java
        line_start: 152
        line_end: 154
        excerpt: |
          InitialContext ic = new InitialContext();
          String className = (String) ic.lookup(JNDINames.CATALOG_DAO_CLASS);
          catDao = (CatalogDAO) Class.forName(className).newInstance();
    stack_metadata:
      ejb.bean: CatalogEJB
      ejb.transaction: Container
      session.scope: Stateless
suspected_defects:
  - capability_key: catalog-browsing
    record_keys: [CATALOG-BROWSING-REQ-0001]
    severity: low
    category: other
    title: Result-set cleanup errors are silently swallowed
    description: >
      closeAll ignores every exception when closing result set, statement and connection, so a failed close leaks no signal.
    traces:
      - path: legacy-source/app/src/components/catalog/src/com/sun/j2ee/blueprints/catalog/dao/GenericCatalogDAO.java
        line_start: 138
        line_end: 153
  - capability_key: catalog-browsing
    record_keys: [CATALOG-BROWSING-REQ-0001]
    severity: low
    category: other
    title: A page with a zero or negative count still returns one entry
    description: >
      The paging loop is a do/while that adds a row before testing count, so count of 0 or less returns one row.
    traces:
      - path: legacy-source/app/src/components/catalog/src/com/sun/j2ee/blueprints/catalog/dao/GenericCatalogDAO.java
        line_start: 197
        line_end: 201
findings:
  - kind: ambiguity
    path: legacy-source/app/src/components/catalog/src/com/sun/j2ee/blueprints/catalog/model/Page.java
    description: >
      Page.EMPTY_PAGE appears only inside commented-out (XXX) blocks in the copy read, yet the DAO returns it. Whether a live definition exists (possibly a build-time variant) must be settled. Also, mid-run the working tree lost legacy-source, so the external SQL statement file (GET_* / SEARCH_ITEMS) and CatalogHelper were not re-checked; item column semantics unconfirmed.
