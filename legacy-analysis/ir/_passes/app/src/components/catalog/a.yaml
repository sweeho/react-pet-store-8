  - record_key: CATALOG-BROWSING-REQ-0002
    kind: requirement
    capability_key: catalog-browsing
    requirement: The system SHALL expose previous and next page navigation, where the start of the next page is the current start plus the number of entries on the page, and the start of the previous page is the current start minus the page size but never below zero.
    confidence: medium
    confidence_basis: One clear place (Page model); read directly, no second source.
    risk_class: presentational
    basis: Page.isPreviousPageAvailable is start > 0; getStartOfPreviousPage uses Math.max(start-size,0).
    plain_text: Shoppers can step forward and back through lists; going back never goes before the first entry.
    technical_note: model/Page.java value object.
    interface: false
    traces:
      - path: legacy-source/app/src/components/catalog/src/com/sun/j2ee/blueprints/catalog/model/Page.java
        line_start: 83
        line_end: 91
        excerpt: |
          public boolean isPreviousPageAvailable() {
              return start > 0;
          }
          public int getStartOfNextPage() { return start + objects.size(); }
          public int getStartOfPreviousPage() {
              return Math.max(start-objects.size(), 0);
          }
    stack_metadata:
      framework: Java model class
  - record_key: CATALOG-BROWSING-REQ-0003
    kind: requirement
    capability_key: catalog-browsing
    requirement: The system SHALL return the name and description of a single category, product or item for a given identifier in the requested locale, and SHALL return nothing when no matching row exists.
    confidence: medium
    confidence_basis: Read in three DAO getters; behaviour on missing row is explicit (return null).
    risk_class: presentational
    basis: getCategory/getProduct/getItem pass locale string and id to a SQL statement and return null if no first row.
    plain_text: Looking up one category, product or item shows its details in the shopper's language; an unknown id shows nothing.
    technical_note: SQL text is loaded from an external XML statement file keyed GET_CATEGORY, GET_PRODUCT, GET_ITEM; item lookup returns 13 columns including two numeric values.
    interface: false
    traces:
      - path: legacy-source/app/src/components/catalog/src/com/sun/j2ee/blueprints/catalog/dao/GenericCatalogDAO.java
        line_start: 165
        line_end: 174
        excerpt: |
          String[] parameterValues = new String[] { locale.toString(), categoryID };
          ...
          if (resultSet.first()) {
            return new Category(categoryID, resultSet.getString(1), resultSet.getString(2));
          }
          return null;
    stack_metadata:
      framework: EJB 2.0 / JDBC
      db.object: GET_CATEGORY, GET_PRODUCT, GET_ITEM
  - record_key: CATALOG-BROWSING-REQ-0004
    kind: requirement
    capability_key: catalog-browsing
    requirement: The system SHALL search items by keyword, splitting the query on whitespace into a distinct set of keywords and matching each keyword as a substring (three columns per keyword) in the requested locale.
    confidence: medium
    confidence_basis: Keyword splitting and parameter construction read clearly; the SQL (which columns, AND vs OR) lives in an external statement file not available in this pass.
    risk_class: presentational
    basis: searchItems tokenizes, de-duplicates via HashSet, and binds "%kw%" three times per keyword.
    plain_text: Shoppers can search the catalog by typing one or more words; each word is looked for anywhere in the item's text.
    technical_note: Which three columns are searched and how keywords are combined is defined in the SQL statement XML (SEARCH_ITEMS, VARIABLE occurrence), not in Java.
    interface: false
    traces:
      - path: legacy-source/app/src/components/catalog/src/com/sun/j2ee/blueprints/catalog/dao/GenericCatalogDAO.java
        line_start: 345
        line_end: 365
        excerpt: |
          Collection keywordSet = new HashSet();
          StringTokenizer tokenizer = new StringTokenizer(searchQuery);
          while (tokenizer.hasMoreTokens()) {
            keywordSet.add(tokenizer.nextToken());
          }
          ...
          parameterValues[(i * 3) + 1] = "%" + keywords[i] + "%";
    stack_metadata:
