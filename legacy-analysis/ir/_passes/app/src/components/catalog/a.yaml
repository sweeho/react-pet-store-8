records:
  - record_key: CAT-REQ-0001
    kind: requirement
    capability_key: catalog-browsing
    requirement: >
      The system SHALL present the catalog as a hierarchy of categories, products within a category, and items within a product, each retrievable by its identifier.
    plain_text: >
      Shoppers can browse categories, see the products in a category, and see the individual items offered for a product.
    technical_note: >
      CatalogEJB delegates getCategory/getCategories/getProduct/getProducts/getItem/getItems to a CatalogDAO. CatalogHelper offers the same operations to the web tier either via the EJB or directly via the DAO ("fast lane").
    interface: false
    confidence: high
    confidence_basis: >
      The same operations are enforced in the session bean, the DAO and the helper (three places), and the SQL configuration defines each statement.
    risk_class: operational
    basis: >
      Seven business methods mirrored across layers; a single-record lookup returns null when the id has no row.
    traces:
      - path: legacy-source/app/src/components/catalog/src/com/sun/j2ee/blueprints/catalog/ejb/CatalogEJB.java
        line_start: 85
        line_end: 149
        excerpt: |
          public Category getCategory(String categoryID, Locale l) {
          public Page getCategories(int start, int count, Locale l) {
          public Page getProducts(String categoryID, int start,
          public Product getProduct(String productID, Locale l) {
          public Page getItems(String productID, int start,
          public Item getItem(String itemID, Locale l) {
          public Page searchItems(String searchQuery, int start,
      - path: legacy-source/app/src/components/catalog/src/com/sun/j2ee/blueprints/catalog/dao/GenericCatalogDAO.java
        line_start: 159
        line_end: 180
        excerpt: |
          public Category getCategory(String categoryID, Locale locale) throws CatalogDAOSysException {
            ...
              if (resultSet.first()) {
                return new Category(categoryID, resultSet.getString(1), resultSet.getString(2));
              }
              return null;
    stack_metadata:
      framework: J2EE
      ejb.bean: CatalogEJB
      ejb.transaction: Required (per ejb-jar.xml container-transaction)
      db.object: category, category_details, product, product_details, item, item_details

  - record_key: CAT-REQ-0002
    kind: requirement
    capability_key: localization
    requirement: >
      The system SHALL return category, product and item names, descriptions and images only for the locale supplied with the request, by filtering the detail tables on that locale.
    plain_text: >
      Catalog text is shown in the shopper's language; only the entries for the shopper's language are returned.
    technical_note: >
      Every DAO query binds locale.toString() as the first parameter and filters on the locale column of the *_details tables (see CatalogDAOSQL.xml in the petstore app). Filed under localization because the catalog capability list has no separate locale key; the browsing aspect is CAT-REQ-0001.
    interface: false
    confidence: high
    confidence_basis: >
      Enforced in the Java parameter binding of every method and in the SQL where-clauses (two places).
    risk_class: presentational
    basis: >
      parameterValues always starts with locale.toString(); SQL has "where locale = ?" / "b.locale = ?".
    traces:
      - path: legacy-source/app/src/components/catalog/src/com/sun/j2ee/blueprints/catalog/dao/GenericCatalogDAO.java
        line_start: 165
        line_end: 165
        excerpt: |
          String[] parameterValues = new String[] { locale.toString(), categoryID };
      - path: legacy-source/app/src/apps/petstore/src/docroot/CatalogDAOSQL.xml
        line_start: 72
        line_end: 75
        excerpt: |
          select a.catid, name, descn
              from (category a join category_details b on a.catid=b.catid)
              where locale = ?  order by name
    stack_metadata:
      framework: J2EE
      db.object: category_details, product_details, item_details

  - record_key: CAT-RULE-0003
    kind: business-rule
    capability_key: catalog-browsing
    requirement: >
      The system SHALL return categories, products and items in pages of a caller-specified size starting at a caller-specified zero-based offset, and SHALL indicate whether a further page exists.
    plain_text: >
      Long lists are shown a page at a time, and the shopper can tell whether there are more entries after the current page.
    technical_note: >
      DAO positions a scrollable result set at start+1 and reads up to count rows, setting hasNext from whether another row remains. Page exposes next/previous availability and start offsets. CatalogHelper defaults count=2 and start=0.
    interface: false
    confidence: high
    confidence_basis: >
      Implemented in four DAO methods plus the Page model and helper defaults (several places, consistent).
    risk_class: presentational
    basis: >
      Loop condition "(hasNext = resultSet.next()) && (--count > 0)"; previous page start is max(start - size, 0).
    traces:
      - path: legacy-source/app/src/components/catalog/src/com/sun/j2ee/blueprints/catalog/dao/GenericCatalogDAO.java
        line_start: 194
        line_end: 204
        excerpt: |
          if (start >= 0 && resultSet.absolute(start + 1)) {
            boolean hasNext = false;
            List categories = new ArrayList();
            do {
              categories.add(new Category(...));
            } while ((hasNext = resultSet.next()) && (--count > 0));
            return new Page(categories, start, hasNext);
          }
          return Page.EMPTY_PAGE;
      - path: legacy-source/app/src/components/catalog/src/com/sun/j2ee/blueprints/catalog/model/Page.java
        line_start: 75
        line_end: 91
        excerpt: |
          public boolean isNextPageAvailable() {
            return hasNext;
          }
          public boolean isPreviousPageAvailable() {
              return start > 0;
          }
          public int getStartOfNextPage() { return start + objects.size(); }
          public int getStartOfPreviousPage() {
              return Math.max(start-objects.size(), 0);
          }
      - path: legacy-source/app/src/components/catalog/src/com/sun/j2ee/blueprints/catalog/client/CatalogHelper.java
        line_start: 82
        line_end: 83
        excerpt: |
          private int count = 2;
          private int start = 0;
    stack_metadata:
      framework: J2EE
      db.object: JDBC scrollable result set

  - record_key: CAT-RULE-0004
    kind: business-rule
    capability_key: catalog-browsing
    requirement: >
      GIVEN a paged request whose start offset is negative or beyond the last row WHEN the list is requested THEN the system SHALL return an empty page.
    plain_text: >
      Asking for a page that does not exist gives an empty list rather than an error.
    technical_note: >
      Guard "start >= 0 && resultSet.absolute(start + 1)" else Page.EMPTY_PAGE, in each paged DAO method.
    interface: false
    confidence: high
    confidence_basis: >
      Same guard in four DAO methods and a named EMPTY_PAGE constant.
    risk_class: presentational
    basis: >
      Out-of-range offsets fall through to Page.EMPTY_PAGE.
    traces:
      - path: legacy-source/app/src/components/catalog/src/com/sun/j2ee/blueprints/catalog/dao/GenericCatalogDAO.java
        line_start: 248
        line_end: 258
        excerpt: |
          if (start >= 0 && resultSet.absolute(start + 1)) {
            ...
          }
          return Page.EMPTY_PAGE;
    stack_metadata:
      framework: J2EE

  - record_key: CAT-RULE-0005
    kind: business-rule
    capability_key: catalog-browsing
    requirement: >
      The system SHALL list categories ordered by name within the requested locale.
    plain_text: >
      Categories are listed alphabetically by their name.
    technical_note: >
      Only GET_CATEGORIES carries "order by name" in the cloudscape statement set; ordering for products and items was not seen in the SQL read (items query has no order by).
    interface: false
    confidence: medium
    confidence_basis: >
      One clear place (SQL configuration, in another module's docroot); no test.
    risk_class: presentational
    basis: >
      SQL for GET_CATEGORIES ends with order by name.
    traces:
      - path: legacy-source/app/src/apps/petstore/src/docroot/CatalogDAOSQL.xml
        line_start: 71
        line_end: 77
        excerpt: |
          <SQLStatement method="GET_CATEGORIES">
              <SQLFragment parameterNb="1">
                  select a.catid, name, descn
                      from (category a join category_details b on a.catid=b.catid) 
                      where locale = ?  order by name
    stack_metadata:
      framework: J2EE
      db.object: category, category_details

  - record_key: CAT-REQ-0006
    kind: requirement
    capability_key: catalog-browsing
    requirement: >
      The system SHALL let a shopper search items by one or more whitespace-separated keywords, returning items in the requested locale whose product name, category id or item description contains any one of the keywords, paged as for other lists.
    plain_text: >
      Shoppers can type one or more words and see every item whose name, category or description contains at least one of the words.
    technical_note: >
      Query is tokenised with StringTokenizer into a set (duplicates removed); each keyword binds as '%kw%' three times (name, catid, descn) and the clauses are ORed. Statement text is assembled from SQL fragments, repeating the VARIABLE fragment once per extra keyword.
    interface: false
    confidence: high
    confidence_basis: >
      Java tokenising and parameter layout plus SQL fragment configuration agree (two places).
    risk_class: operational
    basis: >
      parameterValues sized 1 + 3*keywords; SQL ORs lower(name)/lower(catid)/lower(b.descn) like ?.
    traces:
      - path: legacy-source/app/src/components/catalog/src/com/sun/j2ee/blueprints/catalog/dao/GenericCatalogDAO.java
        line_start: 343
        line_end: 365
        excerpt: |
          Collection keywordSet = new HashSet();
          StringTokenizer tokenizer = new StringTokenizer(searchQuery);
          while (tokenizer.hasMoreTokens()) {
            keywordSet.add(tokenizer.nextToken());
          }
          ...
          parameterValues[(i * 3) + 1] = "%" + keywords[i] + "%";
      - path: legacy-source/app/src/apps/petstore/src/docroot/CatalogDAOSQL.xml
        line_start: 112
        line_end: 127
        excerpt: |
          where b.locale = ? and ((lower(name) like ? or lower(catid) like ? or lower(b.descn) like ?)
          ...
          or (lower(name) like ? or lower(catid) like ? or lower(b.descn) like ?)
    stack_metadata:
      framework: J2EE
      db.object: item, item_details, product_details, product

  - record_key: CAT-RULE-0007
    kind: business-rule
    capability_key: catalog-browsing
    requirement: >
      GIVEN a search query that is empty or contains only whitespace WHEN a search is made THEN the system SHALL return an empty page without querying the database.
    plain_text: >
      Searching with nothing typed returns no results.
    technical_note: >
      keywordSet.isEmpty() short-circuit to Page.EMPTY_PAGE in searchItems.
    interface: false
    confidence: medium
    confidence_basis: >
      One clear place, no test or comment.
    risk_class: presentational
    basis: Explicit early return.
    traces:
      - path: legacy-source/app/src/components/catalog/src/com/sun/j2ee/blueprints/catalog/dao/GenericCatalogDAO.java
        line_start: 350
        line_end: 352
        excerpt: |
          if (keywordSet.isEmpty()) {
            return Page.EMPTY_PAGE;
          }
    stack_metadata:
      framework: J2EE

  - record_key: CAT-ENT-0008
    kind: entity
    capability_key: catalog-browsing
    requirement: >
      The system SHALL expose an item with its product id, category id, item id, product name, image, description, five free-form attributes, list price and unit cost.
    plain_text: >
      An item for sale has a name, picture, description, up to five descriptive attributes, a list price and a unit cost.
    technical_note: >
      Item model built from a 13-column result row; identifier columns are trimmed of padding (CHAR columns). Price columns read as double.
    interface: false
    confidence: medium
    confidence_basis: >
      Constructor arity and column order read in the DAO; Item.java itself and table DDL not examined in this pass.
    risk_class: financial
    basis: >
      Item built from listprice and unitcost doubles plus attr1..attr5.
    traces:
      - path: legacy-source/app/src/components/catalog/src/com/sun/j2ee/blueprints/catalog/dao/GenericCatalogDAO.java
        line_start: 279
        line_end: 292
        excerpt: |
          return new Item(resultSet.getString(i++).trim(),
                          ...
                          resultSet.getDouble(i++),
                          resultSet.getDouble(i++));
    stack_metadata:
      framework: J2EE
      db.object: item, item_details

  - record_key: CAT-REQ-0009
    kind: requirement
    capability_key: catalog-browsing
    requirement: >
      The system SHALL fail a catalog request with a catalog error when the underlying data access fails, and SHALL fail startup of the catalog service when the data-access implementation or its SQL definitions cannot be loaded.
    plain_text: >
      If the catalog database cannot be read, the request reports a catalog error instead of showing partial data.
    technical_note: >
      SQLException is wrapped as CatalogDAOSysException, then EJBException (EJB path) or CatalogException (fast-lane path). DAO class, database flavour (cloudscape/oracle) and SQL file URL come from JNDI env entries in ejb-jar.xml.
    interface: false
    confidence: medium
    confidence_basis: >
      Consistent wrapping seen in all layers, but no test and error text is not user-facing in this module.
    risk_class: operational
    basis: Exception translation in each layer.
    traces:
      - path: legacy-source/app/src/components/catalog/src/com/sun/j2ee/blueprints/catalog/ejb/CatalogEJB.java
        line_start: 65
        line_end: 73
        excerpt: |
          public void ejbCreate() {
              try {
                  dao = CatalogDAOFactory.getDAO();
              }
              catch (CatalogDAOSysException se) {
                  Debug.println("Exception getting dao " + se);
                  throw new EJBException(se.getMessage());
    stack_metadata:
      framework: J2EE
      ejb.bean: CatalogEJB
      jms.queue: none

suspected_defects:
  - capability_key: catalog-browsing
    record_keys: [CAT-REQ-0006]
    severity: medium
    category: other
    title: Search compares lower-cased columns with a keyword that is not lower-cased
    description: >
      The SQL lower-cases name, category id and description, but the Java code builds the LIKE pattern from the keyword exactly as typed. A keyword containing capitals can therefore never match, so search is effectively case-sensitive on the keyword side. Whether callers lower-case before calling was not seen in this module.
    traces:
      - path: legacy-source/app/src/components/catalog/src/com/sun/j2ee/blueprints/catalog/dao/GenericCatalogDAO.java
        line_start: 361
        line_end: 365
        excerpt: |
          parameterValues[(i * 3) + 1] = "%" + keywords[i] + "%";
      - path: legacy-source/app/src/apps/petstore/src/docroot/CatalogDAOSQL.xml
        line_start: 119
        line_end: 119
        excerpt: |
          where b.locale = ? and ((lower(name) like ? or lower(catid) like ? or lower(b.descn) like ?)
