records:
  - record_key: CATALOG-BROWSING-REQ-0001
    kind: requirement
    capability_key: catalog-browsing
    requirement: The system SHALL return categories, products within a category, and items within a product as pages, each page starting at a caller-supplied zero-based offset and holding at most the caller-supplied count of entries, with a flag telling whether a further page exists.
    confidence: medium
    confidence_basis: Paging loop is read in three near-identical DAO methods (same file, one implementation style); no test, config or document confirms it, so not high.
    risk_class: presentational
    basis: getCategories, getProducts and getItems position the result set at start+1 and read up to count rows, setting hasNext from whether another row follows.
    plain_text: Lists of categories, products and items are shown a page at a time, and the shopper can tell whether there is a next page.
    technical_note: GenericCatalogDAO uses a scrollable result set, absolute(start+1), then a do/while that stops after count rows; Page carries hasNext.
    interface: false
    traces:
      - path: legacy-source/app/src/components/catalog/src/com/sun/j2ee/blueprints/catalog/dao/GenericCatalogDAO.java
        line_start: 194
        line_end: 204
        excerpt: |
          if (start >= 0 && resultSet.absolute(start + 1)) {
            boolean hasNext = false;
            List categories = new ArrayList();
            do {
              categories.add(new Category(resultSet.getString(1).trim(),
                                          resultSet.getString(2),
                                          resultSet.getString(3)));
            } while ((hasNext = resultSet.next()) && (--count > 0));
            return new Page(categories, start, hasNext);
          }
          return Page.EMPTY_PAGE;
    stack_metadata:
      framework: EJB 2.0 / JDBC
      db.object: GET_CATEGORIES, GET_PRODUCTS, GET_ITEMS
