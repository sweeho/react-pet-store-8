    kind: requirement
    capability_key: order-processing-workflow
    requirement: >
      The system SHALL provide a single lookup facility by which application code obtains
      named infrastructure resources (local and remote component homes, message queues and
      topics with their connection factories, data sources, and configured URL, boolean and
      string values) by configured name.
    confidence: high
    confidence_basis: >
      Two implementations (web and ejb tier) expose the identical set of lookups, and both are
      read in full. No tests or docs were available.
    risk_class: operational
    basis: >
      Capability fits no listed key exactly; filed under order-processing-workflow as the closest
      (the JMS hand-offs between modules use these lookups). Infrastructure plumbing.
    plain_text: >
      Every part of the application finds the shared services it needs (message channels,
      databases, settings) through one common lookup by name.
    technical_note: >
      Service Locator pattern over JNDI InitialContext; getLocalHome, getRemoteHome,
      getQueueConnectionFactory, getQueue, getTopicConnectionFactory, getTopic, getDataSource,
      getUrl, getBoolean, getString.
