  - record_key: OPW-REQ-0003
    kind: requirement
    capability_key: order-processing-workflow
    requirement: >
      The EJB-tier lookup service SHALL NOT cache results and SHALL perform a fresh naming lookup on every request; it is instantiated per caller rather than shared.
    confidence: medium
    confidence_basis: >
      Visible in one file; the contrast with the web variant makes it clearly deliberate but no comment states why.
    risk_class: operational
    basis: >
      ejb/ServiceLocator.java has a public constructor, no cache field, and an unused static field me.
    plain_text: >
      On the back-end side, resources are looked up afresh each time and not remembered.
    technical_note: >
