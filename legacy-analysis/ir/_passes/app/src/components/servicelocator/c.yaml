  - record_key: OPW-REQ-0001
    kind: requirement
    capability_key: order-processing-workflow
    requirement: >
      The system SHALL resolve named platform resources (local and remote component homes, message queues and topics with their connection factories, data sources, and URL, boolean and string configuration entries) through a single lookup service instead of each caller performing its own naming lookup.
    confidence: high
    confidence_basis: >
      The same lookup operations are implemented twice (web and ejb variants) with identical signatures; no tests or docs seen, and no callers in this module, so not graded on usage.
    risk_class: operational
    basis: >
      Both locator classes expose getLocalHome, getRemoteHome, getQueueConnectionFactory, getQueue, getTopicConnectionFactory, getTopic, getDataSource, getUrl, getBoolean, getString over a JNDI InitialContext. Filed under order-processing-workflow as the closest capability (JMS hand-offs); it is really shared infrastructure fitting no listed capability.
    plain_text: >
      Every part of the application finds the queues, databases and settings it needs through one shared lookup facility, by name.
    technical_note: >
      Service Locator pattern over javax.naming.InitialContext in web/ServiceLocator.java and ejb/ServiceLocator.java.
