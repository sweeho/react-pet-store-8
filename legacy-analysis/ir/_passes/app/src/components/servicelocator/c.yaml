        line_start: 67
        line_end: 96
        excerpt: |
          private Map cache;
          static { try { me = new ServiceLocator(); } ...
          static public ServiceLocator getInstance() { return me; }
      - path: legacy-source/app/src/components/servicelocator/src/com/sun/j2ee/blueprints/servicelocator/web/ServiceLocator.java
