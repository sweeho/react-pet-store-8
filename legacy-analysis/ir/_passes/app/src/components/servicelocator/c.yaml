  - record_key: OPW-BR-0004
    kind: business-rule
    capability_key: order-processing-workflow
    requirement: >
      GIVEN a lookup fails for any reason (name not found, wrong type, or any other error), WHEN the caller requests the resource, THEN the lookup service SHALL raise a single lookup-failure error wrapping the original cause.
    confidence: high
    confidence_basis: >
      Same wrapping pattern repeated in every method of both classes.
    risk_class: operational
    basis: >
      Every method catches NamingException and Exception and rethrows ServiceLocatorException(cause).
    plain_text: >
      If a needed resource cannot be found, the caller gets one uniform failure that keeps the original reason.
    technical_note: >
      Duplicate catch blocks are redundant. getBoolean on a missing value would throw before unboxing, and is wrapped as well.
    interface: false
    traces:
      - path: legacy-source/app/src/components/servicelocator/src/com/sun/j2ee/blueprints/servicelocator/web/ServiceLocator.java
        line_start: 115
        line_end: 119
