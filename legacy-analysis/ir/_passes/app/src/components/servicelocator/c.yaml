  - record_key: OPW-REQ-0002
    kind: requirement
    capability_key: order-processing-workflow
    requirement: >
      The web-tier lookup service SHALL be a single shared instance and SHALL cache every component home, connection factory, queue, topic and data source after its first successful lookup, returning the cached object on later requests for the same name.
    confidence: medium
    confidence_basis: >
      Clearly enforced in one file (web variant) only; the class comment states the intent too, but nothing else corroborates it.
    risk_class: operational
    basis: >
      Singleton created in a static initialiser; synchronized HashMap checked with containsKey before lookup. URL, boolean and string entries are not cached.
    plain_text: >
      On the web side, a resource once found is remembered and reused, so repeated requests do not search for it again.
    technical_note: >
      web/ServiceLocator.java uses Collections.synchronizedMap(new HashMap()) keyed by JNDI name. One shared map for all resource types, so the same name used for two types returns whatever was cached first (ClassCastException wrapped in ServiceLocatorException).
    interface: false
    traces:
