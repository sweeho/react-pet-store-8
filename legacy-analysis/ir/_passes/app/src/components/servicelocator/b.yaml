  - record_key: CNT-REQ-0001
    kind: requirement
    capability_key: customer-notifications
    requirement: The system SHALL be able to read deployment-configured environment entries as URL, boolean or string values by name, including boolean flags such as the one that controls sending confirmation mail.
    confidence: low
    confidence_basis: Only a javadoc mention of SEND_CONFIRMATION_MAIL; the locator itself does not know which flags exist. Filed under customer-notifications as closest fit; consumers not examined in this module.
    risk_class: operational
    basis: getBoolean javadoc names SEND_CONFIRMATION_MAIL. Values are read via ic.lookup and cast, so a missing or wrong-typed entry yields a locator error.
    plain_text: Settings such as whether to send confirmation emails are read from the deployment configuration.
    technical_note: getBoolean/getString/getUrl in both implementations are uncached lookups of env-entry JNDI names.
    interface: false
