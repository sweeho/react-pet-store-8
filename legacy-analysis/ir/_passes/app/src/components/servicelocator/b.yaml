records:
  - record_key: OPW-REQ-0001
    kind: requirement
    capability_key: order-processing-workflow
    requirement: The system SHALL resolve named infrastructure resources (EJB local homes, EJB remote homes, JMS queue and topic connection factories, queues, topics, data sources) by name through the naming service, and raise a single locator error when any lookup fails.
    confidence: high
    confidence_basis: Same lookup and error-wrapping pattern repeated in every method in two implementations (web and ejb tiers), plus javadoc. Reachability from callers not examined in this module.
    risk_class: operational
    basis: Each getter does ic.lookup(name), casts, and wraps NamingException or any Exception in ServiceLocatorException. No business rule; the module supports JMS hand-offs between modules.
    plain_text: The application finds its shared technical resources, such as message queues and databases, by name, and reports one kind of error if a resource cannot be found.
    technical_note: Service Locator pattern. web/ServiceLocator.java and ejb/ServiceLocator.java; both methods catch NamingException and Exception and rethrow ServiceLocatorException. Remote homes are narrowed with PortableRemoteObject.narrow.
    interface: false
    traces:
      - path: legacy-source/app/src/components/servicelocator/src/com/sun/j2ee/blueprints/servicelocator/ejb/ServiceLocator.java
        line_start: 83
        line_end: 93
        excerpt: |
          public EJBLocalHome getLocalHome(String jndiHomeName) throws ServiceLocatorException {
            EJBLocalHome home = null;
            try {
                home = (EJBLocalHome) ic.lookup(jndiHomeName);
             } catch (NamingException ne) {
                  throw new ServiceLocatorException(ne);
             } catch (Exception e) {
                  throw new ServiceLocatorException(e);
             }
             return home;
          }
      - path: legacy-source/app/src/components/servicelocator/src/com/sun/j2ee/blueprints/servicelocator/web/ServiceLocator.java
        line_start: 175
        line_end: 191
        excerpt: |
          public  Queue getQueue(String queueName) throws ServiceLocatorException {
            Queue queue = null;
            try {
              if (cache.containsKey(queueName)) {
                  queue = (Queue) cache.get(queueName);
              } else {
                  queue =(Queue)ic.lookup(queueName);
                  cache.put(queueName, queue);
              }
            } catch (NamingException ne) {
                  throw new ServiceLocatorException(ne);
            } catch (Exception e) {
                  throw new ServiceLocatorException(e);
            }
    stack_metadata:
      framework: J2EE Service Locator
      session.scope: n/a
      jms.queue: resolved by caller-supplied name
  - record_key: OPW-REQ-0002
    kind: requirement
    capability_key: order-processing-workflow
    requirement: The web-tier locator SHALL be a single shared instance that caches each resolved EJB home, connection factory, queue, topic and data source by name and reuses it on later requests.
    confidence: high
    confidence_basis: Singleton and cache are in code and stated in the class javadoc; two places.
    risk_class: operational
    basis: Static initializer creates one instance; cache is a synchronized map consulted before each lookup.
    plain_text: On the web side, once a shared resource has been found it is remembered and reused rather than looked up again.
    technical_note: web/ServiceLocator.java uses Collections.synchronizedMap(new HashMap()). containsKey-then-put is not atomic, so concurrent first lookups may both hit the naming service (benign). URL, boolean and string lookups are not cached.
    interface: false
    traces:
      - path: legacy-source/app/src/components/servicelocator/src/com/sun/j2ee/blueprints/servicelocator/web/ServiceLocator.java
        line_start: 59
        line_end: 96
        excerpt: |
          * This implementation uses the "singleton" strategy and also the "caching"
          * strategy.
          * This implementation is intended to be used on the web tier and
          * not on the ejb tier.
          ...
              cache = Collections.synchronizedMap(new HashMap());
          ...
          static public ServiceLocator getInstance() {
            return me;
          }
    stack_metadata:
      framework: J2EE Service Locator
      session.scope: application (static singleton)
