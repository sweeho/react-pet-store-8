suspected_defects:
  - capability_key: order-processing-workflow
    record_keys: [OPW-REQ-0002]
    severity: medium
    category: error-swallowed
    title: Web locator initialization failure is only printed
    description: >
      If the singleton cannot be created, the static initializer prints the error to stderr and leaves the instance null; getInstance() then returns null and callers fail later with a null pointer rather than a locator error.
    traces:
      - path: legacy-source/app/src/components/servicelocator/src/com/sun/j2ee/blueprints/servicelocator/web/ServiceLocator.java
        line_start: 74
        line_end: 81
        excerpt: |
          static {
            try {
              me = new ServiceLocator();
            } catch(ServiceLocatorException se) {
              System.err.println(se);
              se.printStackTrace(System.err);
            }
          }
