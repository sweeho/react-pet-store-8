    requirement: The EJB-tier locator SHALL perform a fresh naming lookup on every call, with no caching and no shared instance.
    confidence: medium
    confidence_basis: One clear place (ejb/ServiceLocator.java); absence of cache is read from code, not documented.
    risk_class: operational
    basis: Public constructor, no cache field; every getter calls ic.lookup directly.
    plain_text: Inside the business tier, shared resources are looked up each time they are needed instead of being remembered.
