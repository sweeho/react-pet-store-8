records:
  - record_key: CHK-ENT-0001
    kind: entity
    capability_key: checkout-payment
    requirement: >
      The system SHALL represent a payment card with exactly three attributes: card number, card type and expiry date, all held as text.
    confidence: high
    confidence_basis: >
      Declared in the persistence descriptor (three persistent fields), the bean class accessors and the transfer object, plus the XML DTD. Four consistent places.
    risk_class: regulated
    basis: >
      Entity bean declares cardNumber, cardType, expiryDate as persistent fields; the DTD requires all three elements in order.
    plain_text: >
      A stored payment card consists of a card number, a card type and an expiry date.
    technical_note: >
      CMP 2.x entity CreditCardEJB; value object CreditCard mirrors it. No validation of format, Luhn check or masking exists in this module; the card number is stored in clear text.
    interface: false
    traces:
      - path: legacy-source/app/src/components/creditcard/src/ejb-jar.xml
        line_start: 58
        line_end: 71
        excerpt: |
          <cmp-field>
            <description>no description</description>
            <field-name>expiryDate</field-name>
          </cmp-field>
          <cmp-field>
            <description>no description</description>
            <field-name>cardType</field-name>
          </cmp-field>
          <cmp-field>
            <description>no description</description>
            <field-name>cardNumber</field-name>
          </cmp-field>
      - path: legacy-source/app/src/components/creditcard/src/com/sun/j2ee/blueprints/creditcard/ejb/CreditCardEJB.java
        line_start: 50
        line_end: 57
        excerpt: |
