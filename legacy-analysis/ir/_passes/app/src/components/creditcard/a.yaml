  - record_key: CHK-INT-0001
    kind: integration
    capability_key: checkout-payment
    requirement: >
      The system SHALL exchange card details with other components as an XML document with a CreditCard root containing CardNumber, CardType and ExpiryDate in that order, and SHALL reject a document whose root is not CreditCard.
    confidence: high
    confidence_basis: >
      DTD and the Java serialisation code agree on element names and order; the rejection is explicit code.
    risk_class: regulated
    basis: >
      toDOM writes the three elements; fromDOM requires the CreditCard root and reads children in order, throwing otherwise.
    plain_text: >
      Card details are passed between parts of the system in a fixed document format with number, type and expiry.
    technical_note: >
      CreditCard.toDOM/fromDOM with DTD CreditCard 1.1; used inside order XML documents.
    interface: true
    traces:
      - path: legacy-source/app/src/components/creditcard/src/com/sun/j2ee/blueprints/creditcard/ejb/CreditCard.java
        line_start: 108
        line_end: 130
        excerpt: |
          public Node toDOM(Document document) {
            Element root = document.createElement(XML_CREDITCARD);
            XMLDocumentUtils.appendChild(document, root, XML_CARD_NUMBER, cardNumber);
            XMLDocumentUtils.appendChild(document, root, XML_CARD_TYPE, cardType);
            XMLDocumentUtils.appendChild(document, root, XML_EXPIRYDATE, expiryDate);
            return root;
          }
          ...
          throw new XMLDocumentException(XML_CREDITCARD + " element expected.");
      - path: legacy-source/app/src/components/creditcard/src/com/sun/j2ee/blueprints/creditcard/rsrc/schemas/CreditCard.dtd
        line_start: 38
        line_end: 41
        excerpt: |
          <!ELEMENT CreditCard (CardNumber, CardType, ExpiryDate)>
          <!ELEMENT CardNumber (#PCDATA)>
          <!ELEMENT CardType (#PCDATA)>
          <!ELEMENT ExpiryDate (#PCDATA)>
    stack_metadata:
      framework: EJB 2.x
