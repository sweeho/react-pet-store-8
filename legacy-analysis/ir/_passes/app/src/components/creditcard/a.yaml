  - record_key: CHK-BR-0001
    kind: business-rule
    capability_key: checkout-payment
    requirement: >
      GIVEN a stored card whose expiry date contains a "/" WHEN the expiry month or year is requested THEN the system SHALL return the text before the "/" as the month and the text after it as the year.
    confidence: medium
    confidence_basis: >
      One clear implementation in the bean class; the descriptor only exposes the methods. No test seen.
    risk_class: operational
    basis: >
      Expiry date is held as "MM/YYYY"-style text and split on the first slash. The text is not validated as numeric.
    plain_text: >
      A card's expiry is stored as month/year text and can be read back as a separate month and year.
    technical_note: >
      CreditCardEJB.getExpiryMonth / getExpiryYear, exposed on the local interface.
    interface: false
    traces:
      - path: legacy-source/app/src/components/creditcard/src/com/sun/j2ee/blueprints/creditcard/ejb/CreditCardEJB.java
        line_start: 88
        line_end: 107
        excerpt: |
          public String getExpiryMonth() {
            String dateString = getExpiryDate();
            if (dateString != null) {
              // get the slash and return the text before it
              int slashStart = dateString.indexOf("/");
              if (slashStart != -1) return dateString.substring(0,slashStart);
            }
            return "01";
          }
    stack_metadata:
      framework: EJB 2.x CMP
      ejb.bean: CreditCardEJB
  - record_key: CHK-BR-0002
    kind: business-rule
    capability_key: checkout-payment
    requirement: >
      GIVEN a card whose expiry date is absent or has no "/" WHEN the expiry month is requested THEN the system SHALL return "01", and WHEN the expiry year is requested THEN the system SHALL return "2010".
    confidence: low
    confidence_basis: >
      Bare literal defaults with no comment, configuration or test; intent unknown.
    risk_class: financial
    basis: >
      Hard-coded fallback values. No authoritative source found for them.
    plain_text: >
      If a card has no readable expiry, it is treated as expiring January 2010.
    technical_note: >
      Fallback literals in getExpiryMonth/getExpiryYear.
    interface: false
    traces:
      - path: legacy-source/app/src/components/creditcard/src/com/sun/j2ee/blueprints/creditcard/ejb/CreditCardEJB.java
        line_start: 95
        line_end: 106
        excerpt: |
