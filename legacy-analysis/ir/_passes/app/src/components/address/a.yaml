  - record_key: CUST-ENT-0001
    kind: entity
    capability_key: customer-accounts
    requirement: >
      The system SHALL represent a postal address as street line 1, street line 2, city, state, zip code and country.
    confidence: high
    confidence_basis: >
      Fields are declared in the bean's abstract accessors and again as container-managed fields in the deployment descriptor, and the DTD lists the same elements.
    risk_class: operational
    basis: Six persistent address fields are declared in code and descriptor.
    plain_text: >
      An address consists of two street lines, a city, a state, a zip code and a country.
    technical_note: >
      AddressEJB is a CMP 2.x entity bean (abstract schema Address) with six cmp-fields; Address.dtd allows an optional second street line and optional country.
    interface: false
    traces:
      - path: legacy-source/app/src/components/address/src/com/sun/j2ee/blueprints/address/ejb/AddressEJB.java
        line_start: 53
        line_end: 69
        excerpt: |
          public abstract String getStreetName1();
          public abstract void setStreetName1(String streetName1);
          public abstract String getStreetName2();
          public abstract void setStreetName2(String streetName2);
          public abstract String getCity();
          public abstract void setCity(String city);
          public abstract String getState();
          public abstract void setState(String state);
          public abstract String getZipCode();
          public abstract void setZipCode(String zipCode);
          public abstract String getCountry();
          public abstract void setCountry(String country);
      - path: legacy-source/app/src/components/address/src/com/sun/j2ee/blueprints/address/rsrc/schemas/Address.dtd
        line_start: 38
        line_end: 43
