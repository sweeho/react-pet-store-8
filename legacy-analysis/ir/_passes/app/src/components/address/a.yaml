    requirement: >
      The system SHALL store address fields exactly as supplied, with no validation, normalisation or required-field check at the address component level.
    confidence: medium
    confidence_basis: >
      One clear place (create and copy methods assign values directly); absence of validation is inferred from reading the whole component, and callers were not examined.
    risk_class: operational
    basis: ejbCreate variants assign arguments straight to fields; no checks exist.
    plain_text: >
      The address record keeps whatever is entered; any checking of required parts is done elsewhere, if at all.
    technical_note: >
      ejbCreate(...) and ejbCreate(Address) call setters only; ejbCreate() creates an empty address. The DTD marks street 1, city, state and zip as required but no code enforces this here.
