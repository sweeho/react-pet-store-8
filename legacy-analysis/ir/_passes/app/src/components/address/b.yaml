    kind: entity
    capability_key: customer-accounts
    requirement: >
      The system SHALL represent a postal address as six text fields: street line 1, street line 2, city, state, zip code and country, persisted as a container-managed entity.
    confidence: high
    confidence_basis: >
      The six fields appear in the entity class, the value object and the deployment descriptor's cmp-field list. No DDL for the table was in this module, so column size and nullability are not visible.
    risk_class: operational
    basis: Six CMP fields declared in the descriptor and accessed in the bean; same six in the value object.
    plain_text: >
      An address is made of two street lines, a city, a state, a zip code and a country.
    technical_note: >
      AddressEJB is an abstract CMP 2.x entity with getters and setters for the six fields; ejb-jar.xml lists them as cmp-field. No length or not-null validation is enforced in this module.
    interface: false
