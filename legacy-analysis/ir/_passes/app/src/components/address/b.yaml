  - record_key: CUSTOMER-ACCOUNTS-REQ-0004
    kind: integration
    capability_key: customer-accounts
    requirement: >
      The system SHALL exchange an address as an XML Address element containing, in order, one or two street name elements, city, state, zip code and country; the second street element SHALL be omitted when street line 2 is null or empty.
    confidence: high
    confidence_basis: >
      Serialisation, parsing and the DTD all describe the same element order and the optional second street.
    risk_class: operational
    basis: toDOM, fromDOM and Address.dtd.
    plain_text: >
      When an address is passed to another system as a document, it lists street, optional second street, city, state, zip code and country in that order.
    technical_note: >
      Address.toDOM / fromDOM with DTD public id "-//Sun Microsystems, Inc. - J2EE Blueprints Group//DTD Address 1.1//EN". Both street lines use the same tag StreetName; position distinguishes them.
    interface: true
    traces:
      - path: legacy-source/app/src/components/address/src/com/sun/j2ee/blueprints/address/ejb/Address.java
        line_start: 144
        line_end: 156
        excerpt: |
          public Node toDOM(Document document) {
            Element root = document.createElement(XML_ADDRESS);
            XMLDocumentUtils.appendChild(document, root, XML_STREET_NAME, streetName1);
            if (streetName2 != null && !streetName2.equals("")) {
      - path: legacy-source/app/src/components/address/src/com/sun/j2ee/blueprints/address/rsrc/schemas/Address.dtd
        line_start: 38
        line_end: 43
        excerpt: |
          <!ELEMENT Address (StreetName, StreetName?, City, State, ZipCode, Country?)>
    stack_metadata:
      framework: XML DOM / DTD
  - record_key: CUSTOMER-ACCOUNTS-REQ-0005
    kind: business-rule
    capability_key: customer-accounts
    requirement: >
      GIVEN an incoming Address XML document, WHEN the root element is not named Address, or a required child (street, city, state, zip code, country) is missing or out of order, THEN the system SHALL reject it with an XML document error.
    confidence: medium
    confidence_basis: >
      Root-name check is explicit; required-child behaviour depends on the meaning of the boolean argument of XMLDocumentUtils, which is outside this module and was inferred (false = not optional), so not graded higher.
    risk_class: operational
    basis: fromDOM throws XMLDocumentException when root is not Address.
    plain_text: >
      An address document that is not shaped as expected is refused.
    technical_note: >
      fromDOM throws "Address element expected." on wrong root; child lookups use getFirstChild/getNextSibling with flag false for mandatory and true for optional StreetName.
    interface: true
    traces:
      - path: legacy-source/app/src/components/address/src/com/sun/j2ee/blueprints/address/ejb/Address.java
        line_start: 158
        line_end: 180
        excerpt: |
          child = XMLDocumentUtils.getNextSibling(child, XML_COUNTRY, false);
          address.country = XMLDocumentUtils.getContentAsString(child, false);
          return address;
          }
          throw new XMLDocumentException(XML_ADDRESS + " element expected.");
    stack_metadata:
      framework: XML DOM
suspected_defects:
  - capability_key: customer-accounts
    record_keys: [CUSTOMER-ACCOUNTS-REQ-0004, CUSTOMER-ACCOUNTS-REQ-0005]
    severity: low
    category: other
    title: Country is optional in the DTD but written always and read as mandatory
    description: >
      The DTD declares Country optional, toDOM always writes a Country element, and fromDOM looks Country up as a required sibling (flag false), so a document valid under the DTD without Country appears to be refused. Depends on the semantics of the utility flag, not visible here.
    traces:
      - path: legacy-source/app/src/components/address/src/com/sun/j2ee/blueprints/address/rsrc/schemas/Address.dtd
        line_start: 38
        line_end: 38
      - path: legacy-source/app/src/components/address/src/com/sun/j2ee/blueprints/address/ejb/Address.java
        line_start: 175
        line_end: 176
