  - record_key: SUPPLIER-REQ-0004
    kind: requirement
    capability_key: supplier-fulfilment
    requirement: >
      The system SHALL run all line item create, read and shipped-quantity update operations inside a transaction, and SHALL allow any caller to invoke them without a role check.
    confidence: high
    confidence_basis: Two declarations in the descriptor (transaction attribute and unchecked method permission).
    risk_class: operational
    basis: method-permission unchecked for all methods; trans-attribute Required on listed methods.
    plain_text: >
      Line item changes happen all-or-nothing, and no particular user role is required to use them.
    technical_note: >
      Security identity is use-caller-identity; permissions are <unchecked/> on method *.
    interface: false
    traces:
      - path: legacy-source/app/src/components/lineitem/src/ejb-jar.xml
        line_start: 85
        line_end: 92
        excerpt: |
          <method-permission>
            <unchecked />
            <method>
              <ejb-name>LineItemEJB</ejb-name>
              <method-name>*</method-name>
    stack_metadata:
      ejb.transaction: Required
      framework: EJB 2.0 CMP
suspected_defects:
  - capability_key: supplier-fulfilment
    record_keys: [SUPPLIER-REQ-0003]
    severity: medium
    category: data-corruption
    title: Snapshot drops quantity shipped
    description: >
      getData omits quantityShipped, so a line item copied from a snapshot loses shipped state unless it is supplied separately. Whether callers rely on this is not visible in this module.
    traces:
      - path: legacy-source/app/src/components/lineitem/src/com/sun/j2ee/blueprints/lineitem/ejb/LineItemEJB.java
        line_start: 171
        line_end: 180
  - capability_key: supplier-fulfilment
    record_keys: [SUPPLIER-ENTITY-0001]
    severity: low
    category: other
    title: Unit price stored as float
    description: >
      Money is held as a binary float, which can introduce rounding errors in totals.
    traces:
      - path: legacy-source/app/src/components/lineitem/src/com/sun/j2ee/blueprints/lineitem/ejb/LineItemEJB.java
        line_start: 118
        line_end: 124
findings:
  - kind: ambiguity
    path: legacy-source/app/src/components/lineitem/src/com/sun/j2ee/blueprints/lineitem/ejb/LineItemEJB.java
    description: >
      Which capability owns line items (shopping-cart, order-processing-workflow or supplier-fulfilment) is not determinable from this module; filed under supplier-fulfilment because of the quantity-shipped field. No documents under legacy-analysis/sources were available.
