records:
  - record_key: CUST-ENT-0001
    kind: entity
    capability_key: customer-accounts
    requirement: >
      The system SHALL hold contact information as a given name, family name, telephone number, e-mail address and exactly one associated postal address.
    confidence: high
    confidence_basis: >
      Stated in the bean descriptor (CMP fields, relationship) and in the bean class accessors and the XML schema; no database constraints (NOT NULL, length) were visible in this module, so field optionality is unknown.
    risk_class: operational
    basis: >
      Four persistent fields plus a one-to-one relationship to the address entity are declared; the data-transfer schema lists the same five elements.
    plain_text: >
      A customer's contact details consist of a first name, a last name, a phone number, an e-mail address and one postal address.
    technical_note: >
      ContactInfoEJB is a CMP 2.x entity bean with cmp-fields givenName, familyName, telephone, email and a cmr-field address (multiplicity One). Transfer object ContactInfo exposes the phone as getPhone() while the persistent field is telephone. ContactInfo.dtd defines FamilyName, GivenName, Address, Email, Phone.
    interface: false
