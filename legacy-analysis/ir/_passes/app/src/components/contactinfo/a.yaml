  - record_key: CUST-RULE-0003
    kind: business-rule
    capability_key: customer-accounts
    requirement: >
      The system SHALL create a new, empty address for a contact created without address data, and SHALL create the address from the supplied address data when a contact is created from a contact-information transfer object.
    confidence: high
    confidence_basis: >
      Enforced by two creation paths in the bean (default and transfer-object), each visible in code; the third creation path takes an existing address.
    risk_class: operational
    basis: >
      ejbPostCreate variants create the address via the address home.
    plain_text: >
      Every contact always has an address: a blank one is created if none is given, otherwise the address given with the contact details is stored.
    technical_note: >
      ejbPostCreate() calls AddressLocalHome.create() and setAddress; ejbPostCreate(ContactInfo) calls create(contactInfo.getAddress()). ejbPostCreate(givenName,...,AddressLocal) links a pre-existing address. A lookup failure becomes CreateException.
