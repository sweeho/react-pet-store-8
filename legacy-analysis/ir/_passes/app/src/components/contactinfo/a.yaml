  - record_key: CUST-REQ-0005
    kind: requirement
    capability_key: customer-accounts
    requirement: >
      The system SHALL return the full contact information, including the nested address, as a single data object on request.
    confidence: medium
    confidence_basis: >
      One clear place (getData); no test or second source.
    risk_class: operational
    basis: >
      getData copies the four fields and the address data into a transfer object.
    plain_text: >
      Other parts of the system can fetch a customer's complete contact details, including address, in one request.
    technical_note: >
      ContactInfoEJB.getData() builds ContactInfo; getAddress().getData() would throw if the address is null. Methods are exposed on the local interface only, with unchecked method permissions and Required transactions.
    interface: true
    traces:
      - path: legacy-source/app/src/components/contactinfo/src/com/sun/j2ee/blueprints/contactinfo/ejb/ContactInfoEJB.java
        line_start: 129
        line_end: 138
        excerpt: |
          public ContactInfo getData() {
            ContactInfo contactInfo = new ContactInfo();
            contactInfo.setGivenName(getGivenName());
            contactInfo.setFamilyName(getFamilyName());
            contactInfo.setPhone(getTelephone());
            contactInfo.setEmail(getEmail());
            contactInfo.setAddress(getAddress().getData());
            return contactInfo;
          }
