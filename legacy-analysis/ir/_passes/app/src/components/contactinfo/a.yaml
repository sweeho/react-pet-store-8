  - record_key: CUST-REQ-0004
    kind: requirement
    capability_key: customer-accounts
    requirement: >
      The system SHALL accept contact data without validating any field (no required, format or length checks) and SHALL fail contact creation with an error when the address service cannot be located.
    confidence: low
    confidence_basis: >
      Inferred from absence: no validation appears in this module, but validation may occur in callers (forms, other components) not examined here.
    risk_class: operational
    basis: >
      Create methods copy values straight into persistent fields; only the address lookup failure raises CreateException.
    plain_text: >
      This part of the system stores whatever contact details it is given; any checking of names, phone numbers or e-mail addresses must happen elsewhere.
    technical_note: >
      ejbCreate variants only call setters. Failure message: "ContactInfoEJB error: ServiceLocator exception looking up address".
