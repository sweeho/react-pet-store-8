  - record_key: CUST-RULE-0002
    kind: business-rule
    capability_key: customer-accounts
    requirement: >
      The system SHALL remove a contact's address together with the contact when the contact is deleted.
    confidence: medium
    confidence_basis: >
      One declarative place (cascade-delete in the relationship); ejbRemove is empty so no programmatic check corroborates it. The cascade is declared on the Address role of a relation whose both sides are multiplicity One.
    risk_class: operational
    basis: >
      The relationship declares cascade-delete.
    plain_text: >
      When a customer's contact details are deleted, the address attached to them is deleted as well.
    technical_note: >
      ejb-jar.xml ejb-relation with cascade-delete on the AddressEJB role. ContactInfoEJB.ejbRemove() is empty. Which side's removal triggers the cascade depends on the container's reading of the role placement; to be confirmed.
