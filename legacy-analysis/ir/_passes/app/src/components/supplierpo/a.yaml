records:
  - record_key: SUPPLIER-FULFILMENT-ENTITY-0001
    kind: entity
    capability_key: supplier-fulfilment
    requirement: >
      The system SHALL keep a supplier purchase order record holding a purchase order id (primary key), a purchase order date and a purchase order status, with a one-to-one shipping contact and a collection of line items.
    plain_text: >
      A supplier purchase order has an id, a date, a status, a shipping contact and one or more ordered items.
    technical_note: >
      Container-managed entity bean SupplierOrderEJB with cmp-fields poId, poDate (epoch long), poStatus and container-managed relations contactInfo (1:1) and lineItems (1:N), both cascade-delete.
    confidence: high
    confidence_basis: >
      Declared in ejb-jar.xml and mirrored by the abstract accessors in the bean class; two places agree. Relation cascade details were read only partly.
    risk_class: operational
    basis: ejb-jar cmp-field and relationship declarations plus abstract accessors.
    interface: false
    traces:
      - path: legacy-source/app/src/components/supplierpo/src/ejb-jar.xml
        line_start: 59
        line_end: 68
        excerpt: |
          <abstract-schema-name>SupplierOrder</abstract-schema-name>
          <cmp-field>
            <field-name>poId</field-name>
          </cmp-field>
          <cmp-field>
            <field-name>poDate</field-name>
          </cmp-field>
          <cmp-field>
            <field-name>poStatus</field-name>
          </cmp-field>
      - path: legacy-source/app/src/components/supplierpo/src/com/sun/j2ee/blueprints/supplierpo/ejb/SupplierOrderEJB.java
        line_start: 119
        line_end: 137
        excerpt: |
          public abstract ContactInfoLocal getContactInfo();
          public abstract void setContactInfo(ContactInfoLocal addr);
          public abstract Collection getLineItems();
          public abstract void setLineItems(Collection litems);
    stack_metadata:
      framework: EJB 2.0 CMP
      ejb.bean: SupplierOrderEJB
      ejb.transaction: Required
  - record_key: SUPPLIER-FULFILMENT-BR-0001
    kind: business-rule
    capability_key: supplier-fulfilment
    requirement: >
      GIVEN a supplier purchase order is created, WHEN it is persisted, THEN the system SHALL copy the order id and order date from the supplied order and set its status to PENDING.
    plain_text: >
      A new supplier purchase order always starts as "pending", with the id and date it was sent with.
    technical_note: >
      SupplierOrderEJB.ejbCreate sets poId, poDate (getTime()) and poStatus = OrderStatusNames.PENDING. Any status passed in is ignored.
    confidence: high
    confidence_basis: >
      Explicit assignment in ejbCreate plus the status constant and the class comment describing the lifecycle.
    risk_class: operational
    basis: ejbCreate body.
    interface: false
    traces:
      - path: legacy-source/app/src/components/supplierpo/src/com/sun/j2ee/blueprints/supplierpo/ejb/SupplierOrderEJB.java
        line_start: 151
        line_end: 156
        excerpt: |
          public String ejbCreate(SupplierOrder supplierOrder) throws CreateException {
            setPoId(supplierOrder.getOrderId());
            setPoDate(supplierOrder.getOrderDate().getTime());
            setPoStatus(OrderStatusNames.PENDING);
            return null;
          }
    stack_metadata:
      ejb.bean: SupplierOrderEJB
      ejb.transaction: Required
  - record_key: SUPPLIER-FULFILMENT-BR-0002
    kind: business-rule
    capability_key: supplier-fulfilment
    requirement: >
      WHEN a supplier purchase order is created, the system SHALL create a shipping contact from the order's shipping information and one stored line item per line item of the order, each with quantity shipped initialised to 0, and SHALL fail the creation if a required lookup fails.
    plain_text: >
      When a purchase order is saved, its shipping contact and every ordered item are saved with it, and no item starts as shipped.
    technical_note: >
      ejbPostCreate looks up ContactInfo and LineItem home interfaces via ServiceLocator; lineItemref.create(li, 0) (second arg assumed to be quantity shipped, not verified in this module). ServiceLocatorException becomes CreateException. A null line item collection would raise NullPointerException (not handled).
    confidence: medium
    confidence_basis: >
      One clear place. The meaning of the literal 0 argument lives in the LineItem component outside this shard, so it is inferred from the relation fields.
    risk_class: operational
    basis: ejbPostCreate body.
    interface: false
    traces:
      - path: legacy-source/app/src/components/supplierpo/src/com/sun/j2ee/blueprints/supplierpo/ejb/SupplierOrderEJB.java
        line_start: 162
        line_end: 184
        excerpt: |
          public void ejbPostCreate(SupplierOrder supplierOrder)
                                                      throws CreateException {
          try {
              ServiceLocator serviceLocator = new ServiceLocator();
              ContactInfoLocalHome cinforef = (ContactInfoLocalHome)
                  serviceLocator.getLocalHome(JNDINames.CINFO_EJB);
              ContactInfoLocal cinfoloc = (ContactInfoLocal)
                              cinforef.create(supplierOrder.getShippingInfo());
              setContactInfo(cinfoloc);
              LineItemLocalHome lineItemref = (LineItemLocalHome)
                  serviceLocator.getLocalHome(JNDINames.LI_EJB);
              Collection litems = supplierOrder.getLineItems();
              Iterator it = litems.iterator();
              while((it != null) && (it.hasNext())) {
                LineItem li = (LineItem) it.next();
                LineItemLocal lineItemloc = (LineItemLocal) lineItemref.create(li, 0);
                addLineItem(lineItemloc);
              }
            } catch(ServiceLocatorException ne) {
              throw new CreateException("ServiceLocator Ex while persisting PO CMR :" +
                                        ne.getMessage());
            }
          }
    stack_metadata:
      ejb.bean: SupplierOrderEJB
  - record_key: SUPPLIER-FULFILMENT-WF-0001
    kind: workflow
    capability_key: supplier-fulfilment
    requirement: >
      The system SHALL recognise the purchase order statuses PENDING, APPROVED, DENIED and COMPLETED, with the lifecycle PENDING to APPROVED to COMPLETED, or PENDING to DENIED.
    plain_text: >
      A supplier purchase order is pending, then either approved and later completed, or denied.
    technical_note: >
      Constants in OrderStatusNames; the transitions are documented in a comment only. setPoStatus is public on the local interface and does not validate the transition, so enforcement (if any) lives in callers outside this module.
    confidence: medium
    confidence_basis: >
      Constants and a comment describe the lifecycle; nothing in this module enforces the transitions, so the sequence rule is stated intent only.
    risk_class: operational
    basis: OrderStatusNames constants and comment.
    interface: false
    traces:
      - path: legacy-source/app/src/components/supplierpo/src/com/sun/j2ee/blueprints/supplierpo/ejb/OrderStatusNames.java
        line_start: 41
        line_end: 60
        excerpt: |
          /**
           * This class is the central location to store the names of the
           * status that an order can be in.
           * The states an order goes through are:
           * pending->approved->completed   or
           * pending->denied
           */
          public class OrderStatusNames {
              public static final String PENDING = "PENDING";
              public  static final String APPROVED = "APPROVED";
              public  static final String DENIED = "DENIED";
              public  static final String COMPLETED = "COMPLETED";
    stack_metadata:
      ejb.bean: SupplierOrderEJB
