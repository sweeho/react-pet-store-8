  - record_key: SUPPLIER-FULFILMENT-INT-0001
    kind: integration
    capability_key: supplier-fulfilment
    requirement: >
      The system SHALL exchange a supplier purchase order as an XML document containing order id, order date (yyyy-MM-dd), shipping contact information and one or more line items, validated against the SupplierOrder DTD on read.
    plain_text: >
      Purchase orders are sent to and received from the supplier as a standard XML document with an id, a date, a shipping contact and at least one item.
    technical_note: >
      SupplierOrder.toXML/fromXML via XMLDocumentUtils; DTD SupplierOrder 1.1 requires (OrderId, OrderDate, ShippingInfo, LineItem+); VALIDATING = true. Date written with SimpleDateFormat yyyy-MM-dd, so time of day is lost on the wire.
    confidence: high
    confidence_basis: >
      DTD and Java serialisation code agree on the structure. The consuming/producing counterpart module is outside this shard.
    risk_class: operational
    basis: DTD element declaration and toDOM/fromDOM.
    interface: true
    traces:
      - path: legacy-source/app/src/components/supplierpo/src/com/sun/j2ee/blueprints/supplierpo/rsrc/schemas/SupplierOrder.dtd
        line_start: 38
        line_end: 44
        excerpt: |
          <!ELEMENT SupplierOrder (OrderId, OrderDate, ShippingInfo, LineItem+)>
          <!ELEMENT OrderId (#PCDATA)>
          <!ELEMENT OrderDate (#PCDATA)>
          <!ELEMENT ShippingInfo (ContactInfo)>
      - path: legacy-source/app/src/components/supplierpo/src/com/sun/j2ee/blueprints/supplierpo/ejb/SupplierOrder.java
        line_start: 189
        line_end: 201
        excerpt: |
          public Node toDOM(Document document) {
            Element root = document.createElement(XML_SUPPLIERORDER);
            XMLDocumentUtils.appendChild(document, root, XML_ORDERID, orderId);
            XMLDocumentUtils.appendChild(document, root, XML_ORDERDATE,
                                         dateFormat.format(orderDate));
    stack_metadata:
      framework: DOM/DTD XML documents
  - record_key: SUPPLIER-FULFILMENT-BR-0003
    kind: business-rule
    capability_key: supplier-fulfilment
    requirement: >
      GIVEN an incoming supplier order document whose order date cannot be read, WHEN it is parsed, THEN the system SHALL use the current date as the order date and continue.
    plain_text: >
      If a received purchase order has an unreadable date, today's date is used instead.
    technical_note: >
      fromDOM catches any Exception while parsing OrderDate, prints a message to stderr and sets new Date(). Marked "FIX ME!" in the source.
    confidence: medium
    confidence_basis: >
      One clear place; the author's FIX ME comment suggests it was not intended as a permanent rule.
    risk_class: operational
    basis: fromDOM catch block.
    interface: true
    traces:
      - path: legacy-source/app/src/components/supplierpo/src/com/sun/j2ee/blueprints/supplierpo/ejb/SupplierOrder.java
        line_start: 217
        line_end: 223
        excerpt: |
          try {
            child = XMLDocumentUtils.getNextSibling(child, XML_ORDERDATE, false);
            supplierOrder.setOrderDate(supplierOrder.dateFormat.parse(XMLDocumentUtils.getContentAsString(child, false)));
          } catch (Exception exception) {
            supplierOrder.setOrderDate(new Date()); // FIX ME!
            System.err.println(XML_ORDERDATE + ": " + exception.getMessage() + " reset to current date.");
          }
    stack_metadata:
      framework: DOM XML
suspected_defects:
  - capability_key: supplier-fulfilment
    record_keys: [SUPPLIER-FULFILMENT-BR-0003]
    severity: medium
    category: error-swallowed
    title: Unreadable order date silently replaced by today's date
    description: >
      Any exception while reading OrderDate (including a missing element) is swallowed, logged to stderr only, and the order date becomes the current date, so a wrong date is stored without the sender being told. The source marks it FIX ME.
    traces:
      - path: legacy-source/app/src/components/supplierpo/src/com/sun/j2ee/blueprints/supplierpo/ejb/SupplierOrder.java
        line_start: 220
        line_end: 223
  - capability_key: supplier-fulfilment
    record_keys: [SUPPLIER-FULFILMENT-ENTITY-0001]
    severity: medium
    category: data-corruption
    title: getData does not copy shipping information
    description: >
      SupplierOrderEJB.getData sets shippingInfo to supplierOrder.getShippingInfo() on the brand-new object, which is null, instead of reading the stored contact. It also never copies the status. Any caller using getData therefore receives an order with no shipping contact, and toXML on it would fail with a null pointer.
    traces:
      - path: legacy-source/app/src/components/supplierpo/src/com/sun/j2ee/blueprints/supplierpo/ejb/SupplierOrderEJB.java
        line_start: 205
        line_end: 216
  - capability_key: supplier-fulfilment
    record_keys: [SUPPLIER-FULFILMENT-INT-0001]
    severity: low
    category: other
    title: Full order XML is printed to standard error
    description: >
      TRACE = true and fromXML(String) print the whole document (including customer contact details) to stderr on every conversion.
    traces:
