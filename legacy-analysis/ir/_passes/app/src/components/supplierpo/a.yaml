        line_start: 145
        line_end: 147
findings:
  - kind: ambiguity
    path: legacy-source/app/src/components/supplierpo/src/ejb-jar.xml
    description: >
      Reachability and callers of this component (who sets APPROVED/DENIED/COMPLETED and who calls findOrdersByStatus) are not visible within this module; legacy-analysis/sources documents were absent from the tree and legacy-source was missing from the branch head (read from commit 0443a09). Dependent modules must settle where the transitions are enforced.
