records:
  - record_key: SUPF-ENT-0001
    kind: entity
    capability_key: supplier-fulfilment
    requirement: >
      The system SHALL persist each supplier purchase order with a purchase order id (primary key), an order date and a status.
    confidence: high
    confidence_basis: >
      Declared in the persistence descriptor (CMP fields, primkey) and in the bean's abstract accessors; two places agree.
    risk_class: operational
    basis: Container-managed fields poId, poDate, poStatus with poId as primary key.
    plain_text: >
      A purchase order sent to a supplier is stored with its number, its date and its current status.
    technical_note: >
      SupplierOrderEJB is a CMP 2.x entity; abstract schema SupplierOrder; String primary key. Date is stored as epoch milliseconds (long).
    interface: false
    traces:
      - path: legacy-source/app/src/components/supplierpo/src/ejb-jar.xml
        line_start: 51
        line_end: 71
        excerpt: |
          <ejb-name>SupplierOrderEJB</ejb-name>
          <persistence-type>Container</persistence-type>
          <prim-key-class>java.lang.String</prim-key-class>
          <cmp-field><field-name>poId</field-name></cmp-field>
          <primkey-field>poId</primkey-field>
      - path: legacy-source/app/src/components/supplierpo/src/com/sun/j2ee/blueprints/supplierpo/ejb/SupplierOrderEJB.java
        line_start: 81
        line_end: 113
        excerpt: |
          public abstract String getPoId();
          public abstract long getPoDate();
          public abstract String getPoStatus();
    stack_metadata:
      framework: EJB 2.x CMP
      ejb.bean: SupplierOrderEJB
  - record_key: SUPF-BR-0001
    kind: business-rule
    capability_key: supplier-fulfilment
    requirement: >
      The system SHALL create every new supplier purchase order with the status PENDING, taking its id and date from the supplied order data.
    confidence: medium
    confidence_basis: One clear place (ejbCreate); no test or config corroborates.
    risk_class: operational
    basis: ejbCreate sets status to the PENDING constant unconditionally.
    plain_text: >
      A newly placed supplier purchase order always starts as pending.
    technical_note: ejbCreate copies orderId and orderDate.getTime(), sets OrderStatusNames.PENDING.
    interface: false
    traces:
      - path: legacy-source/app/src/components/supplierpo/src/com/sun/j2ee/blueprints/supplierpo/ejb/SupplierOrderEJB.java
        line_start: 151
        line_end: 156
        excerpt: |
          public String ejbCreate(SupplierOrder supplierOrder) throws CreateException {
            setPoId(supplierOrder.getOrderId());
            setPoDate(supplierOrder.getOrderDate().getTime());
            setPoStatus(OrderStatusNames.PENDING);
            return null;
          }
    stack_metadata:
      ejb.bean: SupplierOrderEJB
  - record_key: SUPF-WF-0001
    kind: workflow
    capability_key: supplier-fulfilment
    requirement: >
      The system SHALL recognise the purchase order statuses PENDING, APPROVED, DENIED and COMPLETED, with the documented transitions PENDING to APPROVED to COMPLETED, and PENDING to DENIED.
    confidence: low
    confidence_basis: >
      The transitions are stated only in a comment; this module enforces no transition check (setPoStatus is a plain setter), so enforcement elsewhere was not seen.
    risk_class: operational
    basis: Status constants and comment describing the lifecycle.
    plain_text: >
      A purchase order is pending, then either approved and later completed, or denied.
    technical_note: >
      OrderStatusNames constants; SupplierOrderLocal exposes setPoStatus to callers, so any caller may set any status. Transition logic lives in other modules.
    interface: false
    traces:
      - path: legacy-source/app/src/components/supplierpo/src/com/sun/j2ee/blueprints/supplierpo/ejb/OrderStatusNames.java
        line_start: 44
        line_end: 60
        excerpt: |
          * pending->approved->completed   or
          * pending->denied
          public static final String PENDING = "PENDING";
          public  static final String APPROVED = "APPROVED";
          public  static final String DENIED = "DENIED";
          public  static final String COMPLETED = "COMPLETED";
    stack_metadata:
      ejb.bean: SupplierOrderEJB
  - record_key: SUPF-REQ-0001
    kind: requirement
    capability_key: supplier-fulfilment
    requirement: >
      The system SHALL, on creating a purchase order, also create a shipping contact record from the order's shipping information and one line item record per line item supplied, and link them to the order.
    confidence: high
    confidence_basis: Programmatic creation in ejbPostCreate plus declared relationships in the descriptor.
    risk_class: operational
    basis: ejbPostCreate builds ContactInfo and LineItem entities; relationships declared with cascade delete.
    plain_text: >
      When a purchase order is placed with a supplier, its shipping address and every ordered item are stored with it.
    technical_note: >
      ServiceLocator lookups of the ContactInfo and LineItem local homes; lineItemref.create(li, 0) (second argument 0 is a bare literal, meaning unknown). A ServiceLocatorException becomes a CreateException. Relationships: one-to-one to ContactInfo, one-to-many to LineItem; cascade-delete on both so removing an order removes them. Creation runs under a container transaction (Required).
    interface: false
    traces:
      - path: legacy-source/app/src/components/supplierpo/src/com/sun/j2ee/blueprints/supplierpo/ejb/SupplierOrderEJB.java
        line_start: 162
        line_end: 184
        excerpt: |
          ContactInfoLocal cinfoloc = (ContactInfoLocal) cinforef.create(supplierOrder.getShippingInfo());
          setContactInfo(cinfoloc);
          ...
          LineItemLocal lineItemloc = (LineItemLocal) lineItemref.create(li, 0);
          addLineItem(lineItemloc);
      - path: legacy-source/app/src/components/supplierpo/src/ejb-jar.xml
        line_start: 296
        line_end: 306
        excerpt: |
          <ejb-relation-name>SupplierOrder-LineItem</ejb-relation-name>
          <multiplicity>One</multiplicity>
          <multiplicity>Many</multiplicity>
          <cascade-delete />
    stack_metadata:
      ejb.bean: SupplierOrderEJB
      ejb.transaction: Required
  - record_key: SUPF-REQ-0002
    kind: requirement
    capability_key: supplier-fulfilment
    requirement: >
      The system SHALL allow purchase orders to be looked up by id and listed by status.
    confidence: high
    confidence_basis: Finder declared on the home interface and as an EJB-QL query in the descriptor, with a transaction attribute.
    risk_class: operational
    basis: findByPrimaryKey and findOrdersByStatus (exact match on status, distinct).
    plain_text: >
      Staff and systems can find a purchase order by its number or list all orders in a given status.
    technical_note: "EJB-QL: SELECT DISTINCT OBJECT(a) FROM SupplierOrder a WHERE a.poStatus = ?1. Local interface only, no remote access."
    interface: false
    traces:
      - path: legacy-source/app/src/components/supplierpo/src/ejb-jar.xml
        line_start: 96
        line_end: 104
        excerpt: |
          <method-name>findOrdersByStatus</method-name>
          <ejb-ql>SELECT DISTINCT OBJECT(a) FROM SupplierOrder a WHERE a.poStatus = ?1</ejb-ql>
      - path: legacy-source/app/src/components/supplierpo/src/com/sun/j2ee/blueprints/supplierpo/ejb/SupplierOrderLocalHome.java
        line_start: 51
        line_end: 57
        excerpt: |
          public SupplierOrderLocal findByPrimaryKey(String poId) throws FinderException;
          public Collection findOrdersByStatus(String status) throws FinderException;
    stack_metadata:
      ejb.bean: SupplierOrderEJB
      ejb.transaction: Required
  - record_key: SUPF-INT-0001
    kind: integration
    capability_key: supplier-fulfilment
    requirement: >
      The system SHALL exchange a supplier order as an XML document with the elements OrderId, OrderDate (yyyy-MM-dd), ShippingInfo containing contact info, and one or more LineItem, validated against the SupplierOrder DTD when read.
    confidence: high
    confidence_basis: DTD plus serialisation/deserialisation code agree on structure; validation flag defaults to true.
    risk_class: operational
    basis: SupplierOrder.toXML/fromXML and the DTD define the document sent to the supplier.
    plain_text: >
      Purchase orders are sent to and read from suppliers as a standard XML document with order number, date, shipping contact and at least one item.
    technical_note: >
      DTD public id "-//Sun Microsystems, Inc. - J2EE Blueprints Group//DTD SupplierOrder 1.1//EN". VALIDATING=true. fromDOM rejects a root other than SupplierOrder. The raw XML is printed to stderr (TRACE).
    interface: true
    traces:
      - path: legacy-source/app/src/components/supplierpo/src/com/sun/j2ee/blueprints/supplierpo/rsrc/schemas/SupplierOrder.dtd
        line_start: 38
        line_end: 44
        excerpt: |
          <!ELEMENT SupplierOrder (OrderId, OrderDate, ShippingInfo, LineItem+)>
          <!ELEMENT OrderId (#PCDATA)>
          <!ELEMENT OrderDate (#PCDATA)>
          <!ELEMENT ShippingInfo (ContactInfo)>
      - path: legacy-source/app/src/components/supplierpo/src/com/sun/j2ee/blueprints/supplierpo/ejb/SupplierOrder.java
        line_start: 59
        line_end: 66
        excerpt: |
          public static final boolean VALIDATING = true;
          private final SimpleDateFormat dateFormat = new SimpleDateFormat("yyyy-MM-dd");
    stack_metadata:
      framework: JAXP DOM
  - record_key: SUPF-BR-0002
    kind: business-rule
    capability_key: supplier-fulfilment
    requirement: >
      GIVEN an incoming supplier order document whose OrderDate is missing or unparseable, WHEN it is read, THEN the system SHALL substitute the current date and continue.
    confidence: medium
    confidence_basis: One clear place, marked "FIX ME" by the original author, so intent is uncertain.
    risk_class: operational
    basis: fromDOM catch block resets the date.
    plain_text: >
      If a supplier order arrives with a bad or missing date, today's date is used instead of rejecting it.
    technical_note: Any exception in date parsing is caught; a message is written to stderr only.
    interface: true
    traces:
      - path: legacy-source/app/src/components/supplierpo/src/com/sun/j2ee/blueprints/supplierpo/ejb/SupplierOrder.java
        line_start: 220
        line_end: 223
        excerpt: |
          } catch (Exception exception) {
            supplierOrder.setOrderDate(new Date()); // FIX ME!
            System.err.println(XML_ORDERDATE + ": " + exception.getMessage() + " reset to current date.");
          }
    stack_metadata:
      framework: JAXP DOM
suspected_defects:
  - capability_key: supplier-fulfilment
    record_keys: [SUPF-BR-0002]
    severity: medium
    category: error-swallowed
    title: Invalid order date silently replaced with today
    description: >
      Any failure parsing OrderDate is swallowed and the order date becomes the receipt date, so the stored date may differ from the one the sender supplied. The author marked it FIX ME.
    traces:
      - path: legacy-source/app/src/components/supplierpo/src/com/sun/j2ee/blueprints/supplierpo/ejb/SupplierOrder.java
        line_start: 220
        line_end: 223
  - capability_key: supplier-fulfilment
    record_keys: [SUPF-ENT-0001]
    severity: medium
    category: data-corruption
    title: getData drops shipping info and status
    description: >
      SupplierOrderEJB.getData sets shippingInfo from the new empty order's own getShippingInfo (null), so the returned order has no shipping contact; poStatus is not copied either. A later toXML on that object would fail on a null shipping info.
    traces:
      - path: legacy-source/app/src/components/supplierpo/src/com/sun/j2ee/blueprints/supplierpo/ejb/SupplierOrderEJB.java
        line_start: 205
        line_end: 216
findings: []
