records:
  - record_key: SUPPLIER-FULFILMENT-ENTITY-0001
    kind: entity
    capability_key: supplier-fulfilment
    requirement: >
      The system SHALL persist a purchase order with an order id, user id, e-mail id, order date,
      locale, total value, one contact (billing/shipping) record, one credit card record and a
      collection of line items.
    confidence: high
    confidence_basis: >
      Stated in the CMP field accessors and ejbCreate/ejbPostCreate, and in the ejb-jar CMP
      declaration and the DTD; several independent places.
    risk_class: operational
    basis: >
      Entity bean declares the persistent fields and relationships; ejbCreate copies header fields
      and ejbPostCreate creates the contact, card and line-item children.
    plain_text: >
      Each purchase order sent to a supplier records who ordered, when, in which locale, the total
      value, the contact details, the payment card and the list of ordered items.
    technical_note: >
      PurchaseOrderEJB is a CMP 2.x entity (abstract schema PurchaseOrder) with CMR to ContactInfo,
      CreditCard and LineItem. ejbCreate sets poId/userId/emailId/date/locale/value; ejbPostCreate
      creates the children through the ServiceLocator.
    interface: false
    traces:
