  - record_key: SUPPLIER-FULFILMENT-BUSINESS-RULE-0003
    kind: business-rule
    capability_key: supplier-fulfilment
    requirement: >
      WHEN supplier invoice information is processed for a purchase order, the system SHALL add
      the shipped quantity reported for each item id to that line item's shipped quantity, and
      SHALL report the order as completely fulfilled only if every line item's ordered quantity
      equals its shipped quantity.
    confidence: medium
    confidence_basis: >
      One clear place (PurchaseOrderHelper.processInvoice); callers are outside this module and
      were not examined.
    risk_class: financial
    basis: >
      processInvoice accumulates shipped quantity per matching item id, then compares quantity to
      quantityShipped for all lines and returns false on the first mismatch.
    plain_text: >
      When a supplier reports a shipment, the shipped amounts are added to the order's items. The
      order counts as fully delivered only when every item has been shipped in exactly the ordered
      quantity.
    technical_note: >
      Matching is by item id; an item id in the invoice map that matches no line is ignored
      silently. Equality (!=) is used, so over-shipment leaves the order never complete.
      Lines with the same item id would each receive the full shipped amount.
    interface: true
    traces:
      - path: legacy-source/app/src/components/purchaseorder/src/com/sun/j2ee/blueprints/purchaseorder/ejb/PurchaseOrderHelper.java
        line_start: 83
        line_end: 102
        excerpt: |
          Collection liColl = po.getLineItems();
              Iterator liIt = liColl.iterator();
              while((liIt != null) && (liIt.hasNext())) {
                LineItemLocal li = (LineItemLocal) liIt.next();
                if(lineItemIds.containsKey(li.getItemId())) {
                            Integer shipped = (Integer) lineItemIds.get(li.getItemId());
                    li.setQuantityShipped(li.getQuantityShipped() + shipped.intValue());
                    }
              }//end while

              // now loop through all LIs and see if all are shipped completely
              liColl = po.getLineItems();
              liIt = liColl.iterator();
              while((liIt != null) && (liIt.hasNext())) {
                LineItemLocal li = (LineItemLocal) liIt.next();
                if(li.getQuantity() != li.getQuantityShipped()) {
                    return false;
                    }
              }//end while
              return true;
    stack_metadata:
      framework: EJB 2.x
      ejb.bean: PurchaseOrderHelper

  - record_key: SUPPLIER-FULFILMENT-REQUIREMENT-0004
