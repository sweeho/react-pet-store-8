  - record_key: SUPPLIER-FULFILMENT-BUSINESS-RULE-0006
    kind: business-rule
    capability_key: supplier-fulfilment
    requirement: >
      GIVEN an incoming purchase order document whose order date is missing or unparseable, WHEN
      it is read, the system SHALL use the current date as the order date and continue.
    confidence: medium
    confidence_basis: >
      One clear place; behaviour explicit in catch block with log message.
    risk_class: operational
    basis: fromDOM catches any exception parsing OrderDate and substitutes new Date().
    plain_text: >
      If an incoming purchase order has no valid date, today's date is used instead.
    technical_note: >
      Any exception, including a structural one, is swallowed and logged to stderr only. Because
      the sibling cursor is advanced inside the try, a missing OrderDate element may also affect
      reading of later elements.
    interface: true
    traces:
      - path: legacy-source/app/src/components/purchaseorder/src/com/sun/j2ee/blueprints/purchaseorder/ejb/PurchaseOrder.java
        line_start: 297
        line_end: 303
        excerpt: |
          try {
                  child = XMLDocumentUtils.getNextSibling(child, XML_ORDERDATE, false);
                  purchaseOrder.setOrderDate(purchaseOrder.dateFormat.parse(XMLDocumentUtils.getContentAsString(child, false)));
                } catch (Exception exception) {
                  purchaseOrder.setOrderDate(new Date());
                  System.err.println(XML_ORDERDATE + ": " + exception.getMessage() + " reset to current date.");
                }
    stack_metadata:
      framework: JAXP DOM

