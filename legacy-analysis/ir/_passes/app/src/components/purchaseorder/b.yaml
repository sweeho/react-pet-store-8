      One clear place (ejbPostCreate); no test or config corroboration.
    risk_class: operational
    basis: >
      ejbPostCreate creates children and passes 0 as the second argument to the line item create.
      A ServiceLocatorException is converted to CreateException.
    plain_text: >
      When a supplier order is placed, its contact details, card and each ordered item are stored
      with it, and no items are marked as shipped yet. If any of these cannot be stored, the order
      is not created.
    technical_note: >
      The second argument 0 to LineItemLocalHome.create is presumed to be the initial shipped
