        line_start: 129
        line_end: 131
        excerpt: |
          public Integer getCount() {
              return new Integer(cart.size());
          }
      - path: legacy-source/app/src/components/cart/src/com/sun/j2ee/blueprints/cart/model/ShoppingCartModel.java
        line_start: 62
        line_end: 65
        excerpt: |
          public int getSize() {
              if (items != null) return items.size();
              else return 0;
          }
    stack_metadata:
      ejb.bean: ShoppingCartEJB
  - record_key: SHOP-REQ-0006
    kind: business-rule
    capability_key: shopping-cart
    requirement: >
      The system SHALL present each cart line using the current catalog data for the shopper's locale (item id, product id, category, product name, attribute, list cost), with the quantity from the cart.
    confidence: medium
    confidence_basis: One clear place; locale default US English visible in code.
    risk_class: financial
    basis: getItems looks up every cart key in the catalog by locale and builds CartItems with the list cost as unit cost.
    plain_text: Cart lines show name, description and price from the catalog in the shopper's language; the price is the current list price, not a price saved when the item was added.
    technical_note: getItems uses CatalogHelper(false) local EJB access; locale defaults to Locale.US unless setLocale is called.
    interface: false
    traces:
      - path: legacy-source/app/src/components/cart/src/com/sun/j2ee/blueprints/cart/ejb/ShoppingCartLocalEJB.java
        line_start: 83
        line_end: 103
        excerpt: |
          public Collection getItems() {
              // get a catalog helper using local EJB access
              CatalogHelper catalog = new CatalogHelper(false);
              HashMap map = getDetails();
              ArrayList items = new ArrayList();
              Iterator it = map.keySet().iterator();
              while (it.hasNext()) {
                  String key = (String)it.next();
                  Integer value = (Integer)map.get(key);
                  Item item = null;
                  try {
                      item = catalog.getItem(key, locale);
                      CartItem ci = new CartItem(item.getItemId(),
                                             item.getProductId(),
                                             item.getCategory(),
                                             item.getProductName(),
                                             item.getAttribute(),
                                             value.intValue(),
                                             item.getListCost());
                      items.add(ci);
    stack_metadata:
      ejb.bean: ShoppingCartEJB
  - record_key: SHOP-REQ-0007
    kind: business-rule
    capability_key: shopping-cart
    requirement: >
      The system SHALL compute each line total as quantity multiplied by unit cost, and the cart subtotal/total as the sum of line totals, with no tax, shipping, discount or rounding applied.
    confidence: high
    confidence_basis: Same calculation in two places (bean getSubTotal and model getTotalCost); both use unrounded double arithmetic.
    risk_class: financial
    basis: Sum of unitCost*quantity over catalog-resolved items.
    plain_text: The cart total is the sum of price times quantity for each line, with nothing else added or taken off.
    technical_note: Floating-point double sums; no rounding. Bean getSubTotal returns null only if getItems returns null (never in practice).
    interface: false
    traces:
      - path: legacy-source/app/src/components/cart/src/com/sun/j2ee/blueprints/cart/ejb/ShoppingCartLocalEJB.java
        line_start: 133
        line_end: 144
        excerpt: |
          public Double getSubTotal() {
               Collection items = getItems();
               if (items == null) return null;
               double ret = 0.0d;
               for (Iterator it =items.iterator(); it.hasNext(); ) {
                   CartItem i = (CartItem) it.next();
                   ret += (i.getUnitCost() * i.getQuantity()) ;
               }
               return new Double(ret);
          }
      - path: legacy-source/app/src/components/cart/src/com/sun/j2ee/blueprints/cart/model/ShoppingCartModel.java
        line_start: 79
        line_end: 86
        excerpt: |
          public double getTotalCost() {
              double total = 0;
              for (Iterator li = getItems(); li.hasNext(); ) {
                  CartItem item = (CartItem) li.next();
                  total += item.getTotalCost();
              }
              return total;
          }
      - path: legacy-source/app/src/components/cart/src/com/sun/j2ee/blueprints/cart/model/CartItem.java
        line_start: 95
        line_end: 97
        excerpt: |
          public double getTotalCost() {
              return quantity * unitCost;
          }
    stack_metadata:
      ejb.bean: ShoppingCartEJB
