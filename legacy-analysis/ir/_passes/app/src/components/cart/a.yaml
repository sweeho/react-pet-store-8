records:
  - record_key: SHOP-REQ-0001
    kind: requirement
    capability_key: shopping-cart
    requirement: >
      The system SHALL hold each shopper's cart as a per-session mapping of item identifier to quantity, starting empty, with one entry per distinct item.
    confidence: high
    confidence_basis: >
      Map-backed state in the bean, plus ejb-jar declares the bean Stateful; two places.
    risk_class: operational
    basis: Cart is a HashMap keyed by item id; stateful session bean.
    plain_text: Each shopper has their own cart that starts empty and lists each item once with a quantity.
    technical_note: ShoppingCartLocalEJB is a stateful session bean; state is a HashMap(itemId -> Integer).
    interface: false
    traces:
      - path: legacy-source/app/src/components/cart/src/com/sun/j2ee/blueprints/cart/ejb/ShoppingCartLocalEJB.java
        line_start: 64
        line_end: 70
        excerpt: |
              private HashMap cart;
              // default to the US English
              private Locale locale = Locale.US;

              public ShoppingCartLocalEJB() {
                  cart = new HashMap();
              }
      - path: legacy-source/app/src/components/cart/src/ejb-jar.xml
        line_start: 53
        line_end: 54
        excerpt: |
          <session-type>Stateful</session-type>
          <transaction-type>Container</transaction-type>
    stack_metadata:
      framework: EJB 2.x
      ejb.bean: ShoppingCartEJB
      ejb.transaction: Required
      session.scope: Stateful
  - record_key: SHOP-REQ-0002
    kind: business-rule
    capability_key: shopping-cart
    requirement: >
      The system SHALL, when an item is added, set that item's quantity to 1 if no quantity is given, or to the given quantity otherwise, replacing any quantity already in the cart rather than adding to it.
    confidence: medium
    confidence_basis: One clear place (put overwrites); no test or comment states intent.
    risk_class: operational
    basis: addItem uses Map.put, so re-adding an existing item overwrites.
    plain_text: Adding an item puts it in the cart with quantity 1 (or the chosen quantity); adding it again resets the quantity instead of increasing it.
    technical_note: addItem(String) and addItem(String,int) call cart.put with no accumulation and no validation of qty (zero or negative accepted).
    interface: false
    traces:
      - path: legacy-source/app/src/components/cart/src/com/sun/j2ee/blueprints/cart/ejb/ShoppingCartLocalEJB.java
        line_start: 111
        line_end: 117
        excerpt: |
          public void addItem (String itemID) {
              cart.put(itemID, new Integer(1));
          }

          public void addItem (String itemID,int qty) {
              cart.put(itemID, new Integer(qty));
          }
    stack_metadata:
      ejb.bean: ShoppingCartEJB
  - record_key: SHOP-REQ-0003
    kind: requirement
    capability_key: shopping-cart
    requirement: >
      The system SHALL allow an item to be removed from the cart and the entire cart to be emptied.
    confidence: medium
    confidence_basis: One clear place.
    risk_class: operational
    basis: deleteItem and empty operations.
    plain_text: Shoppers can remove one item or clear the whole cart.
    technical_note: deleteItem -> cart.remove; empty -> cart.clear.
    interface: false
    traces:
      - path: legacy-source/app/src/components/cart/src/com/sun/j2ee/blueprints/cart/ejb/ShoppingCartLocalEJB.java
        line_start: 119
        line_end: 121
        excerpt: |
          public void deleteItem (String itemID) {
              cart.remove(itemID);
          }
      - path: legacy-source/app/src/components/cart/src/com/sun/j2ee/blueprints/cart/ejb/ShoppingCartLocalEJB.java
        line_start: 146
        line_end: 148
        excerpt: |
          public void empty () {
              cart.clear();
          }
    stack_metadata:
      ejb.bean: ShoppingCartEJB
  - record_key: SHOP-REQ-0004
    kind: business-rule
    capability_key: shopping-cart
    requirement: >
      GIVEN an item in the cart WHEN its quantity is updated to a value less than or equal to zero THEN the system SHALL remove the item; WHEN the new quantity is greater than zero THEN the system SHALL set the quantity to that value.
    confidence: high
    confidence_basis: Explicit code plus an explanatory comment.
    risk_class: operational
    basis: updateItemQuantity removes then re-adds only if positive.
    plain_text: Setting an item's quantity to zero or less takes it out of the cart; otherwise the quantity is replaced.
    technical_note: updateItemQuantity removes the key, then puts if newQty > 0. Note an update for an item not in the cart adds it.
    interface: false
    traces:
      - path: legacy-source/app/src/components/cart/src/com/sun/j2ee/blueprints/cart/ejb/ShoppingCartLocalEJB.java
        line_start: 123
        line_end: 127
        excerpt: |
          public void updateItemQuantity (String itemID, int newQty) {
              cart.remove(itemID);
              // remove item if it is less than or equal to 0
              if (newQty > 0) cart.put(itemID, new Integer(newQty));
          }
    stack_metadata:
      ejb.bean: ShoppingCartEJB
  - record_key: SHOP-REQ-0005
    kind: requirement
    capability_key: shopping-cart
    requirement: >
      The system SHALL report the cart's item count as the number of distinct items, not the sum of quantities.
    confidence: medium
    confidence_basis: One clear place.
    risk_class: presentational
    basis: getCount returns cart.size().
    plain_text: The cart's item count is the number of different items, not total units.
    technical_note: getCount returns Integer(cart.size()); ShoppingCartModel.getSize likewise counts line items.
    interface: false
    traces:
