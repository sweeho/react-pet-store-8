suspected_defects:
  - capability_key: shopping-cart
    record_keys: [CART-BR-0010]
    severity: medium
    category: error-swallowed
    title: Items missing from the catalog vanish from the cart without notice
    description: >
      A catalog failure for an item is caught and printed to standard output only; the shopper sees a smaller cart and total and no message.
    traces:
      - path: legacy-source/app/src/components/cart/src/com/sun/j2ee/blueprints/cart/ejb/ShoppingCartLocalEJB.java
        line_start: 104
        line_end: 106
  - capability_key: shopping-cart
    record_keys: [CART-REQ-0009]
    severity: low
    category: inconsistent-rounding
    title: Money computed in binary floating point without rounding
    description: >
      Subtotal uses double multiplication and addition with no rounding step, in two parallel implementations.
    traces:
      - path: legacy-source/app/src/components/cart/src/com/sun/j2ee/blueprints/cart/ejb/ShoppingCartLocalEJB.java
        line_start: 137
        line_end: 143
  - capability_key: shopping-cart
