  - record_key: CART-REQ-0008
    kind: requirement
    capability_key: localization
    requirement: >
      The system SHALL default the cart's locale to US English and SHALL allow it to be set per cart so catalog text and prices are fetched in that locale.
    plain_text: Carts show US English content unless a language/region is set for the shopper.
    technical_note: Field initialised Locale.US; setLocale mutates it.
