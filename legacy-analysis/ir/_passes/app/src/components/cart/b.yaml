records:
  - record_key: CART-REQ-0001
    kind: requirement
    capability_key: shopping-cart
    requirement: >
      The system SHALL keep, per shopper session, a cart that maps catalog item identifiers to a quantity.
    plain_text: A shopper has a cart that remembers which items they chose and how many of each, for the length of their visit.
    technical_note: ShoppingCartLocalEJB is a stateful session bean holding a HashMap itemId -> Integer; ejbCreate and constructor both initialise it.
    interface: false
    confidence: high
    confidence_basis: Bean code plus ejb-jar session-type Stateful declaration agree.
    risk_class: operational
    basis: Stateful session bean with in-memory map; no persistence.
    traces:
      - path: legacy-source/app/src/components/cart/src/com/sun/j2ee/blueprints/cart/ejb/ShoppingCartLocalEJB.java
        line_start: 64
        line_end: 70
        excerpt: |
          private HashMap cart;
          // default to the US English
          private Locale locale = Locale.US;

          public ShoppingCartLocalEJB() {
              cart = new HashMap();
          }
      - path: legacy-source/app/src/components/cart/src/ejb-jar.xml
        line_start: 53
        line_end: 54
        excerpt: |
          <session-type>Stateful</session-type>
          <transaction-type>Container</transaction-type>
    stack_metadata:
      framework: EJB
      ejb.bean: ShoppingCartEJB
      ejb.transaction: Required
      session.scope: stateful
  - record_key: CART-REQ-0002
    kind: requirement
    capability_key: shopping-cart
    requirement: >
      The system SHALL allow an item to be added to the cart with a default quantity of 1, or with an explicit quantity.
    plain_text: Adding an item puts one in the cart unless a quantity is given.
    technical_note: addItem(id) puts Integer(1); addItem(id, qty) puts qty. Both use put, so adding an item already in the cart replaces its quantity rather than increasing it; qty is not validated.
    interface: false
    confidence: medium
    confidence_basis: One clear place in the bean; no tests or docs seen.
    risk_class: operational
    basis: addItem overloads.
    traces:
      - path: legacy-source/app/src/components/cart/src/com/sun/j2ee/blueprints/cart/ejb/ShoppingCartLocalEJB.java
        line_start: 111
        line_end: 117
        excerpt: |
          public void addItem (String itemID) {
              cart.put(itemID, new Integer(1));
          }

          public void addItem (String itemID,int qty) {
              cart.put(itemID, new Integer(qty));
          }
    stack_metadata:
      framework: EJB
      ejb.bean: ShoppingCartEJB
  - record_key: CART-BR-0003
    kind: business-rule
    capability_key: shopping-cart
    requirement: >
      GIVEN an item already in the cart WHEN it is added again THEN the system SHALL set its quantity to the newly supplied value (1 if none supplied) and not accumulate.
    plain_text: Adding an item that is already in the cart resets its quantity instead of adding to it.
    technical_note: Consequence of HashMap.put overwrite semantics; no merge logic.
    interface: false
    confidence: medium
    confidence_basis: Inferred from put semantics; no comment or test states intent.
    risk_class: operational
    basis: addItem uses put without checking for existing key.
    traces:
      - path: legacy-source/app/src/components/cart/src/com/sun/j2ee/blueprints/cart/ejb/ShoppingCartLocalEJB.java
        line_start: 111
        line_end: 117
        excerpt: |
          cart.put(itemID, new Integer(1));
          cart.put(itemID, new Integer(qty));
    stack_metadata:
      framework: EJB
  - record_key: CART-REQ-0004
    kind: requirement
    capability_key: shopping-cart
    requirement: >
      The system SHALL allow an item to be removed from the cart, and SHALL allow the cart to be emptied entirely.
    plain_text: A shopper can remove one item or clear the whole cart.
    technical_note: deleteItem -> map.remove; empty -> map.clear.
    interface: false
    confidence: medium
    confidence_basis: One clear place.
    risk_class: operational
    basis: deleteItem and empty methods.
    traces:
      - path: legacy-source/app/src/components/cart/src/com/sun/j2ee/blueprints/cart/ejb/ShoppingCartLocalEJB.java
        line_start: 119
        line_end: 148
        excerpt: |
          public void deleteItem (String itemID) {
              cart.remove(itemID);
          }
          ...
          public void empty () {
              cart.clear();
          }
    stack_metadata:
      framework: EJB
  - record_key: CART-BR-0005
    kind: business-rule
    capability_key: shopping-cart
    requirement: >
      GIVEN an update of an item's quantity WHEN the new quantity is greater than 0 THEN the system SHALL set the quantity; WHEN it is 0 or less THEN the system SHALL remove the item from the cart.
    plain_text: Changing a quantity to zero or below takes the item out of the cart.
    technical_note: updateItemQuantity removes the key, then re-puts only if newQty > 0. Applies even to an item not previously in the cart (it would be added).
    interface: false
    confidence: high
    confidence_basis: Code plus explanatory comment.
    risk_class: operational
    basis: Explicit comment and condition.
    traces:
      - path: legacy-source/app/src/components/cart/src/com/sun/j2ee/blueprints/cart/ejb/ShoppingCartLocalEJB.java
        line_start: 123
        line_end: 127
        excerpt: |
          public void updateItemQuantity (String itemID, int newQty) {
              cart.remove(itemID);
              // remove item if it is less than or equal to 0
              if (newQty > 0) cart.put(itemID, new Integer(newQty));
          }
    stack_metadata:
      framework: EJB
  - record_key: CART-REQ-0006
    kind: requirement
    capability_key: shopping-cart
    requirement: >
      The system SHALL report the cart item count as the number of distinct items in the cart, not the sum of quantities.
    plain_text: The cart's item count is the number of different products, not the total pieces.
    technical_note: getCount returns cart.size(); ShoppingCartModel.getSize returns items.size() (0 if null).
    interface: false
    confidence: high
    confidence_basis: Two places (bean and model) count distinct lines.
    risk_class: presentational
    basis: getCount / getSize.
    traces:
      - path: legacy-source/app/src/components/cart/src/com/sun/j2ee/blueprints/cart/ejb/ShoppingCartLocalEJB.java
        line_start: 129
        line_end: 131
        excerpt: |
          public Integer getCount() {
              return new Integer(cart.size());
          }
      - path: legacy-source/app/src/components/cart/src/com/sun/j2ee/blueprints/cart/model/ShoppingCartModel.java
        line_start: 62
        line_end: 65
        excerpt: |
          public int getSize() {
              if (items != null) return items.size();
              else return 0;
          }
    stack_metadata:
      framework: EJB
  - record_key: CART-REQ-0007
