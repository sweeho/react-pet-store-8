  - record_key: CART-REQ-0009
    kind: requirement
    capability_key: shopping-cart
    requirement: >
      The system SHALL compute the cart subtotal as the sum over lines of unit cost multiplied by quantity, with no discount, tax or shipping and no rounding.
    plain_text: The cart total is the sum of price times quantity for every line, with nothing else added.
    technical_note: getSubTotal sums double arithmetic over getItems(); ShoppingCartModel.getTotalCost does the same via CartItem.getTotalCost. Two parallel implementations. Floating-point double, no rounding.
    interface: false
    confidence: high
    confidence_basis: Two implementations (bean and model) compute identically.
    risk_class: financial
    basis: getSubTotal and getTotalCost.
    traces:
      - path: legacy-source/app/src/components/cart/src/com/sun/j2ee/blueprints/cart/ejb/ShoppingCartLocalEJB.java
        line_start: 133
        line_end: 144
        excerpt: |
          double ret = 0.0d;
          for (Iterator it =items.iterator(); it.hasNext(); ) {
              CartItem i = (CartItem) it.next();
              ret += (i.getUnitCost() * i.getQuantity()) ;
          }
      - path: legacy-source/app/src/components/cart/src/com/sun/j2ee/blueprints/cart/model/ShoppingCartModel.java
        line_start: 79
        line_end: 86
        excerpt: |
          public double getTotalCost() {
              double total = 0;
              for (Iterator li = getItems(); li.hasNext(); ) {
                  CartItem item = (CartItem) li.next();
                  total += item.getTotalCost();
              }
    stack_metadata:
      framework: EJB
  - record_key: CART-BR-0010
    kind: business-rule
    capability_key: shopping-cart
    requirement: >
      GIVEN a cart item whose catalog lookup fails WHEN the cart is listed or totalled THEN the system SHALL omit that item from the list and from the subtotal and continue with the remaining items.
    plain_text: If a product can no longer be found in the catalog, it silently disappears from the cart view and total.
    technical_note: CatalogException caught in getItems and only printed with System.out.println; item stays in the underlying map and is simply not returned.
    interface: false
    confidence: medium
    confidence_basis: One clear place; intent not documented.
    risk_class: financial
    basis: catch block.
    traces:
      - path: legacy-source/app/src/components/cart/src/com/sun/j2ee/blueprints/cart/ejb/ShoppingCartLocalEJB.java
        line_start: 104
        line_end: 106
