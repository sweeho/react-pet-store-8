suspected_defects:
  - capability_key: sign-on-security
    record_keys: [SIGN-REQ-0001, SIGN-REQ-0006]
    severity: high
    category: data-corruption
    title: Passwords stored and compared in plain text, and written to the server log
    description: >
      The stored password is compared with String.equals, so it is held unhashed. CreateUserServlet prints the submitted user name and password to standard output during account creation.
    traces:
      - path: legacy-source/app/src/components/signon/src/com/sun/j2ee/blueprints/signon/user/ejb/UserEJB.java
        line_start: 805
        line_end: 807
      - path: legacy-source/app/src/components/signon/src/com/sun/j2ee/blueprints/signon/web/CreateUserServlet.java
        line_start: 50
        line_end: 70
  - capability_key: sign-on-security
    record_keys: [SIGN-REQ-0002]
    severity: medium
    category: other
    title: Role constraints are parsed but never enforced
    description: >
      SignOnDAO reads auth-constraint role names into each protected resource, but SignOnFilter only tests whether the session is signed on; any authenticated user passes any protected URL. Exact-match URL patterns also leave sub-paths unprotected.
    traces:
      - path: legacy-source/app/src/components/signon/src/com/sun/j2ee/blueprints/signon/web/SignOnDAO.java
        line_start: 139
        line_end: 145
      - path: legacy-source/app/src/components/signon/src/com/sun/j2ee/blueprints/signon/web/SignOnFilter.java
        line_start: 124
        line_end: 155
