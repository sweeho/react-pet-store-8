  - record_key: SIGN-REQ-0002
    kind: workflow
    capability_key: sign-on-security
    requirement: >
      GIVEN a request for a URL that matches a protected resource pattern in the sign-on configuration, WHEN the session is not signed on, THEN the system SHALL remember the requested URL in the session and show the sign-on page instead; requests for unprotected URLs, or from signed-on sessions, SHALL proceed unchanged.
    plain_text: >
      Pages marked as protected ask a visitor to sign on first; once signed on, the visitor is sent back to the page they originally asked for.
    technical_note: >
      SignOnFilter.doFilter checks session attribute j_signon (Boolean), then iterates protectedResources loaded from /WEB-INF/signon-config.xml by SignOnDAO and compares urlPattern by exact equality with the path after the context root. Stores j_signon_original_url and forwards to signOnPage. Exact-match only, no wildcard support; role names parsed by the DAO are never checked by the filter.
    interface: false
    confidence: high
    confidence_basis: >
      Filter logic and DAO configuration parsing both read; no test or sample config seen.
    risk_class: regulated
    basis: Filter forward logic and config parsing.
