      framework: servlet filter
  - record_key: SIGN-REQ-0005
    kind: business-rule
    capability_key: sign-on-security
    requirement: >
      The system SHALL reject creation of a user whose user name exceeds 25 characters, whose password exceeds the maximum password length, or whose user name contains '%' or '*'; a rejected creation SHALL redirect to the user creation error page.
    plain_text: >
      New sign-on accounts have a limit on user name and password length, and user names may not contain the characters % or *.
    technical_note: >
      UserEJB.ejbCreate throws CreateException; CreateUserServlet catches it and redirects to user_creation_error.jsp. The '%' and '*' ban presumably protects wildcard finders. Maximum password length constant value was redacted in the source view, so it is not stated here.
