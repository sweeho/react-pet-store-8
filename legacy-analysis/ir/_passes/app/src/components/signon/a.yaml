  - record_key: SIGN-REQ-0004
    kind: requirement
    capability_key: sign-on-security
    requirement: >
      WHEN a sign-on is submitted with the remember-user-name option, the system SHALL store the user name in a cookie named bp_signon valid for 2678400 seconds (31 days); WHEN the option is absent, the system SHALL expire any existing bp_signon cookie.
    plain_text: >
      A visitor may ask to be remembered; their user name is then kept for about a month, and is forgotten when they sign on without that option.
    technical_note: >
      Cookie set before authentication is checked, so it is stored even when the sign-on fails. Value is the plain user name; the 31-day literal has no comment or config.
    interface: false
    confidence: medium
    confidence_basis: >
      One clear place; the duration is a bare literal.
    risk_class: operational
    basis: Cookie handling in validateSignOn.
    traces:
