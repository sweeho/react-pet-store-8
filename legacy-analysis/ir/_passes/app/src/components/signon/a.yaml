  - record_key: SIGN-REQ-0003
    kind: workflow
    capability_key: sign-on-security
    requirement: >
      GIVEN a sign-on submission, WHEN authentication succeeds, THEN the system SHALL record the user name and a signed-on flag in the session and redirect to the originally requested URL; WHEN it fails, THEN the system SHALL redirect to the configured sign-on error page.
    plain_text: >
      A successful sign-on takes the visitor to the page they wanted; a failed one shows an error page.
    technical_note: >
      SignOnFilter.validateSignOn, triggered when the target path equals j_signon_check. Reads j_username/j_password, sets session j_signon_username and j_signon=true, sendRedirect(ORIGINAL_URL). If no original URL is in the session (direct sign-on), sendRedirect(null) is invoked; behaviour not handled.
    interface: false
