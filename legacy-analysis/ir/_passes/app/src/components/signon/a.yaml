  - record_key: SIGN-REQ-0001
    kind: requirement
    capability_key: sign-on-security
    requirement: >
      The system SHALL authenticate a user by looking up the submitted user name and comparing the submitted password for exact equality with the stored password; an unknown user name SHALL fail authentication.
    plain_text: >
      A visitor can sign on only with a user name that exists and a password that exactly matches the one on file.
    technical_note: >
      SignOnEJB.authenticate does findByPrimaryKey(userName) on the User entity and calls matchPassword, which is String.equals on the stored value. FinderException returns false.
    interface: false
    confidence: high
    confidence_basis: >
      Two cooperating classes (session bean and entity bean) enforce it; read directly.
    risk_class: regulated
    basis: Session bean delegates to entity bean password comparison.
