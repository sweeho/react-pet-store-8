  - record_key: SIGN-REQ-0006
    kind: workflow
    capability_key: customer-accounts
    requirement: >
      WHEN a user-creation form is posted with a user name and password, the system SHALL create a sign-on account and redirect to the target page, or to the user creation error page if creation fails.
