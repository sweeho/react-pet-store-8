  - record_key: SIGN-RULE-0005
    kind: business-rule
    capability_key: sign-on-security
    requirement: >
      The system SHALL reject creation of a user whose user name exceeds 25 characters, whose password exceeds the maximum password length, or whose user name contains the characters '%' or '*'.
    plain_text: >
      New user names may be at most 25 characters and may not contain % or *; passwords also have a maximum length.
    technical_note: >
      UserEJB.ejbCreate throws CreateException; limits come from UserLocal.MAX_USERID_LENGTH=25 and MAX_PASSWD_LENGTH. The wildcard ban likely protects LIKE-style finders. Password limit value not excerpted (redacted in source view).
    interface: false
    confidence: medium
    confidence_basis: One clear place (ejbCreate); no minimum length or emptiness rules visible, and password limit value was not readable.
