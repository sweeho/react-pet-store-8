  - record_key: SIGN-WF-0006
    kind: workflow
    capability_key: customer-accounts
    requirement: >
      WHEN a new-user form is posted the system SHALL create the user through the sign-on service and redirect to a target page; IF creation fails THEN it SHALL redirect to the user creation error page.
    plain_text: >
      A visitor can register a sign-in account; if registration is refused they see an error page.
    technical_note: >
      CreateUserServlet.doPost reads j_username/j_password, calls SignOnEJB.createUser and catches CreateException -> user_creation_error.jsp. Duplicate user names surface as CreateException (DuplicateKeyException from container, not seen explicitly). Filed under customer-accounts as account creation; the sign-on capability is the alternative. Reachability (servlet mapping in web.xml) not in this module.
