  - record_key: SIGN-RULE-0004
    kind: business-rule
    capability_key: sign-on-security
    requirement: >
      WHEN the sign-on form includes the remember-username option the system SHALL store the user name in a cookie named bp_signon valid for 2678400 seconds (31 days); WHEN the option is absent the system SHALL expire any existing bp_signon cookie.
    plain_text: >
      If the visitor ticks "remember my user name" it is remembered for about a month; if not ticked, any remembered name is cleared.
    technical_note: >
      Cookie set in validateSignOn before authentication is checked, so it is set/cleared even when the login fails. 2678400 is a bare literal (31 days). Cookie holds the user name only.
    interface: false
    confidence: medium
    confidence_basis: One clear place; no comment beyond "one month", no config or test.
    risk_class: operational
    basis: Cookie handling in sign-on check.
