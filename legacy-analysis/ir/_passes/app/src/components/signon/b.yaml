      The system SHALL keep a user credential record with a unique user name as identifier and a password.
    plain_text: >
      Each sign-in account has a unique user name and a password.
    technical_note: >
      CMP 2.x entity UserEJB, abstract schema User, cmp fields userName and password, primkey-field userName, non-reentrant.
