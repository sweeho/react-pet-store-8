        line_start: 137
        line_end: 150
  - capability_key: sign-on-security
    record_keys: [SIGN-RULE-0002]
    severity: medium
    category: other
    title: Session not renewed on sign-on and failed login has no throttle
    description: >
      Sign-on sets attributes on the existing session without issuing a new one, and the redirect uses the stored original URL without a null check (a direct post to the sign-on check yields redirect to null). No attempt limit exists.
