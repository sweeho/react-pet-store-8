  - capability_key: sign-on-security
    record_keys: [SIGN-REQ-0001]
    severity: medium
    category: other
    title: Protected-resource roles are parsed but never enforced; exact-match only
    description: >
      SignOnDAO reads auth-constraint role names into ProtectedResource but SignOnFilter never checks them, so any signed-on user passes. Matching is exact string equality, so a wildcard pattern protects nothing.
    traces:
      - path: legacy-source/app/src/components/signon/src/com/sun/j2ee/blueprints/signon/web/SignOnFilter.java
        line_start: 139
        line_end: 151
