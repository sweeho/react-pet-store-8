  - record_key: SIGN-RULE-0003
    kind: business-rule
    capability_key: sign-on-security
    requirement: >
      The system SHALL treat a user as authenticated only when a user with the supplied name exists and the supplied password is exactly equal to the stored password; an unknown user SHALL be treated as failed authentication.
    plain_text: >
      A sign-in succeeds only if the user exists and the password is exactly the one on file.
    technical_note: >
      SignOnEJB.authenticate does findByPrimaryKey(userName) and UserEJB.matchPassword uses String.equals on the stored value; FinderException returns false. Passwords are compared as stored plain text.
    interface: false
    confidence: high
    confidence_basis: Two cooperating classes implement it; persistence mapping in ejb-jar.xml confirms userName is primary key.
    risk_class: regulated
    basis: Credential check.
