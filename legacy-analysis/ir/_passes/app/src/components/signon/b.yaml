records:
  - record_key: SIGN-REQ-0001
    kind: requirement
    capability_key: sign-on-security
    requirement: >
      The system SHALL intercept every request and, when the user is not signed on and the requested
      resource matches a configured protected resource, present the sign-on page instead and remember the originally requested resource.
    plain_text: >
      Protected pages cannot be opened until the visitor has signed in; the visitor sees the sign-in page and is remembered as wanting the original page.
    technical_note: >
      SignOnFilter.doFilter compares the path after the context root to each protected url-pattern by exact string equality, stores it in the session as the original URL and forwards to the login page. Non-matching URLs pass through.
    interface: false
    confidence: high
    confidence_basis: >
      Enforced in the filter code and driven by declared security-constraint config read by SignOnDAO (two places); the config file itself (signon-config.xml) was not seen in this module.
    risk_class: regulated
    basis: Filter checks session flag, loops over protected resources, forwards to sign-on page.
    traces:
      - path: legacy-source/app/src/components/signon/src/com/sun/j2ee/blueprints/signon/web/SignOnFilter.java
        line_start: 124
        line_end: 155
        excerpt: |
          if (signedOn) {
                  chain.doFilter(request,response);
                  return;
          }
          if (urlPattern.equals(targetURL)) {
              hreq.getSession().setAttribute(ORIGINAL_URL,  targetURL);
    stack_metadata:
      framework: servlet-filter
      session.scope: HttpSession
  - record_key: SIGN-RULE-0002
    kind: business-rule
    capability_key: sign-on-security
    requirement: >
      GIVEN a sign-on submission to the sign-on check address WHEN the supplied user name and password match a registered user THEN the system SHALL mark the session as signed on, record the user name in the session and redirect to the originally requested resource; OTHERWISE it SHALL redirect to the configured sign-on error page.
    plain_text: >
      A correct user name and password signs the visitor in and returns them to the page they wanted; a wrong one sends them to an error page.
    technical_note: >
      validateSignOn calls SignOnEJB.authenticate; on success sets session attributes j_signon_username and j_signon=true and redirects to j_signon_original_url. Failed login has no retry limit or lockout in this module.
    interface: false
    confidence: high
    confidence_basis: Filter and session bean both implement the path, clear and consistent.
    risk_class: regulated
    basis: Authentication outcome handling.
    traces:
      - path: legacy-source/app/src/components/signon/src/com/sun/j2ee/blueprints/signon/web/SignOnFilter.java
        line_start: 188
