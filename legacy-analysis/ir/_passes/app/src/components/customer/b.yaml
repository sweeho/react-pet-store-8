  - record_key: CUSTACC-REQ-0002
    kind: requirement
    capability_key: customer-accounts
    requirement: >
      The system SHALL, on creating a customer, automatically create an account in status "active" and a profile with default preferences, and attach both to the customer.
    confidence: high
    confidence_basis: >
      Enforced in the creation hook of the customer bean, with the defaults and status constants declared in the home interfaces; two separate places.
    risk_class: operational
    basis: >
      ejbPostCreate looks up and creates Account(Active) and Profile(defaults).
    plain_text: >
      A newly registered customer starts with an active account and standard preferences without any extra step.
    technical_note: >
      CustomerEJB.ejbPostCreate uses JNDI java:comp/env/ejb/Account and ejb/Profile. A naming failure is rethrown as CreateException, so customer creation fails as a whole.
    interface: false
    traces:
      - path: legacy-source/app/src/components/customer/src/com/sun/j2ee/blueprints/customer/ejb/CustomerEJB.java
        line_start: 74
        line_end: 89
        excerpt: |
          public void ejbPostCreate(String userId) throws CreateException {
              try {
              InitialContext ic = new InitialContext();
              AccountLocalHome alh = (AccountLocalHome) ic.lookup("java:comp/env/ejb/Account");
              AccountLocal account = alh.create(AccountLocalHome.Active);
              setAccount(account);
              ProfileLocalHome plh = (ProfileLocalHome) ic.lookup("java:comp/env/ejb/Profile");
              ProfileLocal profile = plh.create(ProfileLocalHome.DefaultPreferredLanguage,
              ProfileLocalHome.DefaultFavoriteCategory, ProfileLocalHome.DefaultMyListPreference,
              ProfileLocalHome.DefaultBannerPreference);
              setProfile(profile);
              } catch (NamingException ne) {
                  throw new CreateException ("could not lookup ejb. Exception is " + ne.getMessage());
              }
          }
    stack_metadata:
      framework: EJB 2.x CMP
      ejb.bean: CustomerEJB
