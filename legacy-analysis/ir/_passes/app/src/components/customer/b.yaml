findings:
  - kind: ambiguity
    path: legacy-source/app/src/components/customer/src/com/sun/j2ee/blueprints/customer/account/ejb/AccountEJB.java
    description: >
      No duplicate-account or duplicate-user-id rule is implemented in this module; uniqueness relies only on the primary key. The effect of a "disabled" status (e.g. refusing sign-on) is not visible here. A human should confirm where those rules live. Also, my working tree lost the legacy-source directory mid-run, so line numbers were derived from my earlier reads of these files rather than re-verified.
