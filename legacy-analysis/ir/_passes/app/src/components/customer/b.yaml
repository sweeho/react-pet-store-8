    kind: entity
    capability_key: customer-accounts
    requirement: >
      The system SHALL identify each customer by a unique user identifier supplied at creation, and SHALL link each customer to exactly one account and one profile.
    confidence: high
    confidence_basis: >
      The identifier is the declared primary key in ejb-jar.xml and is the only create argument in the bean class; the two links are declared in both places. Two places, but both in the same component.
    risk_class: operational
    basis: >
      Customer entity has userId as primary key field and two relationships (account, profile) set on creation.
    plain_text: >
      Every customer has a unique user name and owns one account record and one preferences record.
    technical_note: >
      CustomerEJB (CMP 2.x entity, prim-key String = userId). CMR fields account and profile set in ejbPostCreate.
