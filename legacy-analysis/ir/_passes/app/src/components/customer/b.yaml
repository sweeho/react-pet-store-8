      A new account gets blank contact and payment details unless they are provided at the same time.
    technical_note: >
      AccountEJB.ejbPostCreate(status) looks up ejb/ContactInfo and ejb/CreditCard and creates them; a naming failure becomes CreateException. The three-argument variant just sets them.
