records:
  - record_key: CUSTACC-BR-0001
    kind: business-rule
    capability_key: customer-accounts
    requirement: The system SHALL, when a customer is created, automatically create an account with status "active" and attach it to the customer.
    confidence: high
    confidence_basis: Enforced in the creation hook of the customer bean and the status constant in the account home interface (two places); no test or document seen.
    risk_class: operational
    basis: CustomerEJB.ejbPostCreate calls AccountLocalHome.create(Active); the constant Active = "active" is defined in AccountLocalHome.
    plain_text: Every new customer automatically gets an account that starts out active.
    technical_note: CustomerEJB.ejbPostCreate looks up ejb/Account via JNDI and creates it; a naming failure is rethrown as CreateException.
    interface: false
    traces:
      - path: legacy-source/app/src/components/customer/src/com/sun/j2ee/blueprints/customer/ejb/CustomerEJB.java
        line_start: 78
        line_end: 79
        excerpt: |
          AccountLocal account = alh.create(AccountLocalHome.Active);
                  setAccount(account);
      - path: legacy-source/app/src/components/customer/src/com/sun/j2ee/blueprints/customer/account/ejb/AccountLocalHome.java
        line_start: 48
        line_end: 49
        excerpt: |
          public static final String Active = "active";
              public static final String Disabled = "disabled";
    stack_metadata:
      framework: EJB 2.0 CMP
      ejb.bean: CustomerEJB
  - record_key: CUSTACC-BR-0002
    kind: business-rule
    capability_key: customer-accounts
    requirement: The system SHALL, when a customer is created, create a profile with preferred language "en_US", no favourite category, and the my-list and banner preferences both enabled.
    confidence: high
    confidence_basis: Defaults are declared as constants in the profile home interface and applied in the customer creation hook (two places). Not covered by any test or document seen.
    risk_class: presentational
    basis: CustomerEJB.ejbPostCreate passes ProfileLocalHome defaults to create; constants declared in ProfileLocalHome.
    plain_text: A new customer starts with English (US) as the language, no favourite category, and the "my list" and banner options switched on.
    technical_note: Defaults in ProfileLocalHome constants; applied by CustomerEJB.ejbPostCreate. ProfileInfo holds default flags as false, differing from these constants; its use is not established in this module.
    interface: false
