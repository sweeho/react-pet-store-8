  - record_key: CUSTACC-BR-0003
    kind: business-rule
    capability_key: customer-accounts
    requirement: The system SHALL, when an account is created without contact and card details, create an empty contact record and an empty credit card record and attach both to the account.
    confidence: medium
    confidence_basis: One clear place (AccountEJB.ejbPostCreate); no second source.
    risk_class: operational
    basis: AccountEJB.ejbPostCreate(String) creates ContactInfo and CreditCard through their homes and links them.
    plain_text: A new account begins with blank contact details and a blank credit card entry that the customer fills in later.
    technical_note: JNDI lookups of ejb/ContactInfo and ejb/CreditCard; NamingException becomes CreateException. A second create variant accepts pre-built contact info and card.
    interface: false
    traces:
      - path: legacy-source/app/src/components/customer/src/com/sun/j2ee/blueprints/customer/account/ejb/AccountEJB.java
        line_start: 80
        line_end: 92
        excerpt: |
          public void ejbPostCreate(String status) throws CreateException {
                  setStatus(status);
                  try {
                      InitialContext ic = new InitialContext();
                      ContactInfoLocalHome cih = (ContactInfoLocalHome) ic.lookup("java:comp/env/ejb/ContactInfo");
                      ContactInfoLocal contactInfo = cih.create();
                      setContactInfo(contactInfo);
                      CreditCardLocalHome cch = (CreditCardLocalHome) ic.lookup("java:comp/env/ejb/CreditCard");
                      CreditCardLocal creditCard = cch.create();
                      setCreditCard(creditCard);
                  } catch (javax.naming.NamingException ne) {
                      throw new CreateException("ContactInfoEJB error: naming exception looking up contact info or credit card");
    stack_metadata:
      framework: EJB 2.0 CMP
      ejb.bean: AccountEJB
  - record_key: CUSTACC-BR-0004
    kind: business-rule
    capability_key: customer-accounts
    requirement: The system SHALL delete a customer's account, profile, contact details, address and credit card record when the owning record is deleted.
    confidence: medium
    confidence_basis: Declared once in the deployment descriptor as cascade-delete on every relationship; bean ejbRemove methods are empty. Whether any caller removes customers is not visible here.
    risk_class: regulated
    basis: Five relationships in ejb-jar.xml carry cascade-delete on the child role (account, address, profile, contact info, credit card).
    plain_text: Deleting a customer also deletes everything stored about them, including contact details, address, preferences and card data.
    technical_note: Container-managed cascade-delete in ejb-jar.xml; ejbRemove bodies are empty. Reachability of customer removal is not established in this module.
    interface: false
    traces:
      - path: legacy-source/app/src/components/customer/src/ejb-jar.xml
        line_start: 264
        line_end: 370
        excerpt: |
          <relationships>
          <cascade-delete />
          </relationships>
    stack_metadata:
      framework: EJB 2.0 CMP
      db.object: Customer, Account, Profile, ContactInfo, Address, CreditCard
