    plain_text: A customer is identified by a unique user name and has one account and one preferences profile.
    technical_note: CustomerEJB prim-key userId; AccountEJB has CMR to ContactInfo and CreditCard; ContactInfo has fields givenName, familyName, telephone, email and links to Address (street 1/2, city, state, zip, country).
