  - record_key: CUSTACC-BR-0005
    kind: business-rule
    capability_key: sign-on-security
    requirement: The system SHALL NOT restrict access by role to the customer, profile, contact info, address and credit card operations at the component level.
    confidence: medium
    confidence_basis: One clear place; unchecked method permissions in the descriptor. Authorisation may be applied by callers, which this pass cannot see. Filed under sign-on-security as the nearest key.
    risk_class: regulated
