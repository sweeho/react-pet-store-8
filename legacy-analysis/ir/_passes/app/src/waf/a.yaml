  - record_key: LOC-REQ-0005
    kind: requirement
    capability_key: localization
    requirement: >
      The system SHALL format currency and numbers according to a given locale and a given number of decimal places.
    confidence: medium
    confidence_basis: >
      One clear place (utility); callers were not traced in this shard.
    risk_class: financial
    basis: >
      I18nUtil.formatCurrency / formatNumber set minimum and maximum fraction digits to the precision on a locale-specific formatter, optionally applying a pattern.
    plain_text: >
      Prices and numbers are shown using the conventions of the customer's language and region.
    technical_note: >
      Overloads with a pattern call applyPattern after setting digits, so the pattern overrides the precision. Uses double arithmetic and the JDK default rounding mode.
    interface: false
    traces:
      - path: legacy-source/app/src/waf/src/controller/com/sun/j2ee/blueprints/waf/util/I18nUtil.java
        line_start: 413
        line_end: 418
        excerpt: |
          public static String formatCurrency(double amount, int precision, Locale locale){
                NumberFormat nf = NumberFormat.getCurrencyInstance(locale);
                nf.setMinimumFractionDigits(precision);
                nf.setMaximumFractionDigits(precision);
                return nf.format(amount);
          }
    stack_metadata:
      framework: WAF util

