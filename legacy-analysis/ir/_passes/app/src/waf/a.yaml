records:
  - record_key: LOC-REQ-0001
    kind: requirement
    capability_key: localization
    requirement: >
      The system SHALL assign the configured default locale (en_US) to a user session on its first request when no locale is yet held for that session.
    confidence: high
    confidence_basis: >
      Enforced in the servlet request path and the default is declared in deployment configuration (two places).
    risk_class: presentational
    basis: >
      The front controller sets the session locale to the default when absent; the default comes from the servlet init parameter.
    plain_text: >
      A visitor who has not chosen a language sees the site in US English.
    technical_note: >
      MainServlet.doProcess seeds session attribute WebKeys.LOCALE from init-param default_locale (en_US in web.xml).
    interface: false
    traces:
      - path: legacy-source/app/src/waf/src/controller/com/sun/j2ee/blueprints/waf/controller/web/MainServlet.java
        line_start: 111
        line_end: 113
        excerpt: |
          if (request.getSession().getAttribute(WebKeys.LOCALE) == null) {
              request.getSession().setAttribute(WebKeys.LOCALE, defaultLocale);
          }
      - path: legacy-source/app/src/waf/src/docroot/WEB-INF/web.xml
        line_start: 57
        line_end: 60
        excerpt: |
          <init-param>
            <param-name>default_locale</param-name>
            <param-value>en_US</param-value>
          </init-param>
    stack_metadata:
      framework: WAF MainServlet
      session.scope: session

  - record_key: LOC-REQ-0002
    kind: requirement
    capability_key: localization
    requirement: >
      The system SHALL change the session locale to the one named in the "locale" request parameter when that value parses to a locale, and SHALL otherwise fail the request with an "Unable to change language" error.
    confidence: high
    confidence_basis: >
      Action code, URL mapping and a demo page all show the behaviour.
    risk_class: presentational
    basis: >
      The change-locale action parses the parameter, stores the locale in the session and raises an event; null parse results in an exception.
    plain_text: >
      A user can switch the display language. If the requested language is not understood, the switch is refused with an error.
    technical_note: >
      ChangeLocaleHTMLAction writes session attribute com.sun.j2ee.blueprints.waf.LOCALE, which is a different key string from the one MainServlet reads via WebKeys.LOCALE unless WebKeys defines them identically (not verified in this shard's reading of WebKeys). Mapped at changelocale.do and changeclientchachelinklocale.do (sic).
    interface: false
    traces:
      - path: legacy-source/app/src/waf/src/controller/com/sun/j2ee/blueprints/waf/controller/web/action/actions/ChangeLocaleHTMLAction.java
        line_start: 241
        line_end: 251
        excerpt: |
          String localeString = request.getParameter("locale");
          Locale locale = I18nUtil.getLocaleFromString(localeString);
          if (locale != null) {
              session.setAttribute(LOCALE,locale);
              return new ChangeLocaleEvent(locale);
          } else {
              throw new HTMLActionException("ChangeLocaleAction: Unable to change language to " + localeString);
          }
      - path: legacy-source/app/src/waf/src/docroot/WEB-INF/mappings.xml
        line_start: 48
        line_end: 50
        excerpt: |
          <url-mapping url="changelocale.do" screen="locale_change_success.screen" >
              <web-action-class>com.sun.j2ee.blueprints.waf.controller.web.action.actions.ChangeLocaleHTMLAction</web-action-class>
          </url-mapping>
    stack_metadata:
      framework: WAF
      session.scope: session

  - record_key: LOC-BR-0003
    kind: business-rule
    capability_key: localization
    requirement: >
      GIVEN a locale string, the system SHALL interpret "default" as the platform default locale, "language_country" as a locale with that language and country, and SHALL reject (return no locale for) a null string or one without an underscore. A third "_variant" segment is never applied.
    confidence: medium
    confidence_basis: >
      One clear place; the variant handling is dead (variantIndex is never assigned), derived by reading the code, not tested.
    risk_class: presentational
    basis: >
      I18nUtil.getLocaleFromString parsing logic.
    plain_text: >
      Language choices are written like "ja_JP". Anything not in that form is not accepted.
    technical_note: >
      variantIndex is initialised to -1 and never reassigned, so variant is always null. For "a_b_c" country becomes null because countryIndex != -1 skips the country assignment, yielding new Locale("a", null), which throws NullPointerException in the JDK constructor.
    interface: false
    traces:
      - path: legacy-source/app/src/waf/src/controller/com/sun/j2ee/blueprints/waf/util/I18nUtil.java
        line_start: 481
        line_end: 507
        excerpt: |
          if (localeString == null) return null;
          if (localeString.toLowerCase().equals("default")) return Locale.getDefault();
          int languageIndex = localeString.indexOf('_');
          if (languageIndex  == -1) return null;
          int variantIndex = -1;
          if (countryIndex != -1) countryIndex = localeString.indexOf('_', countryIndex +1);
    stack_metadata:
      framework: WAF util

  - record_key: LOC-BR-0004
