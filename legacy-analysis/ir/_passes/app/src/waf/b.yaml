suspected_defects:
  - capability_key: localization
    record_keys: [LOC-REQ-0003]
    severity: medium
    category: other
    title: Event mapping names a class that does not exist
    description: >
      mappings.xml maps event class waf.event.events.ChangeLocaleEvent but the class is waf.event.impl.ChangeLocaleEvent, and RequestProcessor looks mappings up by exact class name, so the business-tier locale action is never attached.
    traces:
      - path: legacy-source/app/src/waf/src/docroot/WEB-INF/mappings.xml
        line_start: 43
        line_end: 46
      - path: legacy-source/app/src/waf/src/controller/com/sun/j2ee/blueprints/waf/event/impl/ChangeLocaleEvent.java
        line_start: 48
        line_end: 50
  - capability_key: localization
    record_keys: [LOC-REQ-0003]
    severity: low
    category: other
    title: Locale parser ignores variants and misreads three-part locales
    description: >
      getLocaleFromString never sets variantIndex, so a variant is always dropped; for a three-part value the country stays null.
    traces:
      - path: legacy-source/app/src/waf/src/controller/com/sun/j2ee/blueprints/waf/util/I18nUtil.java
        line_start: 168
        line_end: 196
  - capability_key: localization
    record_keys: [LOC-REQ-0002]
    severity: low
    category: other
    title: Offered locales not backed by screen definitions
    description: >
      The change-locale form offers de_DE and zh_CN, but the template servlet is configured only for en_US, so these silently show default-locale screens.
    traces:
      - path: legacy-source/app/src/waf/src/docroot/changelocale.jsp
        line_start: 51
        line_end: 54
