  - capability_key: sign-on-security
    record_keys: [SGN-REQ-0001]
    severity: high
    category: unreachable-branch
    title: requiresSignin flag parsed into a variable that is never set
    description: >
      The mapping loader declares requiresSignin and its string but never reads the attribute from the element, so sign-in protection may not be enforced.
