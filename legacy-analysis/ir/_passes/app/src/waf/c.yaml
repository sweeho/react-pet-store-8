records:
  - record_key: LOCAL-REQ-0001
    kind: requirement
    capability_key: localization
    requirement: >
      The system SHALL let a user change the session language by submitting a locale value, and SHALL reject the request with an error when the value cannot be resolved to a locale.
    confidence: medium
    confidence_basis: >
      One clear place (the web action) plus the mapping that wires it; the helper that resolves the locale string (getLocaleFromString) was not read in full, so null-versus-default behaviour for bad input is inferred.
    risk_class: presentational
    basis: The change-locale action reads the "locale" parameter, stores it on the session and raises an event, or throws when no locale results.
    plain_text: A shopper can pick a different language and the site remembers it for the rest of the visit; an unusable choice produces an error.
    technical_note: ChangeLocaleHTMLAction.perform stores the Locale in the HTTP session and returns a ChangeLocaleEvent. The EJB action ChangeLocaleEJBAction copies it into the state machine attribute "locale". Mapped to changelocale.do.
    interface: false
    traces:
      - path: legacy-source/app/src/waf/src/controller/com/sun/j2ee/blueprints/waf/controller/web/action/actions/ChangeLocaleHTMLAction.java
        line_start: 73
        line_end: 83
        excerpt: |
          String localeString = request.getParameter("locale");
                  Locale locale = I18nUtil.getLocaleFromString(localeString);
                  //MessageResources messages = getResources();
                  HttpSession session = request.getSession();

                  if (locale != null) {
                      session.setAttribute(LOCALE,locale);
                      return new ChangeLocaleEvent(locale);
                  } else {
                      throw new HTMLActionException("ChangeLocaleAction: Unable to change language to " + localeString);
                  }
      - path: legacy-source/app/src/waf/src/controller/com/sun/j2ee/blueprints/waf/controller/ejb/action/actions/ChangeLocaleEJBAction.java
        line_start: 53
        line_end: 55
        excerpt: |
          ChangeLocaleEvent ce = (ChangeLocaleEvent)e;
                machine.setAttribute("locale", ce.getLocale());
                return null;
    stack_metadata:
      framework: Sun BluePrints WAF
      ejb.bean: EJBController

  - record_key: LOCAL-REQ-0002
    kind: requirement
    capability_key: localization
    requirement: >
      GIVEN a session with no language set, WHEN any controller request arrives, THEN the system SHALL set the session language to the configured default (en_US).
    confidence: high
    confidence_basis: Servlet code sets the default and web.xml supplies the en_US init parameter (code plus configuration).
    risk_class: presentational
    basis: MainServlet defaults the session locale from the default_locale init parameter.
    plain_text: Visitors who have not chosen a language see the site in US English.
    technical_note: MainServlet.doProcess sets WebKeys.LOCALE when absent; default_locale init-param in web.xml is en_US.
    interface: false
    traces:
      - path: legacy-source/app/src/waf/src/controller/com/sun/j2ee/blueprints/waf/controller/web/MainServlet.java
        line_start: 111
        line_end: 113
        excerpt: |
          if (request.getSession().getAttribute(WebKeys.LOCALE) == null) {
                      request.getSession().setAttribute(WebKeys.LOCALE, defaultLocale);
                  }
      - path: legacy-source/app/src/waf/src/docroot/WEB-INF/web.xml
        line_start: 57
        line_end: 60
        excerpt: |
          <init-param>
                <param-name>default_locale</param-name>
                <param-value>en_US</param-value>
              </init-param>
    stack_metadata:
      framework: Sun BluePrints WAF
      session.scope: HttpSession

  - record_key: LOCAL-REQ-0003
    kind: requirement
    capability_key: localization
    requirement: >
      The system SHALL choose the screen definitions for a page using the locale given in the request parameter if present, otherwise the session locale, and SHALL fall back to the default locale when no definitions exist for the chosen locale or for the requested screen.
    confidence: high
    confidence_basis: Both the locale-level and screen-level fallbacks are explicit in the servlet; locale list is configured in web.xml (only en_US loaded in this module).
    risk_class: presentational
    basis: TemplateServlet.process precedence and fallback.
    plain_text: Each page is shown in the language the user just asked for, else the language saved for their visit; if that language has no version of the page, the English page is shown.
    technical_note: TemplateServlet reads "locale" parameter, then session, then looks up allScreens map; missing screen falls back to defaultLocale screens. A missing definition in default locale as well yields NullPointerException (localeScreens may be null) - see suspected defects. The web.xml "locales" init-param lists only en_US, so ja/zh definitions are not loaded by this module's configuration.
    interface: false
    traces:
      - path: legacy-source/app/src/waf/src/view/template/com/sun/j2ee/blueprints/waf/view/template/TemplateServlet.java
        line_start: 157
        line_end: 166
        excerpt: |
          String languageParam = request.getParameter("locale");
                  // The language when specified as a parameter overrides the language set in the session
                  if (languageParam != null) {
                      localeString = languageParam;
                  } else if (request.getSession().getAttribute(WebKeys.LOCALE) != null) {
                      localeString = ((Locale)request.getSession().getAttribute(WebKeys.LOCALE)).toString();
                  }
                  if (allScreens.get(localeString) == null) {
                     localeString = defaultLocale;
                  }
      - path: legacy-source/app/src/waf/src/view/template/com/sun/j2ee/blueprints/waf/view/template/TemplateServlet.java
        line_start: 236
        line_end: 241
        excerpt: |
          // default to the default locale screen if it was not defined in the locale specific definitions
                      if (screen == null) {
                          System.err.println("Screen not Found loading default from " + defaultLocale);
                          localeScreens = (Screens)allScreens.get(defaultLocale);
                          screen = (Screen)localeScreens.getScreen(screenName);
                      }
    stack_metadata:
      framework: Sun BluePrints WAF
      jsp.page: template.jsp

  - record_key: LOCAL-REQ-0004
    kind: requirement
    capability_key: localization
    requirement: >
      The system SHALL offer a language chooser with US English (en_US), German (de_DE), Japanese (ja_JP) and Simplified Chinese (zh_CN).
    confidence: low
    confidence_basis: Single demo JSP in the framework sample; the rest of the app was not part of this shard and may use its own chooser. Note de_DE has no screen definitions here.
    risk_class: presentational
    basis: Static option list in changelocale.jsp.
    plain_text: The language picker lists English, German, Japanese and Simplified Chinese.
    technical_note: changelocale.jsp select named "locale", posts to changelocale.do. Sample/demo page of the framework.
    interface: false
    traces:
      - path: legacy-source/app/src/waf/src/docroot/changelocale.jsp
        line_start: 48
        line_end: 55
        excerpt: |
          <form action="changelocale.do">
           Set Locale to:
           <select name="locale">
            <option value="en_US">US English</option>
            <option value="de_DE">German</option>
            <option value="ja_JP">Japanese</option>
            <option value="zh_CN">Simplified Chinese</option>
           </select>
    stack_metadata:
