suspected_defects:
  - capability_key: sign-on-security
    record_keys: [LOCAL-REQ-0003]
    severity: low
    category: error-swallowed
    title: Missing default-locale definitions cause a null dereference
    description: >
      When the requested screen is absent for the chosen locale, the fallback fetches default-locale screens without a null check; if default-locale definitions failed to load, the request fails with a NullPointerException. Likewise a PREVIOUS request with no previous screen in the session dereferences null.
    traces:
      - path: legacy-source/app/src/waf/src/view/template/com/sun/j2ee/blueprints/waf/view/template/TemplateServlet.java
        line_start: 237
        line_end: 241
  - capability_key: order-processing-workflow
    record_keys: [ORDPROC-WKF-0001]
    severity: medium
    category: error-swallowed
    title: Action or flow-handler load failures are only printed
    description: >
      If an action class cannot be loaded the request proceeds silently with no action; if a flow handler fails, the error is printed and the screen stays null, so the user gets a generic "Screen not found" runtime error. Similarly the state machine prints and skips an action it cannot load, returning a null response.
    traces:
      - path: legacy-source/app/src/waf/src/controller/com/sun/j2ee/blueprints/waf/controller/web/RequestProcessor.java
        line_start: 158
        line_end: 162
      - path: legacy-source/app/src/waf/src/controller/com/sun/j2ee/blueprints/waf/controller/web/flow/ScreenFlowManager.java
        line_start: 148
        line_end: 150
      - path: legacy-source/app/src/waf/src/controller/com/sun/j2ee/blueprints/waf/controller/ejb/StateMachine.java
        line_start: 104
        line_end: 106
  - capability_key: localization
    record_keys: [LOCAL-REQ-0004, LOCAL-REQ-0003]
    severity: low
    category: other
    title: Chooser offers German but no German screens, and only en_US is configured
    description: >
      The chooser lists de_DE and the web descriptor loads only en_US screen definitions, so any non-English choice silently falls back to English in this module.
    traces:
      - path: legacy-source/app/src/waf/src/docroot/changelocale.jsp
        line_start: 52
        line_end: 52
      - path: legacy-source/app/src/waf/src/docroot/WEB-INF/web.xml
        line_start: 69
        line_end: 72

findings:
  - kind: ambiguity
    path: legacy-source/app/src/waf/src/docroot/WEB-INF/xml/requestmappings.xml
    description: >
      requestmappings.xml declares requiresSignin URL mappings and a sign-in/sign-out flow that point to petstore handler classes outside this module, and no code here reads that file (MainServlet reads mappings.xml). Whether it is live or sample leftover, and the sign-in enforcement rule, need the petstore shard or an SME to settle.
  - kind: ambiguity
    path: legacy-source/app/src/waf/src/docroot/WEB-INF/mappings.xml
    description: >
      mappings.xml maps changelocale.do to screen "locale_change_success.screen"; the sample ClientStateFlowHandler deserialises Base64 Java-serialised objects from request parameters (untrusted-input deserialisation). No business rule extracted; flagged for security review.
