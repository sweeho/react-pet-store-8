  - record_key: ORDPROC-REQ-0003
    kind: requirement
    capability_key: order-processing-workflow
    requirement: >
      The system SHALL let a page transition be decided at run time by a flow handler whose returned result maps to a screen, and SHALL treat the result itself as the screen name when no result mapping exists.
    confidence: medium
    confidence_basis: One clear place in code (ScreenFlowManager), exercised by the sample mapping; no test.
    risk_class: operational
    basis: getResultScreen with fallback to flowResult.
    plain_text: Where the next page depends on the outcome of the step, the outcome selects the page.
    technical_note: Request-processing mappings in the separate petstore module (not read) supply the handler-result maps; this module only ships ClientStateFlowHandler.
    interface: false
    traces:
      - path: legacy-source/app/src/waf/src/controller/com/sun/j2ee/blueprints/waf/controller/web/flow/ScreenFlowManager.java
        line_start: 141
        line_end: 147
        excerpt: |
          handler.doStart(request);
                              String flowResult = handler.processFlow(request);
                              handler.doEnd(request);
                              currentScreen = urlMapping.getResultScreen(flowResult);
                              // if there were no screens by the id then assume that the result was
                              //the screen itself
                              if (currentScreen == null) currentScreen = flowResult;
