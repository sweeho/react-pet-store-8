  - record_key: SIGN-REQ-0001
    kind: requirement
    capability_key: sign-on-security
    requirement: >
      The system SHALL expire an idle web session after 30 minutes.
    confidence: medium
    confidence_basis: One declarative place (web.xml); no code or test restates it.
    risk_class: operational
    basis: Session timeout declared in deployment descriptor.
    plain_text: A visit that is idle for 30 minutes is ended.
    technical_note: web.xml session-config session-timeout 30 (minutes).
    interface: false
    traces:
      - path: legacy-source/app/src/waf/src/docroot/WEB-INF/web.xml
        line_start: 100
        line_end: 102
        excerpt: |
          <session-config>
              <session-timeout>30</session-timeout>
            </session-config>
    stack_metadata:
      framework: Servlet 2.3
      session.scope: HttpSession

  - record_key: ORDPROC-WKF-0001
    kind: workflow
    capability_key: order-processing-workflow
    requirement: >
      The system SHALL process each user-initiated request as: map the request URL to a configured entry, run the configured web action (which may produce an event), hand the event to the business tier through a session-scoped controller, then forward to the resulting screen.
    confidence: high
    confidence_basis: Seen in RequestProcessor, MainServlet, ScreenFlowManager and the mappings.xml configuration (code plus configuration). This is generic framework plumbing; filed under the closest listed capability, since none covers request routing.
    risk_class: operational
    basis: processRequest then forwardToNextScreen sequence in MainServlet.doProcess.
    plain_text: Each click is looked up in a routing table, may trigger a business action, and then the right page is displayed.
    technical_note: RequestProcessor.processRequest takes the last path segment of the URI as the mapping key; if the mapping names an action class it is instantiated by reflection, doStart/perform/doEnd are called, and a returned Event is dispatched via WebController.handleEvent. ScreenFlowManager.forwardToNextScreen then forwards to the mapped screen. Filed under order-processing-workflow as nearest home (no routing capability exists).
    interface: false
    traces:
      - path: legacy-source/app/src/waf/src/controller/com/sun/j2ee/blueprints/waf/controller/web/RequestProcessor.java
        line_start: 126
        line_end: 143
        excerpt: |
          URLMapping urlMapping = getURLMapping(selectedURL);
                  HTMLAction action = getAction(urlMapping);
                  if (action != null) {
                      action.setServletContext(request.getSession().getServletContext());
                      action.doStart(request);
                      ev = action.perform(request);
                      EventResponse eventResponse = null;
                      if (ev != null) {
      - path: legacy-source/app/src/waf/src/controller/com/sun/j2ee/blueprints/waf/controller/web/MainServlet.java
        line_start: 115
        line_end: 116
        excerpt: |
          getRequestProcessor().processRequest(request);
                           getScreenFlowManager().forwardToNextScreen(request,response);
    stack_metadata:
      framework: Sun BluePrints WAF
      ejb.bean: EJBController

  - record_key: ORDPROC-REQ-0002
    kind: requirement
    capability_key: order-processing-workflow
    requirement: >
      The system SHALL serialise business-tier event handling per user session so that concurrent requests from one session do not reach the stateful controller at the same time, and SHALL run each event inside a transaction.
    confidence: high
    confidence_basis: Synchronized proxy in code, container-transaction Required in ejb-jar.xml, and a code comment stating the intent.
    risk_class: operational
    basis: DefaultWebController.handleEvent is synchronized; processEvent has trans-attribute Required.
    plain_text: Actions from one shopper are handled one at a time and each is all-or-nothing.
    technical_note: EJBController is a stateful session bean with container-managed transactions; processEvent is Required.
    interface: false
    traces:
      - path: legacy-source/app/src/waf/src/controller/com/sun/j2ee/blueprints/waf/controller/web/DefaultWebController.java
        line_start: 87
        line_end: 91
        excerpt: |
          public synchronized EventResponse handleEvent(Event ev, HttpSession session)
                  throws EventException {
                      DefaultComponentManager cm = (DefaultComponentManager)session.getAttribute(WebKeys.COMPONENT_MANAGER);
                      EJBControllerLocal controllerEJB =cm.getEJBController(session);
                      return controllerEJB.processEvent(ev);
      - path: legacy-source/app/src/waf/src/ejb-jar.xml
        line_start: 72
        line_end: 72
        excerpt: |
          <trans-attribute>Required</trans-attribute>
    stack_metadata:
      ejb.bean: EJBController
      ejb.transaction: Required

  - record_key: SIGN-REQ-0002
    kind: requirement
    capability_key: sign-on-security
    requirement: >
      GIVEN a request that raises an exception, WHEN the exception type (or a supertype) is mapped to a screen, THEN the system SHALL show that screen; otherwise the system SHALL fail the request with a servlet error.
    confidence: medium
    confidence_basis: Code and one mapping entry; the mapping only names the petstore GeneralFailureException, which lives outside this module.
    risk_class: operational
    basis: ScreenFlowManager.getExceptionScreen matches by isAssignableFrom; MainServlet forwards or rethrows.
    plain_text: When something goes wrong the user sees a designated error page; unexpected problems end as a generic server error.
    technical_note: Filed under sign-on-security as the nearest home (the generic error/sign-in screen mapping); not a security rule as such.
    interface: false
    traces:
      - path: legacy-source/app/src/waf/src/controller/com/sun/j2ee/blueprints/waf/controller/web/MainServlet.java
        line_start: 117
        line_end: 127
        excerpt: |
          } catch (Throwable ex) {
                      String className = ex.getClass().getName();
                      String nextScreen = getScreenFlowManager().getExceptionScreen(ex);
                      // put the exception in the request
                      request.setAttribute("javax.servlet.jsp.jspException", ex);
                      if (nextScreen == null) {
                          // send to general error screen
                          ex.printStackTrace();
                          throw new ServletException("MainServlet: unknown exception: " + className);
                      }
                      context.getRequestDispatcher(nextScreen).forward(request, response);
      - path: legacy-source/app/src/waf/src/docroot/WEB-INF/mappings.xml
        line_start: 57
