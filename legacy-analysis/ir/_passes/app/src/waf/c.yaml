  - record_key: CATBRW-REQ-0001
    kind: requirement
    capability_key: catalog-browsing
    requirement: >
      The system SHALL render every page from a screen definition combining a template with named parts (title, banner, sidebar, body, footer), and SHALL support a "previous screen" request that re-displays the last screen shown in the session.
    confidence: medium
    confidence_basis: Code in TemplateServlet plus screendefinitions XML; filed under catalog-browsing as nearest home for generic page composition. Parameter/attribute restoration is disabled by configuration (false).
    risk_class: presentational
    basis: Screen definitions and PREVIOUS handling.
    plain_text: Every page has the same layout of banner, side menu, body and footer, and a user can be returned to the page they were last on.
    technical_note: TemplateServlet maps *.screen; screen named PREVIOUS reloads the session-stored last screen. cache_previous_screen_attributes/parameters are false in web.xml, so request data is not restored.
    interface: false
    traces:
