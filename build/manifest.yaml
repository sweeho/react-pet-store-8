        - localization
    canvas:
      problem: "Shoppers use English, Japanese and Chinese; the storefront must pick, switch and apply a locale consistently across screens, catalog text, number formats, mail and per-locale limits."
      solution: "Build session locale handling, a language switch, locale-keyed catalog and screen text, request encoding, locale number formatting and the common page layout."
      userStories:
        - "As a shopper, I want to switch language, so that I can browse and order in English, Japanese or Chinese."
      acceptanceCriteria:
        - "Locale change — Given a shopper on any page, when they choose a locale, then later pages render in that locale"
        - "Page layout — Given any screen, then it shows a title, banner, body and footer from the common template"
      outOfScope:
        - "Locale-specific approval limits (owned by order-approval)"
        - "Catalog schema (owned by catalog-browsing)"
      risksAssumptions: []
      techStack: []
      affectedCode: []
      screens:
        - "Common page layout: every page shares a header banner, body area and footer assembled from a template with title, banner, body and footer parts per screen and locale"
