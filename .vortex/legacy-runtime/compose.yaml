# Legacy Java Pet Store 1.3.2 on the J2EE 1.3.1 Reference Implementation.
# The RI bundles its own Cloudscape database and JMS provider, so no separate
# database service is needed. See README.md for the two host directories this needs.
services:
  legacy:
    image: eclipse-temurin:8-jdk
    working_dir: /work
    # A J2EE RI from 2003 binds its web container to all interfaces on 8000.
    ports:
      - "${LEGACY_PORT:-8000}:8000"
    environment:
      J2EE_HOME: /opt/j2sdkee1.3.1
    volumes:
      # Legacy source, mounted read-only; the build copies it to /work.
      - ${LEGACY_SOURCE_DIR:-../../legacy-source}:/legacy-source:ro
      # Extracted Sun J2EE 1.3.1 RI (not in the repository, licence required).
      - ${J2EE_RI_DIR:?set J2EE_RI_DIR to the extracted j2sdkee1.3.1 directory}:/opt/j2sdkee1.3.1
      - ./entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/bash", "/entrypoint.sh"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fs -o /dev/null http://localhost:8000/petstore/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 120s
