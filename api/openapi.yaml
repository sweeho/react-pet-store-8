# EXTRACTED FROM LEGACY SOURCE — evidence of what exists, not a build target. Where this disagrees with a capability delta spec, the delta spec wins.
# Source: web.xml and mappings.xml of the petstore, admin and supplier web modules.
# The storefront is a form-driven Struts-like front controller (*.do actions render *.screen pages),
# not a JSON API. Paths below describe the legacy HTTP surface as it exists; request bodies are
# form-encoded or the admin XML envelope. Nothing here is a design for the rebuild.
openapi: 3.0.3
info:
  title: Java Pet Store 1.3.2 legacy HTTP surface
  version: legacy-1.3.2
  description: >
    Three web modules: storefront (petstore, session timeout 15 min), admin (/admin, FORM login,
    role administrator, session timeout 54 min) and supplier (/supplier, FORM login, role
    administrator, session timeout 54 min). Timeout values conflict with other records; see the
    sign-on-security delta spec.
servers:
  - url: http://localhost:8080/petstore
    description: Storefront context root petstore; admin and supplier paths below are under /admin and /supplier of the same host (context roots admin, supplier)
tags:
  - name: storefront
  - name: admin
  - name: supplier
paths:
  /cart.do:
    post:
      tags: [storefront]
      summary: Add, update or remove cart items, then render cart.screen
      description: Shopping cart actions (capability shopping-cart). Empty cart shows a message and a Check Out link.
      responses:
        "200": { description: cart.screen rendered }
  /category.screen:
    get:
      tags: [storefront]
      summary: Category page
      parameters:
        - { name: category_id, in: query, schema: { type: string } }
      responses:
        "200": { description: Products of the category in the session locale }
  /product.screen:
    get:
      tags: [storefront]
      summary: Product page
      parameters:
        - { name: product_id, in: query, schema: { type: string } }
      responses:
        "200": { description: Items of the product, paged }
  /item.screen:
    get:
      tags: [storefront]
      summary: Item detail page
      responses:
        "200": { description: Item with list price and attributes in the session locale }
  /search.screen:
    get:
      tags: [storefront]
      summary: Keyword search over catalog
      responses:
        "200": { description: Matching products }
  /signon.screen:
    get:
      tags: [storefront]
      summary: Sign-on form
      responses:
        "200": { description: Sign-on page; failure renders signon_error.screen }
  /signoff.do:
    get:
      tags: [storefront]
      summary: Sign off and end the session
      responses:
        "200": { description: signoff.screen rendered }
  /createuser.do:
    post:
      tags: [storefront]
      summary: Start customer creation (create_customer.screen)
      responses:
        "200": { description: Account form }
  /createcustomer.do:
    post:
      tags: [storefront]
      summary: Create a customer account, signon user, profile, contact and address
      description: A duplicate user name renders duplicate_account.screen.
      responses:
        "200": { description: Customer created or duplicate_account.screen }
  /customer.do:
    post:
      tags: [storefront]
      summary: Update customer profile, contact info and address (update_customer.screen)
      responses:
        "200": { description: Customer updated }
  /enter_order_information.screen:
    get:
      tags: [storefront]
      summary: Order entry form (contact, address, credit card)
      responses:
        "200": { description: Form }
  /order.do:
    post:
      tags: [storefront]
      summary: Submit the order; renders order_complete.screen
      description: Empty cart renders cart_empty_order_error.screen. Order is handed to the order processing center over JMS.
      responses:
        "200": { description: order_complete.screen }
  /changelocale.do:
    get:
      tags: [storefront]
      summary: Change the session locale (en_US, ja_JP, zh_CN)
      parameters:
        - { name: locale, in: query, schema: { type: string, example: ja_JP } }
      responses:
        "200": { description: locale_change_success.screen }
  /Populate:
    get:
      tags: [storefront]
      summary: Populate the catalog tables from PopulateSQL.xml
      parameters:
        - { name: forcefully, in: query, schema: { type: string } }
      responses:
        "200": { description: Redirect to success or error page }
  /admin/AdminRequestProcessor:
    get:
      tags: [admin]
      summary: Admin start page (launch rich client, log out)
      description: Protected by FORM login, role administrator. POST with currentScreen=manageorders returns a Java Web Start launch file; currentScreen=logout signs out.
      responses:
        "200": { description: index.jsp or JNLP file }
  /admin/ApplRequestProcessor:
    post:
      tags: [admin]
      summary: XML-over-HTTP service used by the rich admin client
      description: >
        Request XML carries a Type element: GETORDERS (orders of a status), UPDATESTATUS
        (approve or deny orders), REVENUE or ORDERS (sales totals between two dates by category
        or item). Unknown Type or no session returns an Error element.
      requestBody:
        content:
          text/xml:
            schema: { type: string }
      responses:
        "200":
          description: XML Response envelope or Error element
          content:
            text/xml:
              schema: { type: string }
  /supplier/RcvrRequestProcessor:
    post:
      tags: [supplier]
      summary: Supplier inventory screens
      description: >
        Form field currentScreen selects displayinventory, updateinventory (qty_<itemId> fields; then
        pending purchase orders are processed and invoices sent in one transaction) or logout.
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                currentScreen: { type: string, enum: [displayinventory, updateinventory, logout] }
      responses:
        "200": { description: index.jsp, displayinventory.jsp, back.jsp or logout.jsp }
  /supplier/Populate:
    get:
      tags: [supplier]
      summary: Populate supplier inventory
      responses:
        "200": { description: Redirect to success or error page }
